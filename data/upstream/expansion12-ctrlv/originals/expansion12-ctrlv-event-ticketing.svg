<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g class="anim-float">
                <!-- Ticket Shape -->
                <g transform="translate(80, 80) rotate(-10)">
                    <rect x="0" y="0" width="240" height="120" rx="4" fill="var(--bg-surface)" stroke="var(--charcoal)" stroke-width="8"/>
                    <!-- Cutouts -->
                    <circle cx="0" cy="60" r="15" fill="var(--bg-surface)" stroke="var(--charcoal)" stroke-width="8"/>
                    <circle cx="240" cy="60" r="15" fill="var(--bg-surface)" stroke="var(--charcoal)" stroke-width="8"/>
                    
                    <!-- Dotted Separator -->
                    <line x1="170" y1="0" x2="170" y2="120" stroke="var(--charcoal)" stroke-width="4" stroke-dasharray="8 8"/>
                    
                    <!-- Barcode -->
                    <g transform="translate(185, 20)">
                        <rect x="0" y="0" width="5" height="80" fill="var(--charcoal)"/>
                        <rect x="10" y="0" width="2" height="80" fill="var(--charcoal)"/>
                        <rect x="15" y="0" width="8" height="80" fill="var(--charcoal)"/>
                        <rect x="30" y="0" width="4" height="80" fill="var(--charcoal)"/>
                        <rect x="40" y="0" width="2" height="80" fill="var(--charcoal)"/>
                    </g>
                    
                    <!-- Ticket Text -->
                    <text x="85" y="50" font-family="monospace" font-weight="bold" font-size="20" fill="var(--primary-color)" text-anchor="middle">ADMIT ONE</text>
                    <rect x="20" y="70" width="130" height="10" rx="2" fill="var(--secondary-color)" opacity="0.4"/>
                    
                    <!-- Star -->
                    <g transform="translate(85, 85)">
                        <g class="anim-pulse" >
                        <path d="M0 -15 L4 -5 L14 -5 L6 2 L9 12 L0 6 L-9 12 L-6 2 L-14 -5 L-4 -5 Z" fill="var(--accent-color)"/>
                    </g>
                    </g>
                </g>
            </g>
          </svg>