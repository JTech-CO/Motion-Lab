<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="200" cy="270" rx="150" ry="12" fill="#E2E8F0"/>
            <g class="anim-float">
                <!-- Browser Window -->
                <rect x="60" y="40" width="280" height="200" rx="8" fill="var(--bg-surface)" stroke="var(--charcoal)" stroke-width="4"/>
                <!-- Speaker View (Main Screen) -->
                <rect x="70" y="50" width="190" height="140" rx="4" fill="var(--primary-color)" opacity="0.1"/>
                <circle cx="165" cy="100" r="25" fill="var(--primary-color)"/>
                <path d="M125 180 C125 140 205 140 205 180" fill="var(--primary-color)"/>
                
                <!-- Grid View (Participants) -->
                <!-- Participant 1 -->
                <rect x="270" y="50" width="60" height="40" rx="4" fill="var(--secondary-color)" opacity="0.2"/>
                <circle cx="300" cy="65" r="8" fill="var(--secondary-color)"/>
                <path d="M285 90 C285 75 315 75 315 90" fill="var(--secondary-color)"/>
                
                <!-- Participant 2 -->
                <rect x="270" y="100" width="60" height="40" rx="4" fill="var(--accent-color)" opacity="0.2"/>
                <circle cx="300" cy="115" r="8" fill="var(--accent-color)"/>
                <path d="M285 140 C285 125 315 125 315 140" fill="var(--accent-color)"/>
                
                <!-- Participant 3 -->
                <rect x="270" y="150" width="60" height="40" rx="4" fill="var(--charcoal)" opacity="0.1"/>
                <circle cx="300" cy="165" r="8" fill="var(--charcoal)" opacity="0.4"/>
                <path d="M285 190 C285 175 315 175 315 190" fill="var(--charcoal)" opacity="0.4"/>
                
                <!-- Toolbar controls -->
                <rect x="70" y="200" width="260" height="30" rx="15" fill="var(--charcoal)" opacity="0.05"/>
                <circle class="anim-pulse" cx="130" cy="215" r="8" fill="var(--secondary-color)"/> <!-- Mute/Mic -->
                <circle cx="160" cy="215" r="8" fill="var(--primary-color)"/> <!-- Video -->
                <circle cx="190" cy="215" r="8" fill="var(--charcoal)" opacity="0.3"/> <!-- Share -->
                <rect class="anim-pulse" style="animation-duration: 2s;" x="250" y="207" width="40" height="16" rx="8" fill="var(--accent-color)"/> <!-- End Call -->
            </g>
          </svg>