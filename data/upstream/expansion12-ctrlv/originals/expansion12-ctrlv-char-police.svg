<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="200" cy="270" rx="140" ry="10" fill="#E2E8F0" opacity="0.6"/>
            <!-- Background: Flashing Patrol Car Lights -->
            <g class="anim-pulse" opacity="0.3">
                <path d="M100 80 Q140 40 180 80" fill="var(--accent-color)"/>
                <path style="animation-delay: 0.5s;" d="M220 80 Q260 40 300 80" fill="var(--primary-color)"/>
                <rect x="100" y="80" width="80" height="20" rx="5" fill="var(--charcoal)"/>
                <rect x="220" y="80" width="80" height="20" rx="5" fill="var(--charcoal)"/>
            </g>
            
            <g class="anim-bounce">
                <!-- Character Body -->
                <path d="M130 260 C130 160 270 160 270 260 Z" fill="var(--secondary-color)"/>
                <!-- Belt & Radio -->
                <path d="M130 220 H270" stroke="var(--charcoal)" stroke-width="12"/>
                <rect x="150" y="210" width="20" height="30" rx="2" fill="var(--charcoal)"/>
                <line x1="160" y1="210" x2="160" y2="190" stroke="var(--charcoal)" stroke-width="4"/>
                
                <!-- Head -->
                <circle cx="200" cy="120" r="35" fill="var(--primary-color)"/>
                
                <!-- Police Hat -->
                <path d="M160 100 Q200 60 240 100 Z" fill="var(--charcoal)"/>
                <path d="M140 100 H260" stroke="var(--charcoal)" stroke-width="6" stroke-linecap="round"/>
                <circle cx="200" cy="90" r="6" fill="var(--accent-color)"/>
                
                <!-- Prop: Badge -->
                <g class="anim-float">
                    <path class="anim-glow" d="M220 160 L240 160 L240 180 L230 190 L220 180 Z" fill="var(--accent-color)"/>
                    <circle cx="230" cy="170" r="4" fill="var(--bg-surface)"/>
                </g>
            </g>
          </svg>