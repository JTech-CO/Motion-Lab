<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g class="anim-float">
                <rect x="100" y="80" width="200" height="140" rx="10" fill="var(--secondary-color)"/>
                <circle cx="200" cy="150" r="50" fill="var(--bg-surface)"/>
                <circle cx="200" cy="150" r="40" stroke="var(--charcoal)" stroke-width="8" stroke-dasharray="10 10" fill="none"/>
                <circle cx="200" cy="150" r="10" fill="var(--charcoal)"/>
                <rect class="anim-pulse" x="250" y="145" width="20" height="10" fill="var(--accent-color)"/>
                
                <g class="anim-bounce">
                    <rect x="140" y="160" width="80" height="50" rx="4" fill="var(--primary-color)"/>
                    <rect x="140" y="170" width="80" height="10" fill="var(--bg-surface)"/>
                    <rect x="150" y="190" width="20" height="10" rx="2" fill="var(--accent-color)"/>
                </g>
            </g>
          </svg>