<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g class="anim-float">
                <!-- Screen Frame -->
                <rect x="40" y="40" width="320" height="200" rx="8" fill="var(--bg-surface)" stroke="var(--charcoal)" stroke-width="8"/>
                
                <!-- Stage Curtains / Background -->
                <path d="M40 40 H360 V180 Q200 140 40 180 Z" fill="var(--primary-color)" opacity="0.2"/>
                
                <!-- Podium -->
                <g transform="translate(260, 160)">
                    <rect x="0" y="0" width="40" height="60" fill="var(--charcoal)"/>
                    <rect x="-10" y="0" width="60" height="10" fill="var(--charcoal)"/>
                </g>
                
                <!-- Presenter Silhouette -->
                <g transform="translate(280, 130)">
                    <g class="anim-bounce" >
                    <circle cx="0" cy="-20" r="15" fill="var(--primary-color)"/>
                    <path d="M-20 20 Q0 -10 20 20 Z" fill="var(--primary-color)"/>
                </g>
                </g>
                
                <!-- Audience Grid (Small icons) -->
                <g class="anim-pulse"  opacity="0.6">
                    <circle cx="80" cy="180" r="15" fill="var(--secondary-color)"/>
                    <circle cx="130" cy="180" r="15" fill="var(--accent-color)"/>
                    <circle cx="180" cy="180" r="15" fill="var(--primary-color)"/>
                </g>
                
                <!-- Webinar Badge -->
                <rect class="anim-pulse" x="60" y="60" width="80" height="20" rx="4" fill="var(--accent-color)"/>
                <circle cx="75" cy="70" r="4" fill="var(--bg-surface)"/>
                <text x="110" y="75" font-family="monospace" font-weight="bold" font-size="10" fill="var(--bg-surface)" text-anchor="middle">LIVE</text>
            </g>
          </svg>