<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            
            <!-- Light Beam In -->
            <path class="anim-draw" d="M0 160 L160 180 M0 140 L160 180" stroke="var(--charcoal)" stroke-width="4" opacity="0.3" fill="none"/>
            
            <!-- Center Prism -->
            <polygon class="anim-float" points="200,60 140,220 260,220" fill="var(--primary-color)" opacity="0.9"/>
            <polygon class="anim-float" points="200,60 140,220 200,220" fill="var(--charcoal)" opacity="0.2"/>
            
            <!-- Refracted Light Beams (Colors split) -->
            <g class="anim-draw">
                <path d="M240 160 L360 80" stroke="var(--accent-color)" stroke-width="8" opacity="0.8"/>
                <path d="M250 180 L400 180" stroke="var(--secondary-color)" stroke-width="8" opacity="0.8"/>
                <path d="M240 200 L360 280" stroke="#EF4444" stroke-width="8" opacity="0.8"/>
            </g>
            
            <g class="anim-float" style="animation-delay:-1.5s">
                <rect x="280" y="240" width="40" height="50" fill="white" stroke="var(--charcoal)" stroke-width="2" transform="rotate(25 300 265)"/>
                <rect x="285" y="245" width="30" height="30" fill="var(--accent-color)" opacity="0.8" transform="rotate(25 300 265)"/>
            </g>
          </svg>