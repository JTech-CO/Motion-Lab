<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g style="animation-duration: 6s;" class="anim-float">
                <!-- Base / Ground -->
                <rect x="80" y="270" width="240" height="10" fill="var(--charcoal)"/>
                
                <!-- The Skyscraper Structure -->
                <!-- Completed lower section -->
                <rect x="140" y="150" width="100" height="120" fill="var(--secondary-color)" stroke="var(--charcoal)" stroke-width="6"/>
                <!-- Windows grid -->
                <g fill="var(--bg-surface)" stroke="var(--charcoal)" stroke-width="2">
                    <rect x="150" y="160" width="20" height="30"/>
                    <rect x="180" y="160" width="20" height="30"/>
                    <rect x="210" y="160" width="20" height="30"/>
                    
                    <rect x="150" y="200" width="20" height="30"/>
                    <rect x="180" y="200" width="20" height="30"/>
                    <rect x="210" y="200" width="20" height="30"/>
                    
                    <rect x="150" y="240" width="20" height="30"/>
                    <rect x="180" y="240" width="20" height="30"/>
                    <rect x="210" y="240" width="20" height="30"/>
                </g>
                
                <!-- In-progress skeleton section -->
                <rect x="150" y="80" width="80" height="70" fill="none" stroke="var(--primary-color)" stroke-width="6"/>
                <line x1="190" y1="80" x2="190" y2="150" stroke="var(--primary-color)" stroke-width="6"/>
                <line x1="150" y1="115" x2="230" y2="115" stroke="var(--primary-color)" stroke-width="6"/>
                
                <!-- Top Crane -->
                <g class="anim-rotate" style="transform-origin: 190px 80px; animation-duration: 8s; animation-direction: alternate;">
                    <rect x="185" y="40" width="10" height="40" fill="var(--charcoal)"/>
                    <line x1="140" y1="40" x2="260" y2="40" stroke="var(--primary-color)" stroke-width="8" stroke-linecap="round"/>
                    <line x1="240" y1="40" x2="240" y2="70" stroke="var(--charcoal)" stroke-width="2"/>
                    <!-- Hook -->
                    <path d="M235 70 H245 V75 C245 80 235 80 235 75 Z" fill="var(--accent-color)"/>
                </g>
            </g>
          </svg>