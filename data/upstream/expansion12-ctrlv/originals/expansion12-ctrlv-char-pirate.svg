<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="200" cy="270" rx="140" ry="10" fill="#E2E8F0" opacity="0.6"/>
            <!-- Background: Ship Wheel & Waves -->
            <g class="anim-float-slow" opacity="0.15">
                <path d="M100 240 Q150 200 200 240 T300 240" stroke="var(--primary-color)" stroke-width="12" stroke-linecap="round" fill="none"/>
                <!-- Wheel -->
                <circle cx="100" cy="100" r="40" stroke="var(--charcoal)" stroke-width="6" fill="none"/>
                <path d="M100 40 V160 M40 100 H160 M60 60 L140 140 M60 140 L140 60" stroke="var(--charcoal)" stroke-width="4"/>
            </g>
            
            <g class="anim-bounce">
                <!-- Character Body -->
                <path d="M140 260 C140 160 240 160 240 260 Z" fill="var(--secondary-color)"/>
                <!-- Belt -->
                <path d="M140 230 H240" stroke="var(--charcoal)" stroke-width="10"/>
                <rect x="175" y="220" width="30" height="20" rx="3" fill="var(--accent-color)"/>
                
                <!-- Head -->
                <circle cx="190" cy="130" r="35" fill="var(--primary-color)"/>
                
                <!-- Eyepatch -->
                <circle cx="175" cy="125" r="8" fill="var(--charcoal)"/>
                <path d="M155 115 L225 135" stroke="var(--charcoal)" stroke-width="4"/>
                
                <!-- Pirate Hat -->
                <path d="M130 110 Q190 70 250 110 Q190 100 130 110 Z" fill="var(--charcoal)"/>
                
                <!-- Prop: Hook -->
                <g class="anim-float" style="transform-origin: 260px 200px;">
                    <path d="M235 190 H265 V210 H235 Z" fill="var(--charcoal)"/>
                    <path class="anim-rotate" d="M250 190 C250 160 280 160 280 190" stroke="var(--accent-color)" stroke-width="6" stroke-linecap="round" fill="none"/>
                </g>
            </g>
          </svg>