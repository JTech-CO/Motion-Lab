<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="200" cy="270" rx="150" ry="12" fill="#E2E8F0"/>
            <!-- Altar/Ofrenda base -->
            <rect x="120" y="210" width="160" height="50" rx="5" fill="var(--secondary-color)" opacity="0.5"/>
            <!-- Sugar Skull center -->
            <g class="anim-float">
              <ellipse cx="200" cy="155" rx="45" ry="55" fill="var(--bg-surface)" stroke="var(--primary-color)" stroke-width="4"/>
              <!-- Skull Jaw -->
              <path d="M160 185 H240 V195 C240 210 220 215 200 215 C180 215 160 210 160 195 V185Z" fill="var(--bg-surface)" stroke="var(--primary-color)" stroke-width="4"/>
              <!-- Eyes (large floral) -->
              <circle cx="178" cy="148" r="18" fill="var(--primary-color)" opacity="0.15"/>
              <circle cx="222" cy="148" r="18" fill="var(--accent-color)" opacity="0.15"/>
              <circle cx="178" cy="148" r="10" fill="var(--primary-color)"/>
              <circle cx="222" cy="148" r="10" fill="var(--accent-color)"/>
              <circle cx="178" cy="148" r="4" fill="var(--charcoal)"/>
              <circle cx="222" cy="148" r="4" fill="var(--charcoal)"/>
              <!-- Nose diamond -->
              <path d="M200 168 L205 174 L200 180 L195 174 Z" fill="var(--secondary-color)"/>
              <!-- Teeth -->
              <path d="M178 195 H185 M192 195 H199 M206 195 H213 M220 195 H227" stroke="var(--primary-color)" stroke-width="3" stroke-linecap="round"/>
              <!-- Forehead floral cross -->
              <path d="M200 100 V120 M188 110 H212" stroke="var(--accent-color)" stroke-width="4" stroke-linecap="round"/>
            </g>
            <!-- Marigold flowers -->
            <g class="anim-pulse">
              <circle cx="120" cy="200" r="20" fill="var(--primary-color)" opacity="0.8"/>
              <circle cx="120" cy="200" r="10" fill="var(--accent-color)"/>
              <circle cx="280" cy="200" r="20" fill="var(--primary-color)" opacity="0.8"/>
              <circle cx="280" cy="200" r="10" fill="var(--accent-color)"/>
            </g>
            <!-- Candles -->
            <g class="anim-glow" fill="var(--accent-color)">
              <rect x="148" y="215" width="10" height="30" rx="3" fill="var(--bg-surface)" stroke="var(--charcoal)" stroke-width="1"/>
              <path d="M153 215 Q150 205 153 195 Q156 205 153 215Z"/>
              <rect x="242" y="215" width="10" height="30" rx="3" fill="var(--bg-surface)" stroke="var(--charcoal)" stroke-width="1"/>
              <path d="M247 215 Q244 205 247 195 Q250 205 247 215Z"/>
            </g>
          </svg>