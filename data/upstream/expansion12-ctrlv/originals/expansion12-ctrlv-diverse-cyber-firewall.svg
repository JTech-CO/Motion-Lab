<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g class="anim-float">
                <!-- Ground / Network -->
                <path d="M40 220 H360 M80 240 H320" stroke="var(--charcoal)" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
                
                <!-- Firewall Brick Wall -->
                <g class="anim-bounce">
                    <rect x="150" y="80" width="100" height="140" fill="var(--primary-color)"/>
                    <!-- Brick Lines -->
                    <path d="M150 100 H250 M150 120 H250 M150 140 H250 M150 160 H250 M150 180 H250 M150 200 H250" stroke="var(--bg-surface)" stroke-width="3"/>
                    <path d="M175 80 V100 M225 80 V100 M200 100 V120 M175 120 V140 M225 120 V140 M200 140 V160 M175 160 V180 M225 160 V180 M200 180 V200 M175 200 V220 M225 200 V220" stroke="var(--bg-surface)" stroke-width="3"/>
                </g>
                
                <!-- Flame / Fire on top -->
                <g transform="translate(200, 60)">
                    <g class="anim-pulse">
                    <path d="M0 20 C-30 20 -40 -10 -15 -30 C-20 -15 -10 -5 0 -20 C10 -5 20 -15 15 -30 C40 -10 30 20 0 20 Z" fill="var(--accent-color)"/>
                    <path d="M0 20 C-15 20 -20 -5 -5 -15 C-10 -5 -5 0 0 -10 C5 0 10 -5 5 -15 C20 -5 15 20 0 20 Z" fill="var(--secondary-color)"/>
                </g>
                </g>
                
                <!-- Threats bouncing off -->
                <circle class="anim-draw" cx="100" cy="150" r="10" fill="var(--charcoal)"/>
                <path class="anim-draw" d="M70 150 H90 M75 165 L85 155 M75 135 L85 145" stroke="var(--charcoal)" stroke-width="4" stroke-linecap="round"/>
                
                <!-- Protected Data -->
                <rect x="280" y="130" width="40" height="40" rx="5" fill="var(--secondary-color)"/>
                <path d="M290 150 H310" stroke="var(--bg-surface)" stroke-width="4" stroke-linecap="round"/>
            </g>
          </svg>