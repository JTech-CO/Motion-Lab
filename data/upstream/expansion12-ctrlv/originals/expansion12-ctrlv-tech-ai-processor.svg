<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g class="anim-float">
                <!-- Microchip Base -->
                <rect x="100" y="50" width="200" height="200" rx="8" fill="var(--charcoal)"/>
                <rect x="110" y="60" width="180" height="180" rx="4" fill="var(--bg-surface)"/>
                
                <!-- Pins -->
                <g stroke="var(--charcoal)" stroke-width="8" stroke-linecap="round">
                    <line x1="120" y1="50" x2="120" y2="35"/>
                    <line x1="160" y1="50" x2="160" y2="35"/>
                    <line x1="200" y1="50" x2="200" y2="35"/>
                    <line x1="240" y1="50" x2="240" y2="35"/>
                    <line x1="280" y1="50" x2="280" y2="35"/>
                    
                    <line x1="120" y1="250" x2="120" y2="265"/>
                    <line x1="160" y1="250" x2="160" y2="265"/>
                    <line x1="200" y1="250" x2="200" y2="265"/>
                    <line x1="240" y1="250" x2="240" y2="265"/>
                    <line x1="280" y1="250" x2="280" y2="265"/>
                    
                    <line x1="100" y1="80" x2="85" y2="80"/>
                    <line x1="100" y1="120" x2="85" y2="120"/>
                    <line x1="100" y1="160" x2="85" y2="160"/>
                    <line x1="100" y1="200" x2="85" y2="200"/>
                    
                    <line x1="300" y1="80" x2="315" y2="80"/>
                    <line x1="300" y1="120" x2="315" y2="120"/>
                    <line x1="300" y1="160" x2="315" y2="160"/>
                    <line x1="300" y1="200" x2="315" y2="200"/>
                </g>
                
                <!-- Core Brain Icon -->
                <g transform="translate(200, 150)">
                    <g class="anim-pulse" >
                    <rect x="-60" y="-60" width="120" height="120" rx="10" fill="var(--primary-color)" opacity="0.1"/>
                    <circle r="40" fill="var(--accent-color)" opacity="0.2"/>
                    <!-- Brain Silhouette -->
                    <path d="M-20 0 C-40 -40 0 -50 0 -20 C0 -50 40 -40 20 0 C40 40 0 50 0 20 C0 50 -40 40 -20 0 Z" fill="var(--primary-color)"/>
                    <circle r="10" fill="var(--secondary-color)"/>
                </g>
                </g>
                
                <!-- Circuit Traces -->
                <path class="anim-draw" d="M120 70 V130 H160 M280 230 V170 H240" stroke="var(--charcoal)" stroke-width="2" fill="none" opacity="0.3"/>
            </g>
          </svg>