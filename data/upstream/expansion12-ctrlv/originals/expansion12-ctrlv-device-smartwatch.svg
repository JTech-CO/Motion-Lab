            <path class="anim-float" d="M170 50 Q160 100 170 120 L230 120 Q240 100 230 50 Z" fill="var(--charcoal)" opacity="0.8"/>
            <path class="anim-float" d="M170 180 Q160 250 170 280 L230 280 Q240 250 230 180 Z" fill="var(--charcoal)" opacity="0.8"/>
            <!-- Watch face -->
