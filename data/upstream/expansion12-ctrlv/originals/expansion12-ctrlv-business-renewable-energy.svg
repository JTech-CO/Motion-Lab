<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g class="anim-float">
                <!-- Ground -->
                <path d="M40 260 H360" stroke="var(--charcoal)" stroke-width="8" stroke-linecap="round"/>
                
                <!-- Solar Panel -->
                <g transform="translate(80, 200)">
                    <path d="M20 60 L40 0 H100 L80 60 Z" fill="var(--secondary-color)"/>
                    <path d="M40 0 L80 60" stroke="var(--bg-surface)" stroke-width="3"/>
                    <path d="M60 0 L100 60" stroke="var(--bg-surface)" stroke-width="3"/>
                    <path d="M30 30 H90" stroke="var(--bg-surface)" stroke-width="3"/>
                    <path d="M60 60 V100" stroke="var(--charcoal)" stroke-width="6"/> <!-- Stand -->
                </g>
                
                <!-- Wind Turbine -->
                <g transform="translate(250, 260)">
                    <!-- Tower -->
                    <path d="M-5 -120 L-10 0 H10 L5 -120 Z" fill="var(--charcoal)"/>
                    <circle cx="0" cy="-120" r="10" fill="var(--bg-surface)" stroke="var(--charcoal)" stroke-width="4"/>
                    
                    <!-- Blades -->
                    <g class="anim-rotate" >
                        <path d="M0 -120 Q-10 -180 0 -200 Q10 -180 0 -120 Z" fill="var(--primary-color)"/>
                        <path d="M0 -120 Q60 -90 70 -40 Q40 -60 0 -120 Z" fill="var(--primary-color)"/>
                        <path d="M0 -120 Q-60 -90 -70 -40 Q-40 -60 0 -120 Z" fill="var(--primary-color)"/>
                    </g>
                </g>
                
                <!-- Sun / Energy -->
                <circle class="anim-pulse" cx="200" cy="80" r="40" fill="var(--accent-color)" opacity="0.3"/>
                <circle class="anim-pulse" style="animation-delay: 0.2s;" cx="200" cy="80" r="20" fill="var(--accent-color)"/>
                <path class="anim-draw" d="M120 120 L160 100 M280 120 L240 100" stroke="var(--accent-color)" stroke-width="4" stroke-linecap="round" fill="none"/>
            </g>
          </svg>