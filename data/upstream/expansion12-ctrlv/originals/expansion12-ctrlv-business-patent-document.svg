<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g class="anim-float">
                <!-- Certificate / Document -->
                <rect x="100" y="40" width="200" height="240" fill="var(--bg-surface)" stroke="var(--charcoal)" stroke-width="8"/>
                <rect x="110" y="50" width="180" height="220" fill="none" stroke="var(--primary-color)" stroke-width="4"/>
                
                <!-- Text Lines -->
                <line x1="140" y1="80" x2="260" y2="80" stroke="var(--charcoal)" stroke-width="6" stroke-linecap="round"/>
                <line x1="140" y1="100" x2="220" y2="100" stroke="var(--charcoal)" stroke-width="4" stroke-linecap="round"/>
                <line x1="140" y1="120" x2="260" y2="120" stroke="var(--charcoal)" stroke-width="4" stroke-linecap="round"/>
                
                <!-- Lightbulb / Invention Graphic on Doc -->
                <g transform="translate(200, 180)">
                    <g class="anim-pulse">
                    <circle cx="0" cy="-10" r="25" fill="var(--accent-color)"/>
                    <path d="M-15 0 L-10 20 H10 L15 0 Z" fill="var(--charcoal)"/>
                    <path d="M-10 25 H10 M-8 30 H8 M-5 35 H5" stroke="var(--bg-surface)" stroke-width="3"/>
                    <path class="anim-draw" d="M0 -15 V-5" stroke="var(--bg-surface)" stroke-width="4" stroke-linecap="round"/>
                </g>
                </g>
                
                <!-- Wax Seal / Stamp -->
                <g transform="translate(130, 240)">
                    <g class="anim-bounce">
                    <circle cx="0" cy="0" r="20" fill="var(--secondary-color)"/>
                    <circle cx="0" cy="0" r="15" fill="none" stroke="var(--bg-surface)" stroke-width="2" stroke-dasharray="2 2"/>
                    <path d="M-10 20 L-15 40 L-5 35 L5 40 L0 20 Z" fill="var(--secondary-color)"/>
                    <path d="M0 20 L5 40 L15 35 L10 20 Z" fill="var(--primary-color)"/>
                </g>
                </g>
            </g>
          </svg>