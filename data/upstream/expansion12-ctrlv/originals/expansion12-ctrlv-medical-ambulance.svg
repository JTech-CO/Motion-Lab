<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="200" cy="270" rx="160" ry="12" fill="#E2E8F0" opacity="0.6"/>
            <!-- Motion lines -->
            <path class="anim-draw" d="M40 240 H80 M20 220 H60 M50 200 H90" stroke="var(--secondary-color)" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.5"/>
            
            <g class="anim-bounce">
                <!-- Back Wheels -->
                <circle class="anim-rotate"  cx="140" cy="240" r="25" fill="var(--charcoal)"/>
                <circle class="anim-rotate"  cx="140" cy="240" r="12" fill="var(--bg-surface)"/>
                <!-- Front Wheels -->
                <circle class="anim-rotate"  cx="300" cy="240" r="25" fill="var(--charcoal)"/>
                <circle class="anim-rotate"  cx="300" cy="240" r="12" fill="var(--bg-surface)"/>
                
                <!-- Main Van Body -->
                <path d="M80 100 H260 C270 100 280 110 290 120 L330 160 C340 170 340 180 340 240 H80 Z" fill="var(--bg-surface)"/>
                <path d="M80 100 H260 C270 100 280 110 290 120 L330 160 C340 170 340 180 340 240 H80 Z" stroke="var(--charcoal)" stroke-width="4" fill="none"/>
                
                <!-- Front Window -->
                <path d="M265 110 H280 L315 150 H265 Z" fill="var(--secondary-color)" opacity="0.5"/>
                <!-- Side Window -->
                <rect x="200" y="110" width="50" height="40" rx="5" fill="var(--secondary-color)" opacity="0.5"/>
                
                <!-- Red Stripe -->
                <rect x="80" y="170" width="260" height="20" fill="var(--primary-color)"/>
                
                <!-- Medical Cross -->
                <path d="M125 140 H155 M140 125 V155" stroke="var(--primary-color)" stroke-width="12" stroke-linecap="round"/>
                
                <!-- Headlight -->
                <path d="M340 200 V210 C345 210 350 205 350 200 Z" fill="var(--accent-color)"/>
                <path class="anim-glow" d="M350 205 L380 190 M350 205 L390 205 M350 205 L380 220" stroke="var(--accent-color)" stroke-width="3" stroke-linecap="round"/>
                
                <!-- Siren Light on Top -->
                <path d="M120 100 V80 C120 70 140 70 140 80 V100 Z" fill="var(--secondary-color)"/>
                <circle class="anim-glow" cx="130" cy="85" r="8" fill="var(--accent-color)"/>
            </g>
          </svg>