<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            
            <!-- Mechanical Analytical Engine Elements (Abstract Gears) -->
            <g class="anim-rotate" >
                <!-- Gear 1 -->
                <circle cx="120" cy="180" r="40" fill="none" stroke="var(--charcoal)" stroke-width="8" stroke-dasharray="10 10"/>
                <circle cx="120" cy="180" r="30" fill="var(--secondary-color)" opacity="0.3"/>
                <circle cx="120" cy="180" r="10" fill="var(--primary-color)"/>
            </g>
            
            <g class="anim-rotate" >
                <!-- Gear 2 -->
                <circle cx="200" cy="220" r="50" fill="none" stroke="var(--charcoal)" stroke-width="8" stroke-dasharray="15 10"/>
                <circle cx="200" cy="220" r="35" fill="var(--primary-color)" opacity="0.8"/>
                <circle cx="200" cy="220" r="15" fill="white"/>
            </g>

            <!-- Vintage Punch Card flowing out -->
            <g class="anim-float">
                <path d="M160 140 L260 70 L340 140 L240 210 Z" fill="var(--primary-color)"/>
                <path d="M160 140 L260 70 L340 140 L240 210 Z" stroke="white" stroke-width="4" fill="none" stroke-linejoin="round"/>
                
                <!-- Punched Holes -->
                <!-- Row 1 -->
                <circle cx="220" cy="110" r="4" fill="var(--bg-surface)"/>
                <circle cx="240" cy="125" r="4" fill="var(--bg-surface)"/>
                <circle cx="280" cy="155" r="4" fill="var(--bg-surface)"/>
                <!-- Row 2 -->
                <circle cx="200" cy="130" r="4" fill="var(--bg-surface)"/>
                <circle cx="260" cy="175" r="4" fill="var(--bg-surface)"/>
                <circle cx="280" cy="190" r="4" fill="var(--bg-surface)"/>
                
                <!-- Binary or Code Data flowing -->
                <path class="anim-data" d="M190 110 L280 170 M180 120 L270 180 M200 130 L290 190" stroke="white" stroke-dasharray="6 4" stroke-width="2" fill="none"/>
            </g>
            
            <!-- Mathematical Aura / Algorithms -->
            <path class="anim-pulse" d="M80 120 L100 100 L120 120" stroke="var(--accent-color)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            <path class="anim-pulse" d="M260 40 L280 20 L300 40" stroke="var(--accent-color)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" style="animation-delay: 0.5s"/>
            <circle cx="90" cy="90" r="2" fill="var(--charcoal)"/>
            <circle cx="290" cy="30" r="2" fill="var(--charcoal)"/>
          </svg>