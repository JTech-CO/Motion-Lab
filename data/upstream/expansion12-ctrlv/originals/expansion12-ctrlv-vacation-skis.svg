<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g class="anim-float">
                <!-- Skis -->
                <path d="M80 60 C80 40 100 40 100 60 V240 H80 Z" fill="var(--primary-color)"/>
                <path d="M120 60 C120 40 140 40 140 60 V240 H120 Z" fill="var(--primary-color)"/>
                <path d="M100 60 V240" stroke="var(--secondary-color)" stroke-width="8"/>
                <path d="M140 60 V240" stroke="var(--secondary-color)" stroke-width="8"/>
                
                <!-- Bindings -->
                <rect x="75" y="140" width="30" height="20" rx="4" fill="var(--charcoal)"/>
                <rect x="115" y="140" width="30" height="20" rx="4" fill="var(--charcoal)"/>
                
                <!-- Poles (Crossed) -->
                <path class="anim-pulse" d="M180 220 L300 80 M300 220 L180 80" stroke="var(--charcoal)" stroke-width="6" stroke-linecap="round"/>
                
                <!-- Handles -->
                <rect x="285" y="70" width="10" height="40" rx="5" transform="rotate(45 290 90)" fill="var(--accent-color)"/>
                <rect x="175" y="70" width="10" height="40" rx="5" transform="rotate(-45 180 90)" fill="var(--accent-color)"/>
                
                <!-- Baskets -->
                <ellipse cx="190" cy="210" rx="15" ry="5" transform="rotate(-45 190 210)" fill="var(--secondary-color)"/>
                <ellipse cx="290" cy="210" rx="15" ry="5" transform="rotate(45 290 210)" fill="var(--secondary-color)"/>
            </g>
          </svg>