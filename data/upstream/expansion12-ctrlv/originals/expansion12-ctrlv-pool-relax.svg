<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Pool Surface with perspective -->
        <path d="M50 200 Q200 180 350 200 L380 280 H20 Z" fill="var(--primary-color)" opacity="0.1"/>
        
        <!-- Animated Ripples -->
        <g class="anim-float">
            <path d="M80 220 Q200 210 320 220" stroke="var(--primary-color)" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
            <path d="M60 250 Q200 240 340 250" stroke="var(--primary-color)" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
        </g>
        
        <!-- Relaxing Character (simplified stylish) -->
        <g class="anim-bounce">
            <circle cx="200" cy="140" r="30" fill="var(--bg-surface)" stroke="var(--primary-color)" stroke-width="2"/>
            <path d="M180 140 Q200 150 220 140" stroke="var(--charcoal)" stroke-width="2" fill="none"/>
            <!-- Sunglasses -->
            <rect x="175" y="130" width="20" height="12" rx="4" fill="var(--charcoal)"/>
            <rect x="205" y="130" width="20" height="12" rx="4" fill="var(--charcoal)"/>
        </g>
        
        <!-- Beach Ball -->
        <g class="anim-rotate" style="animation-duration: 4s">
            <circle cx="300" cy="120" r="25" fill="var(--accent-color)" opacity="0.8"/>
            <path d="M300 120 L280 105 M300 120 L320 105 M300 120 V145" stroke="white" stroke-width="2"/>
        </g>
    </svg>