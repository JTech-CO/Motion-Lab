<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g class="anim-float">
                <!-- Parcel Box -->
                <g class="anim-bounce">
                    <rect x="120" y="100" width="160" height="140" rx="4" fill="var(--bg-surface)" stroke="var(--charcoal)" stroke-width="8"/>
                    <!-- Tape -->
                    <rect x="120" y="160" width="160" height="20" fill="var(--primary-color)" opacity="0.6"/>
                    <path d="M200 100 V240" stroke="var(--charcoal)" stroke-width="4" opacity="0.2"/>
                    
                    <!-- Label -->
                    <rect x="220" y="120" width="40" height="30" rx="2" fill="var(--secondary-color)"/>
                    <path d="M225 130 H255 M225 140 H245" stroke="var(--bg-surface)" stroke-width="2"/>
                </g>
                
                <!-- Speed Lines -->
                <g class="anim-draw" stroke="var(--accent-color)" stroke-width="8" stroke-linecap="round">
                    <line x1="60" y1="120" x2="100" y2="120"/>
                    <line x1="40" y1="170" x2="90" y2="170"/>
                    <line x1="70" y1="220" x2="110" y2="220"/>
                </g>
                
                <!-- Tracking Node -->
                <circle class="anim-pulse" cx="200" cy="60" r="15" fill="var(--accent-color)" opacity="0.3"/>
                <circle cx="200" cy="60" r="6" fill="var(--accent-color)"/>
                <path d="M200 60 L200 100" stroke="var(--accent-color)" stroke-width="2" stroke-dasharray="4 4"/>
            </g>
          </svg>