<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g class="anim-float">
                <!-- Bezier Curve -->
                <path class="anim-draw" d="M80 220 Q200 40 320 220" stroke="var(--primary-color)" stroke-width="8" stroke-linecap="round" fill="none"/>
                
                <!-- Anchors and Handles -->
                <line class="anim-draw" x1="80" y1="220" x2="200" y2="40" stroke="var(--charcoal)" stroke-width="2" stroke-dasharray="4 4"/>
                <line class="anim-draw" x1="320" y1="220" x2="200" y2="40" stroke="var(--charcoal)" stroke-width="2" stroke-dasharray="4 4"/>
                
                <rect class="anim-pulse" x="70" y="210" width="20" height="20" fill="var(--bg-surface)" stroke="var(--charcoal)" stroke-width="4"/>
                <rect class="anim-pulse" style="animation-delay: 0.2s;" x="310" y="210" width="20" height="20" fill="var(--bg-surface)" stroke="var(--charcoal)" stroke-width="4"/>
                <circle class="anim-bounce" cx="200" cy="40" r="12" fill="var(--accent-color)"/>
                
                <!-- Pen Tool Icon -->
                <g class="anim-rotate" >
                    <path d="M200 100 L215 130 H185 Z" fill="var(--charcoal)"/>
                    <path d="M200 45 L200 100" stroke="var(--charcoal)" stroke-width="4" stroke-linecap="round"/>
                </g>
            </g>
          </svg>