<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!--Alien Terrain-->
            <ellipse cx="200" cy="270" rx="160" ry="12" fill="var(--secondary-color)" opacity="0.2"/>
            <path class="anim-float" d="M40 260 Q100 220 160 260 T280 260 T400 240 V300 H0 V260 Z" fill="var(--primary-color)" opacity="0.1"/>

            <!--Background Planet-->
            <circle class="anim-float" cx="300" cy="100" r="40" fill="var(--primary-color)" opacity="0.3"/>
            <g transform="rotate(-15 300 100)">
                <ellipse class="anim-float" cx="300" cy="100" rx="60" ry="15" fill="none" stroke="var(--primary-color)" stroke-width="4" opacity="0.3" />
            </g>

            <!--Main Bio - Dome-->
            <path class="anim-bounce" d="M120 260 C120 180 280 180 280 260 Z" fill="white" opacity="0.9"/>
            <path class="anim-bounce" d="M120 260 C120 180 280 180 280 260 Z" stroke="var(--primary-color)" stroke-width="4" fill="none"/>
            <!--Dome Grid Lines-->
            <path class="anim-bounce" d="M160 260 C160 200 240 200 240 260 M200 185 V260 M140 225 H260" stroke="var(--primary-color)" stroke-width="2" fill="none" opacity="0.5"/>
            
            <!--Bio - Content(Trees / Greenery inside)-->
            <circle class="anim-bounce" cx="170" cy="240" r="15" fill="var(--secondary-color)"/>
            <circle class="anim-bounce" cx="200" cy="230" r="20" fill="var(--secondary-color)"/>
            <circle class="anim-bounce" cx="230" cy="240" r="15" fill="var(--secondary-color)"/>
            
            <!--Connected Sub - Dome-->
            <path class="anim-bounce" d="M260 260 C260 220 340 220 340 260 Z" fill="var(--charcoal)" opacity="0.8"/>
            <rect class="anim-bounce" x="290" y="240" width="20" height="20" rx="4" fill="var(--accent-color)"/>
            
            <!--Connection Tube-->
            <rect class="anim-bounce" x="250" y="240" width="30" height="15" fill="white"/>
            <line class="anim-bounce" x1="250" y1="247" x2="280" y2="247" stroke="var(--charcoal)" stroke-width="2"/>

            <!--Communication Array / Antenna-->
            <path class="anim-draw" d="M200 185 V140 M190 150 L210 140 M190 140 L210 130" stroke="var(--charcoal)" stroke-width="3" stroke-linecap="round"/>
            <circle class="anim-glow" cx="200" cy="135" r="4" fill="var(--accent-color)"/>
          </svg>