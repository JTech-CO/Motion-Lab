<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Ground / street -->
            <rect x="0" y="240" width="400" height="60" fill="var(--charcoal)" opacity="0.06"/>

            <!-- Rainbow banner -->
            <g class="anim-float" style="animation-duration: 4s;">
              <line x1="80" y1="50" x2="80" y2="120" stroke="var(--charcoal)" stroke-width="4" stroke-linecap="round"/>
              <line x1="320" y1="50" x2="320" y2="120" stroke="var(--charcoal)" stroke-width="4" stroke-linecap="round"/>
              <!-- Banner stripes -->
              <path d="M80 55 H320 V70 H80 Z" fill="#FF0018"/>
              <path d="M80 70 H320 V83 H80 Z" fill="#FFA52C"/>
              <path d="M80 83 H320 V96 H80 Z" fill="#FFFF41"/>
              <path d="M80 96 H320 V109 H80 Z" fill="#008018"/>
              <path d="M80 109 H320 V122 H80 Z" fill="#0000F9"/>
              <!-- Banner text -->
              <text x="200" y="94" font-family="sans-serif" font-weight="bold" font-size="14" fill="white" text-anchor="middle" letter-spacing="1" opacity="0.95">PRIDE</text>
            </g>

            <!-- Crowd of figures (stylised, diverse) -->
            <!-- Figure 1 - left, red top -->
            <g transform="translate(80, 170)">
              <g class="anim-bounce" style="animation-duration: 6s;">
                <circle cx="0" cy="-40" r="16" fill="#F5CBA7" stroke="var(--charcoal)" stroke-width="2"/>
                <path d="M-15 -24 Q-15 20 -20 50 H20 Q15 20 15 -24 Z" fill="#FF0018" stroke="var(--charcoal)" stroke-width="2"/>
                <!-- Left arm raised with flag -->
                <path d="M-15 -10 Q-35 -30 -40 -50" stroke="#F5CBA7" stroke-width="10" stroke-linecap="round"/>
                <rect x="-42" y="-68" width="18" height="12" fill="#FF0018"/>
                <rect x="-42" y="-56" width="18" height="8" fill="#FFFF41"/>
                <rect x="-42" y="-48" width="18" height="8" fill="#0000F9"/>
                <line x1="-42" y1="-68" x2="-42" y2="-40" stroke="var(--charcoal)" stroke-width="2"/>
              </g>
            </g>

            <!-- Figure 2 - center-left, purple top -->
            <g transform="translate(145, 195)">
              <g class="anim-bounce" style="animation-duration: 5s; animation-delay: -1s;">
                <circle cx="0" cy="-40" r="14" fill="#FDBCB4" stroke="var(--charcoal)" stroke-width="2"/>
                <path d="M-13 -26 Q-12 15 -15 45 H15 Q12 15 13 -26 Z" fill="#86007D" stroke="var(--charcoal)" stroke-width="2"/>
                <path d="M13 -10 Q30 -20 35 -10" stroke="#FDBCB4" stroke-width="9" stroke-linecap="round"/>
                <path d="M-13 -10 Q-28 5 -30 20" stroke="#FDBCB4" stroke-width="9" stroke-linecap="round"/>
              </g>
            </g>

            <!-- Figure 3 - center, teal top -->
            <g transform="translate(210, 180)">
              <g class="anim-bounce" style="animation-duration: 7s; animation-delay: -2s;">
                <circle cx="0" cy="-45" r="18" fill="#D4956A" stroke="var(--charcoal)" stroke-width="2"/>
                <path d="M-16 -27 Q-15 20 -18 55 H18 Q15 20 16 -27 Z" fill="#008098" stroke="var(--charcoal)" stroke-width="2"/>
                <!-- Both arms up -->
                <path d="M-16 -15 Q-38 -35 -42 -55" stroke="#D4956A" stroke-width="11" stroke-linecap="round"/>
                <path d="M16 -15 Q38 -35 42 -55" stroke="#D4956A" stroke-width="11" stroke-linecap="round"/>
              </g>
            </g>

            <!-- Figure 4 - center-right, yellow top -->
            <g transform="translate(275, 190)">
              <g class="anim-bounce" style="animation-duration: 6s; animation-delay: -3s;">
                <circle cx="0" cy="-40" r="14" fill="#F5CBA7" stroke="var(--charcoal)" stroke-width="2"/>
                <path d="M-13 -26 Q-12 15 -15 45 H15 Q12 15 13 -26 Z" fill="#FFA52C" stroke="var(--charcoal)" stroke-width="2"/>
                <path d="M13 -12 Q32 -5 36 10" stroke="#F5CBA7" stroke-width="9" stroke-linecap="round"/>
              </g>
            </g>

            <!-- Figure 5 - right, blue top -->
            <g transform="translate(330, 175)">
              <g class="anim-bounce" style="animation-duration: 5s; animation-delay: -1.5s;">
                <circle cx="0" cy="-40" r="16" fill="#FDBCB4" stroke="var(--charcoal)" stroke-width="2"/>
                <path d="M-14 -24 Q-14 20 -18 50 H18 Q14 20 14 -24 Z" fill="#0000F9" stroke="var(--charcoal)" stroke-width="2"/>
                <path d="M-14 -10 Q-35 -25 -39 -48" stroke="#FDBCB4" stroke-width="10" stroke-linecap="round"/>
              </g>
            </g>

            <!-- Confetti / dots floating -->
            <g class="anim-pulse" style="animation-duration: 2s;">
              <circle cx="110" cy="145" r="5" fill="#FF0018" opacity="0.7"/>
              <circle cx="185" cy="130" r="4" fill="#FFFF41" opacity="0.7"/>
              <circle cx="250" cy="140" r="5" fill="#008018" opacity="0.7"/>
              <circle cx="300" cy="135" r="3" fill="#0000F9" opacity="0.7"/>
              <circle cx="355" cy="148" r="4" fill="#86007D" opacity="0.7"/>
            </g>
          </svg>