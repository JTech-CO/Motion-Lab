<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g style="animation-duration: 6s;" class="anim-float">
                <!-- Wooden Pallet Base -->
                <rect x="80" y="240" width="240" height="15" rx="2" fill="var(--secondary-color)" stroke="var(--charcoal)" stroke-width="4"/>
                <rect x="100" y="255" width="20" height="15" fill="var(--charcoal)"/>
                <rect x="190" y="255" width="20" height="15" fill="var(--charcoal)"/>
                <rect x="280" y="255" width="20" height="15" fill="var(--charcoal)"/>
                <rect x="80" y="270" width="240" height="10" rx="2" fill="var(--secondary-color)" stroke="var(--charcoal)" stroke-width="4"/>
                
                <!-- Stacked Bags -->
                <!-- Bottom Row -->
                <path d="M100 240 C100 220 120 210 160 210 C200 210 210 220 210 240 Z" fill="var(--primary-color)" stroke="var(--charcoal)" stroke-width="4"/>
                <path d="M190 240 C190 220 210 210 250 210 C290 210 300 220 300 240 Z" fill="var(--bg-surface)" stroke="var(--charcoal)" stroke-width="4"/>
                
                <!-- Middle Row -->
                <path d="M140 210 C140 190 160 180 200 180 C240 180 250 190 250 210 Z" fill="var(--secondary-color)" stroke="var(--charcoal)" stroke-width="4"/>
                
                <!-- Top Bag (Animated dropping or settling) -->
                <g class="anim-bounce" style="animation-duration: 6s;">
                    <path d="M160 180 C160 160 180 150 220 150 C260 150 270 160 270 180 Z" fill="var(--primary-color)" stroke="var(--charcoal)" stroke-width="4"/>
                    <!-- Logo / Label on Top Bag -->
                    <circle cx="215" cy="165" r="8" fill="var(--bg-surface)"/>
                    <path d="M205 165 H225" stroke="var(--accent-color)" stroke-width="3"/>
                </g>
                
                <!-- Cement Dust Particles -->
                <circle style="animation-duration: 4s;" class="anim-pulse" cx="130" cy="190" r="4" fill="var(--bg-surface)" stroke="var(--charcoal)" stroke-width="2"/>
                <circle class="anim-pulse" style="animation-duration: 4s; animation-delay: 0.3s;" cx="260" cy="200" r="5" fill="var(--bg-surface)" stroke="var(--charcoal)" stroke-width="2"/>
                <circle class="anim-pulse" style="animation-duration: 4s; animation-delay: 0.6s;" cx="180" cy="140" r="3" fill="var(--bg-surface)" stroke="var(--charcoal)" stroke-width="2"/>
            </g>
          </svg>