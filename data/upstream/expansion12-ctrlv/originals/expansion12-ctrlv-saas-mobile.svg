<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            
            <!-- Desktop context floating behind -->
            <rect class="anim-float" style="animation-duration: 4s;" x="80" y="60" width="240" height="160" rx="8" fill="var(--bg-surface)" stroke="var(--primary-color)" stroke-width="2" opacity="0.3"/>
            <path class="anim-float" style="animation-duration: 4s;" d="M80 80 H320" stroke="var(--primary-color)" stroke-width="2" opacity="0.3"/>
            <rect class="anim-float" style="animation-duration: 4s;" x="100" y="100" width="60" height="40" rx="4" fill="var(--primary-color)" opacity="0.1"/>
            <rect class="anim-float" style="animation-duration: 4s;" x="180" y="100" width="120" height="40" rx="4" fill="var(--secondary-color)" opacity="0.1"/>

            <g class="anim-bounce">
                <!-- Mobile Device -->
                <rect x="140" y="20" width="120" height="240" rx="15" fill="var(--bg-surface)" stroke="var(--charcoal)" stroke-width="6"/>
                <!-- Notch -->
                <path d="M180 23 h40 v8 a5 5 0 0 1 -5 5 h-30 a5 5 0 0 1 -5 -5 v-8 Z" fill="var(--charcoal)"/>
                
                <!-- App Header -->
                <circle cx="160" cy="60" r="10" fill="var(--primary-color)"/>
                <line x1="180" y1="60" x2="240" y2="60" stroke="var(--charcoal)" stroke-width="4" stroke-linecap="round"/>
                
                <!-- Main Metric Card -->
                <rect x="155" y="85" width="90" height="60" rx="8" fill="var(--secondary-color)"/>
                <path class="anim-draw" d="M165 130 L180 110 L195 120 L225 95" stroke="#FFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                
                <!-- List Items -->
                <rect x="155" y="160" width="90" height="20" rx="4" fill="var(--charcoal)" opacity="0.1"/>
                <rect x="155" y="190" width="90" height="20" rx="4" fill="var(--charcoal)" opacity="0.1"/>
                <rect x="155" y="220" width="90" height="20" rx="4" fill="var(--charcoal)" opacity="0.1"/>
                <circle cx="165" cy="170" r="4" fill="var(--accent-color)"/>
                <circle cx="165" cy="200" r="4" fill="var(--primary-color)"/>
                <circle cx="165" cy="230" r="4" fill="var(--secondary-color)"/>
                <path class="anim-draw" d="M175 170 H235 M175 200 H220 M175 230 H210" stroke="var(--charcoal)" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
            </g>
          </svg>