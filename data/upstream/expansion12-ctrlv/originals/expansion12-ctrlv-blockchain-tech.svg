<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="200" cy="270" rx="150" ry="12" fill="#e2e8f0" opacity="0.6"/>
            <!-- Connected Isometric Hexagons (Blockchain) -->
            <g class="anim-float" style="animation-delay: -0.5s">
                <path d="M80 180 L120 160 L160 180 L160 220 L120 240 L80 220 Z" fill="var(--primary-color)"/>
                <path d="M120 160 L160 180 L120 200 L80 180 Z" fill="white" opacity="0.3"/>
                <path d="M160 180 L160 220 L120 200 L120 160 Z" fill="var(--charcoal)" opacity="0.2"/>
                <circle class="anim-glow" cx="120" cy="200" r="10" fill="var(--accent-color)"/>
            </g>
            <g class="anim-float" style="animation-delay: -1s">
                <path d="M160 120 L200 100 L240 120 L240 160 L200 180 L160 160 Z" fill="var(--primary-color)"/>
                <path d="M200 100 L240 120 L200 140 L160 120 Z" fill="white" opacity="0.3"/>
                <path d="M240 120 L240 160 L200 140 L200 100 Z" fill="var(--charcoal)" opacity="0.2"/>
                <circle class="anim-glow" cx="200" cy="140" r="10" fill="var(--secondary-color)"/>
            </g>
            <g class="anim-float" style="animation-delay: -1.5s">
                <path d="M240 180 L280 160 L320 180 L320 220 L280 240 L240 220 Z" fill="var(--primary-color)"/>
                <path d="M280 160 L320 180 L280 200 L240 180 Z" fill="white" opacity="0.3"/>
                <path d="M320 180 L320 220 L280 200 L280 160 Z" fill="var(--charcoal)" opacity="0.2"/>
                <circle class="anim-glow" cx="280" cy="200" r="10" fill="var(--accent-color)"/>
            </g>
            <!-- Glowing Ledger Beam -->
            <path class="anim-data" d="M120 200 L200 140 L280 200" stroke="var(--charcoal)" stroke-width="4" stroke-linecap="round" fill="none"/>
            <path class="anim-data" d="M40 260 L120 200 M280 200 L360 140" stroke="var(--charcoal)" stroke-width="2" stroke-dasharray="6 6" fill="none"/>
          </svg>