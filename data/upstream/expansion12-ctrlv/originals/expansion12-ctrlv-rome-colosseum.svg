                <rect x="280" y="220" width="20" height="30" rx="10"/>
                <!-- Tier 2 -->
                <rect x="80" y="170" width="20" height="30" rx="10"/>
                <rect x="120" y="170" width="20" height="30" rx="10"/>
                <rect x="160" y="170" width="20" height="30" rx="10"/>
                <rect x="200" y="170" width="20" height="30" rx="10"/>
                <rect x="240" y="170" width="20" height="30" rx="10"/>
                <!-- Tier 3 -->
                <rect x="80" y="130" width="20" height="20" rx="10"/>
