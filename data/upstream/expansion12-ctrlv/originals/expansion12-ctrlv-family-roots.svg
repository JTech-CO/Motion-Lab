                <path d="M190 250 C190 220 195 200 205 200 C215 200 210 220 210 250" fill="var(--charcoal)"/>
                <circle cx="205" cy="185" r="10" fill="var(--charcoal)"/>

                <!-- Roots extending -->
                <path class="anim-draw" d="M170 250 Q140 280 100 260 M180 250 Q170 290 140 290 M200 250 V290 M220 250 Q240 280 250 280 M240 250 Q280 270 300 260" stroke="var(--secondary-color)" stroke-width="6" stroke-linecap="round" fill="none"/>
                
                <!-- Deep Heart Root -->
                <g class="anim-bounce">
                    <path d="M200 295 C200 290 190 280 180 290 C170 300 180 310 200 320 C220 310 230 300 220 290 C210 280 200 290 200 295 Z" fill="var(--accent-color)"/>
