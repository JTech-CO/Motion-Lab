<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Crescent Moon -->
            <path class="anim-glow" d="M300 80 A30 30 0 1 0 330 50 A20 20 0 1 1 300 80 Z" fill="var(--accent-color)"/>
            
            <!-- Central Domes -->
            <path d="M120 260 V180 C120 120 280 120 280 180 V260 Z" fill="var(--primary-color)"/>
            <!-- Layered domes -->
            <path d="M150 180 C150 100 250 100 250 180 Z" fill="#F8FAFC" opacity="0.2"/>
            <path d="M170 180 C170 140 230 140 230 180 Z" fill="var(--primary-color)"/>
            <path d="M185 140 C185 120 215 120 215 140 Z" fill="var(--primary-color)"/>
            
            <!-- Spire on main dome -->
            <path d="M198 120 L200 80 L202 120 Z" fill="var(--charcoal)"/>
            
            <!-- Minarets -->
            <!-- Inner Left -->
            <rect x="130" y="100" width="8" height="160" fill="var(--primary-color)"/>
            <path d="M134 70 L128 100 H140 Z" fill="var(--primary-color)"/>
            <!-- Inner Right -->
            <rect x="262" y="100" width="8" height="160" fill="var(--primary-color)"/>
            <path d="M266 70 L260 100 H272 Z" fill="var(--primary-color)"/>
            <!-- Outer Left -->
            <rect x="80" y="140" width="8" height="120" fill="var(--primary-color)"/>
            <path d="M84 110 L78 140 H90 Z" fill="var(--primary-color)"/>
            <!-- Outer Right -->
            <rect x="312" y="140" width="8" height="120" fill="var(--primary-color)"/>
            <path d="M316 110 L310 140 H322 Z" fill="var(--primary-color)"/>
            
            <!-- Birds flying by -->
            <path class="anim-float" d="M100 120 Q110 110 120 120 Q130 110 140 120" stroke="var(--charcoal)" stroke-width="2" fill="none" opacity="0.5"/>
            <path class="anim-float" d="M80 150 Q90 140 100 150 Q110 140 120 150" stroke="var(--charcoal)" stroke-width="2" fill="none" opacity="0.5" style="animation-delay: -1s"/>
          </svg>