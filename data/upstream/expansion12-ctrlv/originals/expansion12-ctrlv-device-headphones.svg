              <path d="M120 180 V120 C120 70 280 70 280 120 V180" fill="none" stroke="var(--charcoal)" stroke-width="5" stroke-linecap="round" opacity="0.2"/>
              <!-- Ear cups -->
              <rect x="100" y="150" width="40" height="70" rx="15" fill="var(--charcoal)" opacity="0.9"/>
              <rect x="260" y="150" width="40" height="70" rx="15" fill="var(--charcoal)" opacity="0.9"/>
              <rect x="110" y="160" width="10" height="50" rx="5" fill="var(--accent-color)"/>
              <rect x="280" y="160" width="10" height="50" rx="5" fill="var(--secondary-color)"/>
