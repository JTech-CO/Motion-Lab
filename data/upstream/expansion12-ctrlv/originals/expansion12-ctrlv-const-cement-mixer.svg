<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g style="animation-duration: 6s;" class="anim-float">
                <!-- Truck Base Chassis -->
                <rect x="80" y="200" width="240" height="30" rx="4" fill="var(--primary-color)"/>
                
                <!-- Wheels -->
                <g transform="translate(120, 230)">
                    <circle style="animation-duration: 10s;" class="anim-rotate" cx="0" cy="0" r="20" fill="var(--charcoal)"/>
                    <circle style="animation-duration: 10s;" class="anim-rotate" cx="0" cy="0" r="10" fill="var(--bg-surface)" stroke="var(--primary-color)" stroke-width="2"/>
                </g>
                <g transform="translate(180, 230)">
                    <circle style="animation-duration: 10s;" class="anim-rotate" cx="0" cy="0" r="20" fill="var(--charcoal)"/>
                    <circle style="animation-duration: 10s;" class="anim-rotate" cx="0" cy="0" r="10" fill="var(--bg-surface)" stroke="var(--primary-color)" stroke-width="2"/>
                </g>
                <g transform="translate(280, 230)">
                    <circle style="animation-duration: 10s;" class="anim-rotate" cx="0" cy="0" r="20" fill="var(--charcoal)"/>
                    <circle style="animation-duration: 10s;" class="anim-rotate" cx="0" cy="0" r="10" fill="var(--bg-surface)" stroke="var(--secondary-color)" stroke-width="2"/>
                </g>
                
                <!-- Cab -->
                <path d="M260 200 V120 Q300 120 320 150 V200 Z" fill="var(--secondary-color)"/>
                <path d="M275 130 H295 L310 150 H275 Z" fill="var(--bg-surface)" stroke="var(--charcoal)" stroke-width="4"/>
                <circle style="animation-duration: 4s;" class="anim-pulse" cx="300" cy="180" r="5" fill="var(--accent-color)"/>
                
                <!-- Mixing Barrel -->
                <g transform="translate(160, 140) rotate(-15)">
                    <g class="anim-rotate" style="animation-duration: 6s; animation-direction: alternate;">
                        <ellipse cx="0" cy="0" rx="80" ry="50" fill="var(--primary-color)" stroke="var(--charcoal)" stroke-width="4"/>
                        <path d="M-60 -30 Q0 0 60 -30 M-60 30 Q0 0 60 30" stroke="var(--charcoal)" stroke-width="6" stroke-dasharray="10 10" fill="none"/>
                        <!-- Wet concrete splashes -->
                        <circle cx="-40" cy="-20" r="8" fill="var(--accent-color)" opacity="0.4"/>
                        <circle cx="20" cy="20" r="12" fill="var(--accent-color)" opacity="0.4"/>
                    </g>
                </g>
                <!-- Barrel Stand -->
                <path d="M100 200 L120 150 H160 L180 200 Z" fill="var(--charcoal)"/>
                <path d="M220 200 L230 180 H260 L260 200 Z" fill="var(--charcoal)"/>
            </g>
          </svg>