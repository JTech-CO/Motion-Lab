<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g class="anim-float">
                <!-- Pan (Paellera) -->
                <circle cx="200" cy="180" r="100" fill="var(--charcoal)"/>
                <circle cx="200" cy="180" r="90" fill="var(--primary-color)"/>
                <!-- Handles -->
                <path d="M100 180 H70 M300 180 H330" stroke="var(--charcoal)" stroke-width="15" stroke-linecap="round"/>
                
                <!-- Rice and Ingredients -->
                <g class="anim-pulse" opacity="0.8">
                    <!-- Peas -->
                    <circle cx="160" cy="160" r="5" fill="var(--secondary-color)"/>
                    <circle cx="240" cy="160" r="5" fill="var(--secondary-color)"/>
                    <circle cx="200" cy="220" r="5" fill="var(--secondary-color)"/>
                    <circle cx="180" cy="190" r="5" fill="var(--secondary-color)"/>
                    
                    <!-- Shrimp/Prawns -->
                    <path d="M220 140 Q250 130 250 160" stroke="var(--accent-color)" stroke-width="8" stroke-linecap="round" fill="none"/>
                    <path d="M150 200 Q120 190 120 220" stroke="var(--accent-color)" stroke-width="8" stroke-linecap="round" fill="none"/>
                    
                    <!-- Mussels/Lemon -->
                    <rect x="190" y="140" width="20" height="15" rx="7" fill="var(--charcoal)"/>
                    <path d="M220 200 L240 220 L200 210 Z" fill="var(--secondary-color)"/>
                </g>
                
                <!-- Sizzling Steam -->
                <path class="anim-glow" d="M180 120 Q200 100 220 120" stroke="var(--bg-surface)" stroke-width="2" opacity="0.5"/>
            </g>
          </svg>