              <circle cx="252" cy="158" r="20" fill="var(--primary-color)" opacity="0.5"/>
              <!-- Awkward smile with teeth visible -->
              <path d="M168 168 Q200 185 232 168" stroke="var(--bg-surface)" stroke-width="7" stroke-linecap="round" fill="none"/>
