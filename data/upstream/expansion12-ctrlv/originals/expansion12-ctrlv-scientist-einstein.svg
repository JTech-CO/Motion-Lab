<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            
            <!-- Chalkboard -->
            <path class="anim-float" style="animation-delay: -1s;" d="M60 250 L100 80 H300 L340 250 Z" fill="var(--secondary-color)" opacity="0.1"/>
            <path d="M80 200 L110 90 H290 L320 200 Z" fill="var(--primary-color)"/>
            <path d="M80 200 H320" stroke="var(--charcoal)" stroke-width="8" stroke-linecap="round"/>
            <path d="M110 90 H290" stroke="var(--charcoal)" stroke-width="8" stroke-linecap="round"/>
            
            <!-- Chalk / Math -->
            <path class="anim-draw" d="M140 130 H170 M140 150 H170 M140 140 H160 M200 135 H220 M200 145 H220 M240 140 H270 M250 140 C250 160 270 160 270 140 M265 125 V135" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            <circle cx="120" cy="180" r="3" fill="var(--accent-color)"/>
            <rect x="240" y="190" width="10" height="4" fill="white" transform="rotate(15 240 190)"/>

            <!-- Atomic Model -->
            <g class="anim-float">
                <circle cx="200" cy="80" r="10" fill="var(--accent-color)"/>
                <!-- Nucleus glow -->
                <circle class="anim-pulse" cx="200" cy="80" r="20" fill="var(--accent-color)" opacity="0.3"/>
                
                <g class="anim-rotate" >
                    <ellipse cx="200" cy="80" rx="40" ry="15" fill="none" stroke="var(--secondary-color)" stroke-width="3" transform="rotate(0 200 80)"/>
                    <circle cx="240" cy="80" r="4" fill="var(--primary-color)"/>
                </g>
                <g class="anim-rotate" >
                    <ellipse cx="200" cy="80" rx="40" ry="15" fill="none" stroke="var(--secondary-color)" stroke-width="3" transform="rotate(60 200 80)"/>
                    <circle cx="220" cy="45" r="4" fill="var(--primary-color)"/>
                </g>
                <g class="anim-rotate" >
                    <ellipse cx="200" cy="80" rx="40" ry="15" fill="none" stroke="var(--secondary-color)" stroke-width="3" transform="rotate(120 200 80)"/>
                    <circle cx="180" cy="45" r="4" fill="var(--primary-color)"/>
                </g>
            </g>
          </svg>