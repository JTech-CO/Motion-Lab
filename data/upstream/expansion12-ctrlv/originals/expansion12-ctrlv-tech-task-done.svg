<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g class="anim-float">
                <!-- Checklist Base -->
                <rect x="100" y="60" width="200" height="180" rx="4" fill="var(--bg-surface)" stroke="var(--charcoal)" stroke-width="8"/>
                
                <!-- Tasks List -->
                <g stroke="var(--charcoal)" stroke-width="4">
                    <rect x="125" y="100" width="20" height="20" rx="4" fill="var(--secondary-color)" opacity="0.3"/>
                    <line x1="160" y1="110" x2="275" y2="110" opacity="0.2"/>
                    
                    <rect x="125" y="140" width="20" height="20" rx="4" fill="var(--secondary-color)" opacity="0.3"/>
                    <line x1="160" y1="150" x2="250" y2="150" opacity="0.2"/>
                    
                    <!-- Completed Task -->
                    <g class="anim-pulse">
                        <rect x="125" y="180" width="20" height="20" rx="4" fill="var(--secondary-color)"/>
                        <path class="anim-draw" d="M129 190 L134 195 L141 185" stroke="var(--bg-surface)" stroke-width="3" fill="none"/>
                        <line x1="160" y1="190" x2="275" y2="190" stroke="var(--primary-color)" stroke-width="4"/>
                    </g>
                </g>
                
                <!-- Celebration Elements -->
                <g transform="translate(200, 30)">
                    <g class="anim-bounce" >
                    <path class="anim-rotate" d="M0 -15 L4 -5 L14 -5 L6 2 L9 12 L0 6 L-9 12 L-6 2 L-14 -5 L-4 -5 Z" fill="var(--accent-color)"/>
                </g>
                </g>
                
                <!-- Badge -->
                <g transform="translate(270, 210)">
                    <g class="anim-pulse" >
                    <circle r="30" fill="var(--primary-color)"/>
                    <path d="M-15 0 L-10 15 L0 10 L10 15 L15 0" fill="var(--charcoal)" transform="translate(0, 10)"/>
                    <text x="0" y="5" font-family="monospace" font-weight="bold" font-size="14" fill="var(--bg-surface)" text-anchor="middle">100%</text>
                </g>
                </g>
            </g>
          </svg>