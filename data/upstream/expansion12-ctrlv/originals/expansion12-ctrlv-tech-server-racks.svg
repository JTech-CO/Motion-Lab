<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g class="anim-float">
                <!-- Main Rack Frame -->
                <rect x="100" y="40" width="200" height="220" rx="8" fill="var(--bg-surface)" stroke="var(--charcoal)" stroke-width="8"/>
                
                <!-- Server Slots -->
                <g stroke="var(--charcoal)" stroke-width="4">
                    <line x1="120" y1="80" x2="280" y2="80"/>
                    <line x1="120" y1="120" x2="280" y2="120"/>
                    <line x1="120" y1="160" x2="280" y2="160"/>
                    <line x1="120" y1="200" x2="280" y2="200"/>
                </g>
                
                <!-- Blinking Status Lights -->
                <g class="anim-pulse" >
                    <circle cx="140" cy="70" r="4" fill="var(--primary-color)"/>
                    <circle cx="160" cy="70" r="4" fill="var(--secondary-color)"/>
                    <circle cx="180" cy="70" r="4" fill="var(--accent-color)"/>
                </g>
                <g class="anim-pulse"  style="animation-delay: 0.3s;">
                    <circle cx="140" cy="110" r="4" fill="var(--secondary-color)"/>
                    <circle cx="260" cy="110" r="4" fill="var(--accent-color)"/>
                </g>
                <g class="anim-pulse"  style="animation-delay: 0.6s;">
                    <circle cx="140" cy="150" r="4" fill="var(--accent-color)"/>
                    <circle cx="220" cy="150" r="4" fill="var(--primary-color)"/>
                </g>
                <g class="anim-pulse"  style="animation-delay: 0.9s;">
                    <circle cx="140" cy="190" r="4" fill="var(--primary-color)"/>
                    <circle cx="260" cy="190" r="4" fill="var(--secondary-color)"/>
                </g>
                
                <!-- Ethernet Port Details -->
                <rect x="250" y="65" width="20" height="10" rx="2" fill="var(--charcoal)" opacity="0.2"/>
                <rect x="250" y="145" width="20" height="10" rx="2" fill="var(--charcoal)" opacity="0.2"/>
            </g>
          </svg>