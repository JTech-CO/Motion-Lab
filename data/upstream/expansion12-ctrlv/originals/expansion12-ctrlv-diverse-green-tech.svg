<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g class="anim-float">
                <!-- Circuit Board Traces -->
                <path class="anim-draw" d="M60 150 H120 L140 130 H180" stroke="var(--charcoal)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                <path class="anim-draw" d="M340 150 H280 L260 170 H220" stroke="var(--charcoal)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                <circle cx="180" cy="130" r="6" fill="var(--accent-color)"/>
                <circle cx="220" cy="170" r="6" fill="var(--accent-color)"/>
                
                <!-- Leaf / Bulb Hybrid -->
                <path class="anim-pulse" d="M200 40 C280 40 300 120 250 170 L200 240 L150 170 C100 120 120 40 200 40 Z" fill="var(--primary-color)"/>
                <path d="M200 40 C280 40 300 120 250 170 L200 240 Z" fill="var(--secondary-color)"/>
                
                <!-- Leaf Veins / Circuits -->
                <path class="anim-draw" d="M200 240 V80" stroke="var(--bg-surface)" stroke-width="6" stroke-linecap="round"/>
                <path class="anim-draw" d="M200 180 L230 150 M200 140 L170 110 M200 100 L220 80" stroke="var(--bg-surface)" stroke-width="6" stroke-linecap="round"/>
                
                <!-- Nodes -->
                <circle cx="230" cy="150" r="5" fill="var(--bg-surface)"/>
                <circle cx="170" cy="110" r="5" fill="var(--bg-surface)"/>
                <circle cx="220" cy="80" r="5" fill="var(--bg-surface)"/>
                
                <!-- Plug Base -->
                <rect x="180" y="240" width="40" height="30" rx="5" fill="var(--charcoal)"/>
                <line x1="190" y1="270" x2="190" y2="290" stroke="var(--charcoal)" stroke-width="6" stroke-linecap="round"/>
                <line x1="210" y1="270" x2="210" y2="290" stroke="var(--charcoal)" stroke-width="6" stroke-linecap="round"/>
            </g>
          </svg>