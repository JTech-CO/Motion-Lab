<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g class="anim-float">
                <!-- Palette Plate -->
                <path d="M100 220 C60 220 60 80 200 80 C340 80 340 220 300 220 Q200 240 100 220 Z" fill="var(--bg-surface)" stroke="var(--charcoal)" stroke-width="8"/>
                <circle cx="140" cy="180" r="15" fill="var(--bg-surface)" stroke="var(--charcoal)" stroke-width="4"/>
                
                <!-- Color Swatches -->
                <circle class="anim-bounce" cx="150" cy="120" r="25" fill="var(--primary-color)"/>
                <circle class="anim-bounce" style="animation-delay: 0.2s;" cx="200" cy="110" r="25" fill="var(--secondary-color)"/>
                <circle class="anim-bounce" style="animation-delay: 0.4s;" cx="250" cy="120" r="25" fill="var(--accent-color)"/>
                <circle class="anim-bounce" style="animation-delay: 0.6s;" cx="270" cy="170" r="25" fill="var(--charcoal)"/>
                
                <!-- Brush -->
                <g class="anim-rotate" >
                    <rect x="180" y="160" width="10" height="100" fill="var(--charcoal)"/>
                    <rect x="175" y="150" width="20" height="20" rx="4" fill="var(--accent-color)"/>
                </g>
            </g>
          </svg>