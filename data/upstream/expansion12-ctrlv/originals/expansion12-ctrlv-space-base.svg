<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Moon Surface -->
            <path d="M40 250 Q120 230 200 250 T360 250 L360 300 H40 Z" fill="#e2e8f0"/>
            <circle cx="100" cy="270" r="15" fill="var(--charcoal)" opacity="0.1"/>
            <circle cx="300" cy="260" r="25" fill="var(--charcoal)" opacity="0.1"/>
            <!-- Main Dome -->
            <path class="anim-float" d="M120 245 A80 80 0 0 1 280 245 Z" fill="var(--primary-color)" opacity="0.9"/>
            <path class="anim-float" d="M130 245 A70 70 0 0 1 270 245 Z" fill="white" opacity="0.2"/>
            <!-- Connection tube -->
            <rect class="anim-float" x="270" y="220" width="50" height="20" rx="4" fill="var(--secondary-color)"/>
            <!-- Secondary Dome -->
            <path d="M310 245 A30 30 0 0 1 370 245 Z" fill="var(--primary-color)"/>
            
            <!-- Antenna -->
            <path class="anim-draw" d="M200 165 V120 M180 130 L220 130" stroke="var(--charcoal)" stroke-width="3" stroke-linecap="round"/>
            <circle class="anim-glow" cx="200" cy="115" r="5" fill="var(--accent-color)"/>
            
            <!-- Earth in background -->
            <circle class="anim-pulse" cx="100" cy="100" r="40" fill="var(--secondary-color)" opacity="0.6"/>
            <path class="anim-pulse" d="M80 80 Q100 70 120 90 T120 120 Q90 130 80 100 Z" fill="var(--primary-color)" opacity="0.5"/>
          </svg>