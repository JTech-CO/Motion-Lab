<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g class="anim-float">
                <!-- Base and Stand -->
                <path d="M150 260 H250 A 10 10 0 0 1 260 270 V280 H140 V270 A 10 10 0 0 1 150 260 Z" fill="var(--charcoal)"/>
                <rect x="190" y="210" width="20" height="50" fill="var(--primary-color)"/>
                <path d="M160 160 A 40 40 0 0 0 240 160" stroke="var(--charcoal)" stroke-width="12" fill="none"/>
                <line x1="200" y1="200" x2="200" y2="210" stroke="var(--charcoal)" stroke-width="12"/>
                
                <!-- Microphone Head -->
                <rect class="anim-bounce" x="170" y="60" width="60" height="110" rx="30" fill="var(--secondary-color)"/>
                
                <!-- Grill Details -->
                <path d="M170 100 H230 M170 120 H230 M170 140 H230" stroke="var(--bg-surface)" stroke-width="4"/>
                <path d="M190 65 V165 M210 65 V165" stroke="var(--bg-surface)" stroke-width="4"/>
                
                <!-- Recording Dot -->
                <circle class="anim-pulse" cx="200" cy="150" r="6" fill="var(--accent-color)"/>
                
                <!-- Sound Waves -->
                <path class="anim-draw" d="M110 115 A 60 60 0 0 0 110 145 M80 100 A 90 90 0 0 0 80 160 M50 85 A 120 120 0 0 0 50 175" stroke="var(--accent-color)" stroke-width="6" stroke-linecap="round" fill="none"/>
                <path class="anim-draw" style="animation-delay: 0.2s;" d="M290 115 A 60 60 0 0 1 290 145 M320 100 A 90 90 0 0 1 320 160 M350 85 A 120 120 0 0 1 350 175" stroke="var(--primary-color)" stroke-width="6" stroke-linecap="round" fill="none"/>
            </g>
          </svg>