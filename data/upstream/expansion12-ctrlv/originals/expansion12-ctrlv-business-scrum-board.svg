<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g class="anim-float">
                <rect x="50" y="50" width="300" height="200" rx="8" fill="var(--bg-surface)" stroke="var(--charcoal)" stroke-width="8"/>
                <!-- Grid Lines -->
                <line x1="150" y1="50" x2="150" y2="250" stroke="var(--charcoal)" stroke-width="4"/>
                <line x1="250" y1="50" x2="250" y2="250" stroke="var(--charcoal)" stroke-width="4"/>
                
                <!-- Columns: To Do, Doing, Done Labels -->
                <rect x="70" y="70" width="60" height="15" rx="4" fill="var(--charcoal)" opacity="0.3"/>
                <rect x="170" y="70" width="60" height="15" rx="4" fill="var(--charcoal)" opacity="0.3"/>
                <rect x="270" y="70" width="60" height="15" rx="4" fill="var(--charcoal)" opacity="0.3"/>
                
                <!-- Sticky Notes -->
                <rect class="anim-pulse" style="animation-delay: 0.1s;" x="65" y="100" width="30" height="30" fill="var(--primary-color)"/>
                <rect class="anim-pulse" style="animation-delay: 0.2s;" x="105" y="100" width="30" height="30" fill="var(--secondary-color)"/>
                <rect class="anim-pulse" style="animation-delay: 0.3s;" x="65" y="140" width="30" height="40" fill="var(--accent-color)"/>
                
                <!-- In Progress -->
                <rect class="anim-bounce" x="185" y="100" width="30" height="30" fill="var(--secondary-color)"/>
                <path d="M185 130 H215 V170 L200 160 L185 170 Z" fill="var(--primary-color)" opacity="0.8"/>
                
                <!-- Done -->
                <rect x="270" y="100" width="30" height="30" fill="var(--accent-color)"/>
                <rect x="305" y="130" width="30" height="30" fill="var(--primary-color)"/>
                <path d="M275 115 L282 122 L295 108" stroke="var(--bg-surface)" stroke-width="3" stroke-linecap="round" fill="none"/>
                <path d="M310 145 L317 152 L330 138" stroke="var(--bg-surface)" stroke-width="3" stroke-linecap="round" fill="none"/>
            </g>
          </svg>