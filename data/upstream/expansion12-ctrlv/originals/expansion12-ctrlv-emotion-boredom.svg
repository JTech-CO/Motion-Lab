<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="200" cy="270" rx="130" ry="10" fill="#E2E8F0"/>
            <g class="anim-float" style="animation-duration: 6s;">
              <circle cx="200" cy="145" r="88" fill="var(--charcoal)" opacity="0.4"/>
              <!-- Dead pan flat eyes -->
              <path d="M158 132 H184 M216 132 H242" stroke="var(--bg-surface)" stroke-width="7" stroke-linecap="round"/>
              <!-- Flat expressionless mouth -->
              <path d="M168 170 H232" stroke="var(--bg-surface)" stroke-width="7" stroke-linecap="round"/>
              <!-- Head resting on hand -->
              <path d="M145 220 Q160 200 175 200" stroke="var(--bg-surface)" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.5"/>
            </g>
            <!-- Dashed clock / time passing lines -->
            <g class="anim-rotate" >
              <line x1="320" y1="90" x2="320" y2="65" stroke="var(--charcoal)" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
            </g>
            <circle cx="320" cy="90" r="22" stroke="var(--charcoal)" stroke-width="3" fill="none" opacity="0.3"/>
            <!-- ZZZ sleep bubbles -->
            <g class="anim-data" fill="var(--charcoal)" opacity="0.4">
              <path d="M108 62 H125 L108 42 H125" stroke="var(--charcoal)" stroke-width="3" stroke-linecap="round" fill="none"/>
              <path d="M118 42 H130 L118 27 H130" stroke="var(--charcoal)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
            </g>
          </svg>