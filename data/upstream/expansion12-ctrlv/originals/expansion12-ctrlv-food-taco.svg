<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g class="anim-float">
                <!-- Taco Shell -->
                <path d="M100 200 C100 120 300 120 300 200 H100 Z" fill="var(--primary-color)"/>
                
                <!-- Fillings -->
                <g class="anim-bounce">
                    <!-- Meat/Beans -->
                    <rect x="120" y="180" width="160" height="30" rx="10" fill="var(--charcoal)" opacity="0.8"/>
                    <!-- Lettuce/Herbs -->
                    <circle cx="150" cy="180" r="15" fill="var(--secondary-color)" opacity="0.4"/>
                    <circle cx="200" cy="175" r="18" fill="var(--secondary-color)" opacity="0.4"/>
                    <circle cx="250" cy="180" r="15" fill="var(--secondary-color)" opacity="0.4"/>
                    <!-- Tomato -->
                    <circle cx="170" cy="170" r="8" fill="var(--accent-color)"/>
                    <circle cx="230" cy="170" r="8" fill="var(--accent-color)"/>
                </g>
                
                <!-- Shell detail -->
                <path d="M110 200 C110 140 290 140 290 200" stroke="var(--bg-surface)" stroke-width="4" opacity="0.3"/>
            </g>
          </svg>