            <g class="anim-draw" stroke="var(--charcoal)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.8">
                <!-- Eye of Horus abstract -->
                <path d="M130 80 Q145 70 160 80 Q145 90 130 80 Z"/>
                <circle cx="145" cy="80" r="3" fill="var(--charcoal)"/>
                <path d="M145 80 Q135 100 150 110"/>
                
                <!-- Ankh -->
