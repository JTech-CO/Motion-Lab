<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="200" cy="270" rx="140" ry="10" fill="#E2E8F0" opacity="0.6"/>
            <!-- Background: Stage Spotlights -->
            <g class="anim-pulse" opacity="0.2">
                <path d="M50 40 L150 270 L100 270 Z" fill="var(--accent-color)"/>
                <path d="M350 40 L250 270 L300 270 Z" fill="var(--accent-color)"/>
                <circle cx="50" cy="40" r="20" fill="var(--charcoal)"/>
                <circle cx="350" cy="40" r="20" fill="var(--charcoal)"/>
            </g>
            
            <g class="anim-bounce">
                <!-- Character Body -->
                <path d="M140 260 C140 160 220 160 220 260 Z" fill="var(--charcoal)"/>
                <!-- Leather Jacket Collar -->
                <path d="M150 180 L180 210 L180 260" stroke="var(--bg-surface)" stroke-width="4" fill="none"/>
                <path d="M210 180 L180 210" stroke="var(--bg-surface)" stroke-width="4" fill="none"/>
                
                <!-- Head -->
                <circle cx="180" cy="120" r="35" fill="var(--primary-color)"/>
                <!-- Rock Hair -->
                <path d="M140 120 C140 60 220 60 220 120 C220 140 180 80 140 120 Z" fill="var(--secondary-color)"/>
                
                <!-- Prop: Guitar -->
                <g class="anim-rotate" style="transform-origin: 200px 200px;">
                    <!-- Body -->
                    <circle cx="230" cy="220" r="30" fill="var(--primary-color)"/>
                    <circle cx="210" cy="210" r="20" fill="var(--primary-color)"/>
                    <circle class="anim-glow" cx="220" cy="215" r="10" fill="var(--bg-surface)" stroke="var(--charcoal)" stroke-width="4"/>
                    <!-- Neck -->
                    <path d="M200 200 L110 120" stroke="var(--bg-surface)" stroke-width="12" stroke-linecap="round"/>
                    <path d="M200 200 L110 120" stroke="var(--charcoal)" stroke-width="2"/>
                    <!-- Headstock -->
                    <path d="M110 120 L90 100" stroke="var(--primary-color)" stroke-width="15" stroke-linecap="round"/>
                </g>
            </g>
          </svg>