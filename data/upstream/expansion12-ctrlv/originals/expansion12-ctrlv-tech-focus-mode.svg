<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g class="anim-float">
                <!-- Zen Garden aesthetic -->
                <!-- Floating Peak -->
                <path class="anim-bounce" d="M120 220 L200 80 L280 220 Z" fill="var(--primary-color)" opacity="0.2"/>
                <path class="anim-draw" d="M120 220 L200 80 L280 220" stroke="var(--charcoal)" stroke-width="8" stroke-linecap="round" fill="none"/>
                
                <!-- Ripples -->
                <g class="anim-pulse" >
                    <circle cx="200" cy="220" r="40" stroke="var(--secondary-color)" stroke-width="2" fill="none"/>
                    <circle cx="200" cy="220" r="60" stroke="var(--secondary-color)" stroke-width="1" fill="none" opacity="0.5"/>
                </g>
                
                <!-- Balanced Stones -->
                <g class="anim-bounce" style="animation-duration: 4s;">
                    <ellipse cx="200" cy="210" rx="30" ry="15" fill="var(--charcoal)"/>
                    <ellipse cx="200" cy="180" rx="20" ry="10" fill="var(--primary-color)"/>
                    <ellipse cx="200" cy="160" rx="12" ry="6" fill="var(--accent-color)"/>
                </g>
                
                <!-- Rising Spark of Focus -->
                <circle class="anim-pulse" cx="200" cy="80" r="15" fill="var(--accent-color)" opacity="0.3"/>
                <circle cx="200" cy="80" r="8" fill="var(--accent-color)"/>
            </g>
          </svg>