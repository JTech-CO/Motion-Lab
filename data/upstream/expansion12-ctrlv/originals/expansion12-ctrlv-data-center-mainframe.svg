                <circle class="anim-pulse" style="animation-delay: 0.4s;" cx="220" cy="160" r="4" fill="var(--accent-color)"/>
                <circle class="anim-pulse" style="animation-delay: 0.6s;" cx="200" cy="180" r="4" fill="var(--accent-color)"/>
