<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g class="anim-float">
                <rect x="160" y="140" width="80" height="80" fill="var(--primary-color)"/>
                <rect class="anim-bounce" x="160" y="50" width="80" height="80" fill="var(--secondary-color)"/>
                <rect class="anim-bounce" style="animation-delay: 0.2s;" x="60" y="140" width="80" height="80" fill="var(--accent-color)"/>
                <rect class="anim-bounce" style="animation-delay: 0.4s;" x="260" y="140" width="80" height="80" fill="var(--charcoal)"/>
                
                <circle cx="200" cy="180" r="10" fill="white"/>
                <circle class="anim-pulse" cx="200" cy="90" r="10" fill="white"/>
                <circle class="anim-pulse" style="animation-delay: 0.2s;" cx="100" cy="180" r="10" fill="white"/>
                <circle class="anim-pulse" style="animation-delay: 0.4s;" cx="300" cy="180" r="10" fill="white"/>
            </g>
          </svg>