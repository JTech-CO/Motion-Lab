            <!-- The Egg -->
            <path class="anim-bounce" d="M200 60 C140 60 120 140 120 180 C120 220 160 250 200 250 C240 250 280 220 280 180 C280 140 260 60 200 60 Z" fill="var(--primary-color)"/>
            
            <!-- Tech Cracks in Egg -->
            <path class="anim-draw" d="M200 60 L190 100 L210 140 L180 180 L200 250" stroke="var(--accent-color)" stroke-width="4" stroke-linejoin="round" fill="none"/>
            <path class="anim-draw" d="M210 140 L250 130 M190 100 L150 110 L140 140" stroke="var(--accent-color)" stroke-width="3" stroke-linejoin="round" fill="none"/>
            
            <!-- Internal Glow -->
