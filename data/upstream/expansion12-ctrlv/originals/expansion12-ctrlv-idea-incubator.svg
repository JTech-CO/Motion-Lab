<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="200" cy="270" rx="130" ry="10" fill="#E2E8F0" opacity="0.6"/>
            <!-- Incubator Base -->
            <path d="M140 260 H260 L240 220 H160 Z" fill="var(--charcoal)"/>
