<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g class="anim-float" style="animation-duration: 2.5s;">
                <!-- Main Rotor (spinning) -->
                <g class="anim-rotate" >
                    <line x1="60" y1="95" x2="340" y2="95" stroke="var(--primary-color)" stroke-width="8" stroke-linecap="round"/>
                    <line x1="200" y1="40" x2="200" y2="150" stroke="var(--primary-color)" stroke-width="8" stroke-linecap="round"/>
                </g>
                <!-- Rotor hub -->
                <circle cx="200" cy="95" r="10" fill="var(--charcoal)"/>

                <!-- Body -->
                <path d="M120 120 H300 C320 120 340 135 340 160 C340 180 320 195 300 200 H140 C120 200 100 185 100 170 C100 145 110 120 120 120 Z" fill="var(--primary-color)"/>
                <!-- Cockpit Window -->
                <path d="M270 125 H310 C325 125 335 138 335 155 H270 V125 Z" fill="var(--secondary-color)" opacity="0.5"/>
                <!-- Passenger windows -->
                <rect x="165" y="135" width="40" height="35" rx="8" fill="var(--secondary-color)" opacity="0.4"/>
                <rect x="220" y="135" width="40" height="35" rx="8" fill="var(--secondary-color)" opacity="0.4"/>

                <!-- Tail boom -->
                <path d="M110 165 L40 175 L40 160 L110 155 Z" fill="var(--primary-color)" opacity="0.9"/>
                <!-- Tail rotor (spinning) -->
                <g class="anim-rotate" >
                    <line x1="40" y1="147" x2="40" y2="187" stroke="var(--charcoal)" stroke-width="6" stroke-linecap="round"/>
                    <line x1="20" y1="167" x2="60" y2="167" stroke="var(--charcoal)" stroke-width="6" stroke-linecap="round"/>
                </g>
                <!-- Skids -->
                <line x1="130" y1="200" x2="130" y2="225" stroke="var(--charcoal)" stroke-width="5" stroke-linecap="round"/>
                <line x1="270" y1="200" x2="270" y2="225" stroke="var(--charcoal)" stroke-width="5" stroke-linecap="round"/>
                <line x1="105" y1="225" x2="300" y2="225" stroke="var(--charcoal)" stroke-width="6" stroke-linecap="round"/>
            </g>
          </svg>