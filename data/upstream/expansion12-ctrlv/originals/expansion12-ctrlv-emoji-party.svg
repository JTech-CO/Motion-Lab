<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g class="anim-bounce">
                <!-- Confetti -->
                <g transform="rotate(45 90 70)">
                <rect class="anim-pulse" x="90" y="70" width="10" height="10"  fill="var(--accent-color)"/>
            </g>
                <g transform="rotate(-30 280 60)">
                <rect class="anim-pulse" style="animation-delay: 0.2s;" x="280" y="60" width="8" height="15"  fill="var(--secondary-color)"/>
            </g>
                <circle class="anim-pulse" style="animation-delay: 0.4s;" x="300" cy="140" r="5" fill="var(--primary-color)"/>
                <g transform="rotate(15 80 180)">
                <rect class="anim-pulse" style="animation-delay: 0.1s;" x="80" y="180" width="12" height="8"  fill="var(--secondary-color)"/>
            </g>
                
                <!-- Face -->
                <circle cx="200" cy="150" r="100" fill="var(--primary-color)"/>
                <path d="M140 180 Q200 230 260 180" stroke="var(--bg-surface)" stroke-width="8" fill="none"/>
                
                <!-- Winking Eyes -->
                <ellipse cx="160" cy="130" rx="10" ry="16" fill="var(--bg-surface)"/>
                <path d="M230 135 L260 120 M230 125 L260 140" stroke="var(--bg-surface)" stroke-width="6" stroke-linecap="round"/>
                
                <!-- Party Hat -->
                <path d="M150 60 L200 -10 L220 50 Z" fill="var(--accent-color)"/>
                <path d="M150 60 L220 50 L185 20 Z" fill="var(--secondary-color)"/>
                <circle class="anim-glow" cx="200" cy="-10" r="15" fill="var(--bg-surface)"/>
                
                <!-- Party Horn -->
                <path d="M220 190 L320 220 L310 240 Z" fill="var(--secondary-color)"/>
                <path class="anim-draw" d="M320 230 Q340 240 330 260 T350 280" stroke="var(--accent-color)" stroke-width="4" fill="none"/>
            </g>
          </svg>