<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="140" y="50" width="120" height="200" rx="20" fill="var(--charcoal)"/>
        <g class="anim-bounce">
            <rect x="110" y="80" width="100" height="40" rx="10" fill="var(--bg-surface)" stroke="var(--primary-color)" stroke-width="2"/>
            <circle cx="130" cy="100" r="10" fill="var(--primary-color)" opacity="0.2"/>
        </g>
        <g class="anim-bounce" style="animation-delay: 0.2s">
            <rect x="190" y="130" width="100" height="40" rx="10" fill="var(--bg-surface)" stroke="var(--secondary-color)" stroke-width="2"/>
            <circle cx="210" cy="150" r="10" fill="var(--secondary-color)" opacity="0.2"/>
        </g>
        <g class="anim-bounce" style="animation-delay: 0.4s">
            <rect x="120" y="180" width="100" height="40" rx="10" fill="var(--bg-surface)" stroke="var(--accent-color)" stroke-width="2"/>
            <circle cx="140" cy="200" r="10" fill="var(--accent-color)" opacity="0.2"/>
        </g>
    </svg>