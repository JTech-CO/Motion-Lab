<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="200" cy="270" rx="160" ry="12" fill="#e2e8f0" opacity="0.6"/>
            <!-- Pavement Squares -->
            <path d="M80 120 L320 120 L380 250 L20 250 Z" fill="var(--charcoal)" opacity="0.1"/>
            <path d="M140 120 L80 250 M260 120 L320 250" stroke="white" stroke-width="4" opacity="0.5"/>
            <path d="M100 170 L300 170 M60 210 L340 210" stroke="white" stroke-width="4" opacity="0.5"/>
            
            <!-- Glowing aura behind star -->
            <circle class="anim-pulse" cx="200" cy="180" r="60" fill="var(--accent-color)" opacity="0.2"/>
            
            <!-- The Star -->
            <!-- We will use a group and scale it down a bit to act like it's flat on ground, but floating up slightly -->
            <g class="anim-bounce">
                <polygon points="200,80 220,140 280,140 230,175 250,235 200,195 150,235 170,175 120,140 180,140" fill="var(--primary-color)"/>
                <polygon points="200,90 215,145 270,145 225,175 240,225 200,190 160,225 175,175 130,145 185,145" fill="var(--secondary-color)" opacity="0.8"/>
                
                <!-- Inner Camera/Reel Emblem abstract -->
                <circle cx="200" cy="165" r="15" fill="var(--charcoal)"/>
                <circle cx="200" cy="165" r="5" fill="white"/>
                <circle cx="190" cy="155" r="8" fill="none" stroke="white" stroke-width="2"/>
                <circle cx="210" cy="155" r="8" fill="none" stroke="white" stroke-width="2"/>
            </g>

            <path class="anim-draw" d="M200 60 V20 M140 60 L100 40 M260 60 L300 40" stroke="var(--accent-color)" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
          </svg>