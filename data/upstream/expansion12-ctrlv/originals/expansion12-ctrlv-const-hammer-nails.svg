<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g style="animation-duration: 6s;" class="anim-float">
                <!-- Wooden Plank (Base) -->
                <rect x="100" y="200" width="200" height="40" rx="4" fill="var(--bg-surface)" stroke="var(--charcoal)" stroke-width="8"/>
                <path d="M120 200 V240 M160 200 V240 M240 200 V240 M280 200 V240" stroke="var(--charcoal)" stroke-width="4" opacity="0.3"/>
                <circle cx="140" cy="220" r="10" stroke="var(--charcoal)" stroke-width="2" opacity="0.4"/>
                
                <!-- Nail 1 (Driven in) -->
                <path d="M180 200 V220" stroke="var(--secondary-color)" stroke-width="6"/>
                <rect x="170" y="195" width="20" height="5" fill="var(--charcoal)"/>
                
                <!-- Nail 2 (Being hit) -->
                <g transform="translate(240, 160)">
                    <g class="anim-bounce" style="animation-duration: 4s;">
                        <path d="M0 0 V40" stroke="var(--secondary-color)" stroke-width="6"/>
                        <rect x="-10" y="-5" width="20" height="5" fill="var(--charcoal)"/>
                    </g>
                </g>
                
                <!-- Hammer -->
                <g transform="translate(240, 150)">
                    <g class="anim-rotate" style="transform-origin: 60px -80px; animation-duration: 4s; animation-direction: alternate;">
                        <!-- Hammer Handle -->
                        <rect x="10" y="-120" width="20" height="100" rx="10" fill="var(--secondary-color)" transform="rotate(25, 20, -70)"/>
                        <rect x="10" y="-50" width="20" height="30" rx="4" fill="var(--charcoal)" transform="rotate(25, 20, -70)"/>
                        <!-- Hammer Head -->
                        <g transform="translate(-10, -50) rotate(-15)">
                            <path d="M-40 -10 H20 V10 H-40 Z" fill="var(--primary-color)" stroke="var(--charcoal)" stroke-width="4"/>
                            <!-- Claw -->
                            <path d="M20 -10 Q50 -10 60 10 Q30 0 20 10 Z" fill="var(--primary-color)" stroke="var(--charcoal)" stroke-width="4"/>
                        </g>
                        <!-- Impact Marks -->
                        <g transform="translate(-20, 0)">
<g  style="animation-duration: 4s;" class="anim-pulse" opacity="0.6">
                            <line x1="-15" y1="-15" x2="-30" y2="-30" stroke="var(--accent-color)" stroke-width="4" stroke-linecap="round"/>
                            <line x1="15" y1="-15" x2="30" y2="-30" stroke="var(--accent-color)" stroke-width="4" stroke-linecap="round"/>
                        </g>
</g>
                    </g>
                </g>
            </g>
          </svg>