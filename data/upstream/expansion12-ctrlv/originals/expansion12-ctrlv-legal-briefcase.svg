<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g class="anim-bounce">
                <!-- Main Body -->
                <rect x="100" y="120" width="200" height="120" rx="10" fill="var(--primary-color)"/>
                <path d="M100 160 H300" stroke="var(--secondary-color)" stroke-width="8"/>
                <path d="M100 210 H300" stroke="var(--secondary-color)" stroke-width="4"/>
                
                <!-- Handle -->
                <path class="anim-pulse" d="M160 120 V90 C160 70 240 70 240 90 V120" stroke="var(--charcoal)" stroke-width="12" stroke-linecap="round" fill="none"/>
                
                <!-- Locks/Latches -->
                <rect class="anim-glow" x="140" y="150" width="20" height="20" rx="4" fill="var(--accent-color)"/>
                <rect class="anim-glow" x="240" y="150" width="20" height="20" rx="4" fill="var(--accent-color)"/>
                <circle cx="150" cy="160" r="3" fill="var(--bg-surface)"/>
                <circle cx="250" cy="160" r="3" fill="var(--bg-surface)"/>
            </g>
          </svg>