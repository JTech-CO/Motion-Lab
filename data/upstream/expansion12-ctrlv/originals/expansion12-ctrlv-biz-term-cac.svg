<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g class="anim-float">
                <!-- Marketing Source (Megaphone or Spend) -->
                <polygon points="80,120 120,100 120,160 80,140" fill="var(--secondary-color)"/>
                <path d="M120 100 Q140 130 120 160 Z" fill="var(--accent-color)"/>
                <rect x="60" y="125" width="20" height="10" fill="var(--charcoal)"/>
                
                <!-- Customer -->
                <circle cx="300" cy="110" r="25" fill="var(--primary-color)"/>
                <path d="M260 200 C260 160 340 160 340 200" stroke="var(--primary-color)" stroke-width="30" stroke-linecap="round" fill="none"/>

                <!-- Cost Arrow pointing to Customer -->
                <path class="anim-draw" d="M140 130 C190 80 220 80 260 120" stroke="var(--accent-color)" stroke-width="8" stroke-dasharray="10 5" fill="none" stroke-linecap="round"/>
                <polygon class="anim-pulse" points="260,120 245,115 255,100" fill="var(--accent-color)"/>
                
                <!-- Dollar sign / Cost indicator -->
                <g class="anim-bounce">
                    <circle cx="200" cy="80" r="18" fill="var(--secondary-color)"/>
                    <path d="M200 68 V92 M194 76 H206 C212 76 212 84 200 84 C188 84 188 92 206 92" stroke="var(--bg-surface)" stroke-width="3" stroke-linecap="round" fill="none"/>
                </g>
            </g>
          </svg>