<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="200" cy="270" rx="160" ry="12" fill="#E2E8F0"/>
            <g class="anim-float">
                <!-- Kanban Board Background -->
                <rect x="40" y="40" width="320" height="200" rx="8" fill="var(--bg-surface)" stroke="var(--charcoal)" stroke-width="4"/>
                <path d="M40 80 H360" stroke="var(--charcoal)" stroke-width="4"/>
                
                <!-- Columns -->
                <rect x="60" y="100" width="80" height="120" rx="4" fill="var(--charcoal)" opacity="0.05"/>
                <rect x="160" y="100" width="80" height="120" rx="4" fill="var(--charcoal)" opacity="0.05"/>
                <rect x="260" y="100" width="80" height="120" rx="4" fill="var(--charcoal)" opacity="0.05"/>
                
                <!-- Column Headers -->
                <line x1="70" y1="115" x2="110" y2="115" stroke="var(--charcoal)" stroke-width="4" stroke-linecap="round"/>
                <line x1="170" y1="115" x2="220" y2="115" stroke="var(--charcoal)" stroke-width="4" stroke-linecap="round"/>
                <line x1="270" y1="115" x2="330" y2="115" stroke="var(--charcoal)" stroke-width="4" stroke-linecap="round"/>
                
                <!-- Cards -->
                <rect class="anim-bounce" x="70" y="130" width="60" height="30" rx="4" fill="var(--primary-color)"/>
                <rect class="anim-bounce" style="animation-delay: 0.2s;" x="70" y="170" width="60" height="40" rx="4" fill="var(--secondary-color)"/>
                
                <rect class="anim-bounce" style="animation-delay: 0.4s;" x="170" y="130" width="60" height="40" rx="4" fill="var(--accent-color)"/>
                
                <rect class="anim-bounce" style="animation-delay: 0.6s;" x="270" y="130" width="60" height="50" rx="4" fill="var(--primary-color)" opacity="0.8"/>
                <rect class="anim-bounce" style="animation-delay: 0.8s;" x="270" y="190" width="60" height="25" rx="4" fill="var(--secondary-color)" opacity="0.8"/>
            </g>
            
            <!-- Collaborative Cursors -->
            <g transform="translate(130, 160)">
                <g class="anim-pulse">
                <path d="M0 0 L15 15 L5 18 L0 25 Z" fill="var(--primary-color)" stroke="#FFF" stroke-width="2"/>
                <rect x="12" y="20" width="40" height="15" rx="4" fill="var(--primary-color)"/>
            </g>
            </g>
            <g transform="translate(260, 160)">
                <g class="anim-pulse" style="animation-delay: 0.5s;">
                <path d="M0 0 L15 15 L5 18 L0 25 Z" fill="var(--accent-color)" stroke="#FFF" stroke-width="2"/>
                <rect x="12" y="20" width="30" height="15" rx="4" fill="var(--accent-color)"/>
            </g>
            </g>
          </svg>