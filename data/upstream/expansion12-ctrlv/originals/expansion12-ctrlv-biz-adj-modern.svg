<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g class="anim-float">
                <rect class="anim-draw" x="120" y="80" width="160" height="120" rx="5" fill="var(--primary-color)" opacity="0.1" stroke="var(--primary-color)" stroke-width="2"/>
                <rect class="anim-pulse" x="140" y="100" width="40" height="40" rx="5" fill="var(--secondary-color)"/>
                <rect class="anim-pulse" x="200" y="100" width="60" height="10" rx="2" fill="var(--accent-color)"/>
