<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="200" cy="270" rx="130" ry="10" fill="#E2E8F0"/>
            <g class="anim-float">
                <!-- Background Glow -->
                <circle class="anim-pulse" cx="200" cy="180" r="100" fill="var(--bg-surface)" opacity="0.3"/>
                
                <!-- Open Cardboard Box -->
                <path d="M140 240 L260 240 L280 180 H120 Z" fill="var(--charcoal)"/>
                <!-- Box Flaps -->
                <path class="anim-bounce" d="M120 180 L80 200 L120 240 Z" fill="var(--primary-color)"/>
                <path class="anim-bounce" style="animation-delay: 0.2s;" d="M280 180 L320 200 L280 240 Z" fill="var(--primary-color)"/>
                <path class="anim-bounce" style="animation-delay: 0.1s;" d="M120 180 L200 150 L280 180 Z" fill="var(--secondary-color)"/>
                
                <!-- Product Emerging -->
                <g class="anim-bounce" style="animation-duration: 4s;">
                    <rect x="170" y="80" width="60" height="90" rx="10" fill="var(--primary-color)"/>
                    <rect x="180" y="90" width="40" height="60" rx="4" fill="white" opacity="0.8"/>
                    <circle class="anim-glow" cx="200" cy="120" r="15" fill="var(--accent-color)"/>
                </g>
                
                <!-- Sparkles + Magic -->
                <path class="anim-data" d="M120 100 L130 110 M270 90 L260 100 M200 50 V70 M160 70 L170 80 M240 70 L230 80" stroke="var(--accent-color)" stroke-width="4" stroke-linecap="round"/>
                <circle class="anim-pulse" cx="130" cy="120" r="4" fill="var(--accent-color)"/>
                <circle class="anim-pulse" cx="270" cy="130" r="5" fill="var(--secondary-color)"/>
            </g>
          </svg>