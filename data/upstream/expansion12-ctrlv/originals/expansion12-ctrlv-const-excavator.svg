<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g class="anim-float">
                <!-- Tracks Base -->
                <rect x="100" y="220" width="120" height="30" rx="15" fill="var(--charcoal)"/>
                <circle style="animation-duration: 10s;" class="anim-rotate" cx="120" cy="235" r="10" fill="var(--bg-surface)" stroke="var(--primary-color)" stroke-width="4"/>
                <circle style="animation-duration: 10s;" class="anim-rotate" cx="200" cy="235" r="10" fill="var(--bg-surface)" stroke="var(--primary-color)" stroke-width="4"/>
                <path d="M100 220 H220 M100 250 H220" stroke="var(--primary-color)" stroke-width="4" stroke-dasharray="10 10"/>
                
                <!-- Main Body (Cab) -->
                <path d="M120 220 L120 120 L160 120 L180 150 L200 150 L200 220 Z" fill="var(--secondary-color)"/>
                <!-- Window -->
                <path d="M130 130 L155 130 L170 155 L130 155 Z" fill="var(--bg-surface)" stroke="var(--charcoal)" stroke-width="4"/>
                <rect style="animation-duration: 4s;" class="anim-pulse" x="140" y="140" width="10" height="10" rx="2" fill="var(--accent-color)" opacity="0.6"/>
                
                <!-- Hydraulic Arm (Refined for meaningful digging motion) -->
                <g transform="translate(180, 190)">
                    <g class="anim-rotate" style="animation-duration: 5s; animation-direction: alternate; transform-origin: 0px 0px; transform: rotate(-10deg);">
                        <!-- Arm section 1 -->
                        <path d="M-5 -5 L80 -40 L85 -30 L5 10 Z" fill="var(--secondary-color)" stroke="var(--charcoal)" stroke-width="2"/>
                        
                        <g transform="translate(80, -35)">
                             <g class="anim-rotate" style="animation-duration: 3s; animation-direction: alternate-reverse; transform-origin: 0px 0px;">
                                 <!-- Arm section 2 (Elbow) -->
                                 <path d="M-5 -5 L50 30 L40 40 L-10 5 Z" fill="var(--secondary-color)" stroke="var(--charcoal)" stroke-width="2"/>
                                 
                                 <g transform="translate(45, 35)">
                                    <!-- Bucket -->
                                    <g class="anim-rotate" style="animation-duration: 2s; animation-direction: alternate; transform-origin: 0px 0px;">
                                        <path d="M-5 -5 C15 -5 30 10 15 30 L-5 15 Z" fill="var(--charcoal)"/>
                                        <path d="M15 30 L5 40 M5 25 L-5 35" stroke="var(--charcoal)" stroke-width="3" stroke-linecap="round"/>
                                    </g>
                                 </g>
                             </g>
                        </g>
                    </g>
                </g>
            </g>
          </svg>