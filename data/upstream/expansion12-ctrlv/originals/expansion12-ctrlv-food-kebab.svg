<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g class="anim-float">
                <!-- Rotisserie Stand -->
                <rect x="195" y="40" width="10" height="230" fill="var(--charcoal)"/>
                <rect x="150" y="250" width="100" height="15" rx="5" fill="var(--charcoal)"/>
                <rect x="150" y="30" width="100" height="10" rx="5" fill="var(--charcoal)"/>
                
                <!-- Meat Cone -->
                <path d="M140 60 L260 60 L240 230 L160 230 Z" fill="var(--secondary-color)"/>
                <path d="M140 60 L260 60 L240 230 L160 230 Z" fill="var(--primary-color)" opacity="0.4"/>
                
                <!-- Shaved layers -->
                <g class="anim-draw" stroke="var(--primary-color)" stroke-width="4" opacity="0.6">
                    <path d="M140 80 Q200 70 260 80"/>
                    <path d="M145 110 Q200 100 255 110"/>
                    <path d="M150 140 Q200 130 250 140"/>
                    <path d="M155 170 Q200 160 245 170"/>
                </g>
                
                <!-- Rotating Gleam -->
                <rect class="anim-pulse" x="180" y="60" width="10" height="170" fill="var(--bg-surface)" opacity="0.3"/>
            </g>
            
            <!-- Sliced pieces falling -->
            <g class="anim-data" fill="var(--primary-color)" opacity="0.8">
                <rect x="260" y="180" width="15" height="10" rx="2" transform="rotate(15 260 180)"/>
                <rect x="270" y="210" width="15" height="10" rx="2" transform="rotate(-10 270 210)"/>
            </g>
          </svg>