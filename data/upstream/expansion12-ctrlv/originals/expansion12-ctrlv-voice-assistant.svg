<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
        <g class="anim-float" style="transform-origin: center">
            <circle cx="200" cy="150" r="50" fill="none" stroke="var(--primary-color)" stroke-width="4" stroke-dasharray="10 20"/>
            <circle class="anim-pulse" cx="200" cy="150" r="40" fill="var(--primary-color)" opacity="0.2"/>
        </g>
        <g class="anim-bounce">
            <rect x="175" y="140" width="6" height="20" rx="3" fill="var(--secondary-color)"/>
            <rect x="187" y="130" width="6" height="40" rx="3" fill="var(--accent-color)"/>
            <rect x="199" y="145" width="6" height="35" rx="3" fill="var(--primary-color)"/>
            <rect x="211" y="135" width="6" height="25" rx="3" fill="var(--secondary-color)"/>
            <rect x="223" y="148" width="6" height="15" rx="3" fill="var(--accent-color)"/>
        </g>
    </svg>