<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g class="anim-float">
                <!-- Financial Document -->
                <rect x="120" y="50" width="160" height="180" rx="5" fill="var(--bg-surface)" stroke="var(--charcoal)" stroke-width="4"/>
                
                <!-- Text Lines (P&L entries) -->
                <rect x="140" y="80" width="100" height="8" rx="4" fill="var(--charcoal)" opacity="0.2"/>
                <rect x="250" y="80" width="20" height="8" rx="4" fill="var(--charcoal)" opacity="0.4"/>
                
                <rect x="140" y="110" width="80" height="8" rx="4" fill="var(--charcoal)" opacity="0.2"/>
                <rect x="250" y="110" width="20" height="8" rx="4" fill="var(--charcoal)" opacity="0.4"/>
                
                <rect x="140" y="140" width="90" height="8" rx="4" fill="var(--charcoal)" opacity="0.2"/>
                <rect x="250" y="140" width="20" height="8" rx="4" fill="var(--charcoal)" opacity="0.4"/>
                
                <path d="M140 170 H270" stroke="var(--charcoal)" stroke-width="2" stroke-dasharray="5 5" opacity="0.5"/>
                
                <!-- Highlighted Bottom Line -->
                <rect class="anim-pulse" x="130" y="185" width="140" height="25" rx="4" fill="var(--accent-color)" opacity="0.2"/>
                <rect x="140" y="193" width="70" height="10" rx="5" fill="var(--primary-color)"/>
                <rect class="anim-glow" x="235" y="193" width="35" height="10" rx="5" fill="var(--accent-color)"/>
            </g>
          </svg>