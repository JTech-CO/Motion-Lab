<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g class="anim-float">
                <!-- Plate -->
                <circle cx="200" cy="180" r="110" fill="var(--bg-surface)" stroke="var(--primary-color)" stroke-width="4"/>
                
                <!-- Mound of Fried Rice -->
                <path d="M130 180 C130 130 270 130 270 180 H130 Z" fill="var(--primary-color)" opacity="0.8"/>
                
                <!-- Fried Egg on Top -->
                <g class="anim-bounce">
                    <path d="M170 140 Q200 120 230 140 Q240 160 210 170 Q190 175 160 160 Q150 150 170 140 Z" fill="var(--bg-surface)"/>
                    <circle cx="200" cy="145" r="15" fill="var(--accent-color)"/>
                </g>
                
                <!-- Cucumber/Tomato slices -->
                <circle cx="140" cy="200" r="15" fill="var(--secondary-color)" opacity="0.6"/>
                <circle cx="160" cy="220" r="15" fill="var(--accent-color)" opacity="0.4"/>
                
                <!-- Prawn Cracker (Krupuk) -->
                <path d="M260 200 Q280 180 300 200 Q280 220 260 200" fill="var(--bg-surface)" opacity="0.7"/>
            </g>
          </svg>