<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path class="anim-draw" d="M80 260 Q150 150 250 120" stroke="#E2E8F0" stroke-width="40" stroke-linecap="round" fill="none"/>
            <path class="anim-draw" d="M90 260 Q155 155 250 120" stroke="var(--primary-color)" stroke-width="4" stroke-linecap="round" fill="none" stroke-dasharray="10 10" opacity="0.4"/>
            <!-- Kettlebell Body -->
            <g class="anim-float" style="animation-duration: 4s;">
                <!-- Handle -->
                <path d="M230 120 C230 70 310 70 310 120" stroke="var(--charcoal)" stroke-width="16" fill="none" stroke-linecap="round"/>
                <!-- Weight -->
                <circle cx="270" cy="160" r="60" fill="var(--primary-color)"/>
                <!-- Weight Detail Label -->
                <rect x="250" y="145" width="40" height="30" rx="4" fill="white" opacity="0.9"/>
                <text x="255" y="166" fill="var(--charcoal)" font-weight="bold" font-size="18" font-family="Arial">24</text>
            </g>
            <!-- Motion Lines -->
            <path class="anim-float" d="M180 200 L140 240 M200 230 L160 270" stroke="var(--secondary-color)" stroke-width="6" stroke-linecap="round"/>
            <circle class="anim-glow" cx="330" cy="80" r="10" fill="var(--accent-color)"/>
          </svg>