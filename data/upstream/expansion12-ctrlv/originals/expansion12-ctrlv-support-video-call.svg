<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Monitor Setup -->
            <path class="anim-float" d="M100 80 H300 V200 H100 Z" fill="var(--secondary-color)" stroke="var(--charcoal)" stroke-width="6"/>
            <path d="M200 206 V240 M160 240 H240" stroke="var(--charcoal)" stroke-width="12" stroke-linecap="round"/>
            <path class="anim-pulse" d="M120 100 H280 V180 H120 Z" fill="var(--primary-color)" opacity="0.2"/>
            
            <!-- Agent / User inside screen -->
            <g class="anim-bounce">
                <circle cx="200" cy="140" r="25" fill="var(--primary-color)"/>
                <path d="M150 180 C150 150 250 150 250 180" stroke="var(--primary-color)" stroke-width="10" stroke-linecap="round" fill="none"/>
                <path d="M185 140 H215 M180 180 H220" stroke="var(--bg-surface)" stroke-width="4" stroke-linecap="round"/>
            </g>
            
            <!-- UI Overlays -->
            <rect x="250" y="150" width="30" height="20" fill="var(--charcoal)"/>
            <circle class="anim-glow" cx="265" cy="160" r="5" fill="var(--accent-color)"/>
            
            <!-- Webcam/Mic -->
            <circle cx="200" cy="70" r="8" fill="var(--accent-color)"/>
          </svg>