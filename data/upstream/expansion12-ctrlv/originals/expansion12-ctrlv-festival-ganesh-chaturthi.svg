<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Background Arch -->
            <path d="M100 250 V100 C100 40 300 40 300 100 V250" stroke="var(--secondary-color)" stroke-width="12" fill="none"/>
            <path d="M120 250 V120 C120 70 280 70 280 120 V250" fill="var(--accent-color)" opacity="0.1"/>
            
            <g class="anim-float">
                <!-- Pedestal -->
                <rect x="140" y="230" width="120" height="20" rx="5" fill="var(--charcoal)"/>
                <rect x="160" y="210" width="80" height="20" rx="5" fill="var(--primary-color)"/>
                <!-- Giant Modak -->
                <path d="M200 100 C240 180 250 210 200 210 C150 210 160 180 200 100 Z" fill="var(--accent-color)"/>
                <!-- Modak folds -->
                <path d="M200 100 Q190 150 170 200" stroke="white" stroke-width="2" fill="none" opacity="0.5"/>
                <path d="M200 100 Q210 150 230 200" stroke="white" stroke-width="2" fill="none" opacity="0.5"/>
                <path d="M200 100 V210" stroke="white" stroke-width="2" fill="none" opacity="0.5"/>
            </g>
            <!-- Glowing aura -->
            <circle class="anim-pulse" cx="200" cy="150" r="80" fill="var(--accent-color)" opacity="0.1"/>
          </svg>