<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Lab Bench -->
            <path d="M100 240 H300 V270 H100 Z" fill="var(--primary-color)"/>
            <path d="M100 240 H300 L280 220 H120 Z" fill="var(--charcoal)" opacity="0.2"/>
            
            <!-- Giant Flask -->
            <path class="anim-float" d="M190 80 H210 V140 L260 220 H140 L190 140 Z" fill="none" stroke="var(--charcoal)" stroke-width="6" stroke-linejoin="round"/>
            
            <!-- Galactic Potion inside -->
            <path class="anim-bounce" d="M145 210 L185 145 H215 L255 210 Q200 230 145 210 Z" fill="var(--secondary-color)"/>
            
            <!-- Swirling matter in potion -->
            <path class="anim-rotate"  d="M170 190 Q200 160 230 190 Q200 210 170 190 Z" fill="var(--accent-color)" opacity="0.6"/>
            <circle class="anim-pulse" cx="200" cy="180" r="6" fill="white"/>
            
            <!-- Bubbles floating up -->
            <g class="anim-data">
                <circle cx="190" cy="130" r="4" fill="var(--accent-color)"/>
                <circle cx="205" cy="100" r="5" fill="var(--secondary-color)"/>
                <circle cx="200" cy="60" r="3" fill="var(--accent-color)"/>
            </g>
            
            <!-- Magic symbols floating -->
            <path class="anim-float" style="animation-delay:-1s" d="M100 140 L120 120 M100 120 L120 140" stroke="var(--charcoal)" stroke-width="3"/>
            <path class="anim-float" style="animation-delay:-0.5s" d="M300 160 L280 140 M280 160 L300 140 M290 140 V160 M280 150 H300" stroke="var(--charcoal)" stroke-width="2"/>
          </svg>