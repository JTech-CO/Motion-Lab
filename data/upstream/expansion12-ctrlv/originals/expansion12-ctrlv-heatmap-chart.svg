<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="200" cy="270" rx="140" ry="10" fill="#E2E8F0" opacity="0.6"/>
            <g class="anim-float">
                <!-- Heatmap Grid -->
                <!-- Row 1 -->
                <rect class="anim-pulse" x="100" y="80" width="40" height="40" rx="8" fill="var(--primary-color)" opacity="0.2"/>
                <rect class="anim-pulse" style="animation-delay: 0.1s;" x="150" y="80" width="40" height="40" rx="8" fill="var(--primary-color)" opacity="0.5"/>
                <rect class="anim-pulse" style="animation-delay: 0.2s;" x="200" y="80" width="40" height="40" rx="8" fill="var(--primary-color)" opacity="0.9"/>
                <rect class="anim-pulse" style="animation-delay: 0.3s;" x="250" y="80" width="40" height="40" rx="8" fill="var(--secondary-color)" opacity="0.6"/>
                
                <!-- Row 2 -->
                <rect class="anim-pulse" style="animation-delay: 0.4s;" x="100" y="130" width="40" height="40" rx="8" fill="var(--primary-color)" opacity="0.7"/>
                <rect class="anim-pulse" style="animation-delay: 0.5s;" x="150" y="130" width="40" height="40" rx="8" fill="var(--accent-color)" opacity="0.8"/>
                <rect class="anim-pulse" style="animation-delay: 0.6s;" x="200" y="130" width="40" height="40" rx="8" fill="var(--secondary-color)" opacity="1"/>
                <rect class="anim-pulse" style="animation-delay: 0.7s;" x="250" y="130" width="40" height="40" rx="8" fill="var(--primary-color)" opacity="0.3"/>
                
                <!-- Row 3 -->
                <rect class="anim-pulse" style="animation-delay: 0.8s;" x="100" y="180" width="40" height="40" rx="8" fill="var(--secondary-color)" opacity="0.4"/>
                <rect class="anim-pulse" style="animation-delay: 0.9s;" x="150" y="180" width="40" height="40" rx="8" fill="var(--primary-color)" opacity="0.8"/>
                <rect class="anim-pulse" style="animation-delay: 1.0s;" x="200" y="180" width="40" height="40" rx="8" fill="var(--accent-color)" opacity="0.5"/>
                <rect class="anim-pulse" style="animation-delay: 1.1s;" x="250" y="180" width="40" height="40" rx="8" fill="var(--primary-color)" opacity="0.2"/>
            </g>
            
            <!-- Scale Legend -->
            <g transform="translate(100, 240)">
                <rect x="0" y="0" width="40" height="10" rx="4" fill="var(--primary-color)" opacity="0.2"/>
                <rect x="50" y="0" width="40" height="10" rx="4" fill="var(--primary-color)" opacity="0.9"/>
                <rect x="100" y="0" width="40" height="10" rx="4" fill="var(--secondary-color)"/>
                <path d="M150 5 H190" stroke="var(--charcoal)" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
            </g>
          </svg>