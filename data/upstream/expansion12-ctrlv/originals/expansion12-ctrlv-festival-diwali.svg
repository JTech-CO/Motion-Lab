<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Glow background -->
            <circle class="anim-pulse" cx="200" cy="180" r="100" fill="var(--accent-color)" opacity="0.15"/>
            <circle class="anim-pulse" cx="200" cy="180" r="60" fill="var(--accent-color)" opacity="0.25" style="animation-delay: -1s"/>
            <g class="anim-float">
                <!-- Main Diya -->
                <path d="M130 200 Q200 250 270 200 C270 200 200 210 130 200 Z" fill="var(--primary-color)"/>
                <path d="M140 190 Q200 220 260 190 C260 210 200 220 140 190 Z" fill="var(--charcoal)"/>
                <path d="M200 195 L195 180 L205 180 Z" fill="var(--secondary-color)"/>
                <!-- Flame -->
                <path class="anim-glow" d="M200 140 Q180 170 200 185 Q220 170 200 140 Z" fill="var(--accent-color)"/>
                <path class="anim-pulse" d="M200 150 Q190 170 200 180 Q210 170 200 150 Z" fill="white"/>
            </g>
            <g class="anim-float" style="animation-delay: -1s">
                <path d="M70 230 Q100 255 130 230 C130 230 100 240 70 230 Z" fill="var(--secondary-color)"/>
                <path class="anim-glow" d="M100 190 Q90 210 100 220 Q110 210 100 190 Z" fill="var(--accent-color)"/>
            </g>
            <g class="anim-float" style="animation-delay: -2s">
                <path d="M270 230 Q300 255 330 230 C330 230 300 240 270 230 Z" fill="var(--secondary-color)"/>
                <path class="anim-glow" d="M300 190 Q290 210 300 220 Q310 210 300 190 Z" fill="var(--accent-color)"/>
            </g>
          </svg>