<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g class="anim-float">
                <!-- Scroll Paper -->
                <path d="M130 80 Q200 90 270 80 V240 Q200 250 130 240 Z" fill="var(--primary-color)"/>
                <path d="M130 80 Q200 90 270 80 V240 Q200 250 130 240 Z" fill="var(--secondary-color)" opacity="0.2"/>
                
                <!-- Left Roller -->
                <rect x="110" y="60" width="20" height="200" rx="10" fill="var(--charcoal)"/>
                <ellipse cx="120" cy="60" rx="15" ry="5" fill="var(--secondary-color)"/>
                <ellipse cx="120" cy="260" rx="15" ry="5" fill="var(--secondary-color)"/>
                <rect x="115" y="45" width="10" height="15" fill="var(--accent-color)"/>
                <rect x="115" y="260" width="10" height="15" fill="var(--accent-color)"/>
                <path d="M130 80 C110 80 110 240 130 240" fill="var(--charcoal)" opacity="0.6"/>

                <!-- Right Roller -->
                <rect x="270" y="60" width="20" height="200" rx="10" fill="var(--charcoal)"/>
                <ellipse cx="280" cy="60" rx="15" ry="5" fill="var(--secondary-color)"/>
                <ellipse cx="280" cy="260" rx="15" ry="5" fill="var(--secondary-color)"/>
                <rect x="275" y="45" width="10" height="15" fill="var(--accent-color)"/>
                <rect x="275" y="260" width="10" height="15" fill="var(--accent-color)"/>
                <path d="M270 80 C290 80 290 240 270 240" fill="var(--charcoal)" opacity="0.6"/>

                <!-- Text Abstract Lines -->
                <path class="anim-draw" d="M150 120 Q180 125 210 120 M230 118 H250 M150 140 Q200 145 250 140 M150 160 Q170 165 190 160 M210 159 H250 M150 180 Q200 185 250 180 M150 200 Q190 205 220 200" stroke="var(--bg-surface)" stroke-width="4" stroke-linecap="round" fill="none"/>
                <!-- Stamp -->
                <circle cx="230" cy="210" r="15" fill="var(--accent-color)"/>
                <circle cx="230" cy="210" r="8" fill="var(--bg-surface)" opacity="0.5"/>
            </g>
          </svg>