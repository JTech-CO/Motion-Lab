<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g class="anim-float">
                <!-- Stand -->
                <path d="M200 220 V260 M160 260 H240" stroke="var(--charcoal)" stroke-width="12" stroke-linecap="round"/>
                <path d="M120 140 A 90 90 0 0 0 200 230" stroke="var(--secondary-color)" stroke-width="10" stroke-linecap="round" fill="none"/>
                
                <!-- Earth -->
                <circle cx="200" cy="140" r="80" fill="var(--primary-color)"/>
                
                <!-- Continents / Grid -->
                <g class="anim-rotate" >
                    <ellipse cx="200" cy="140" rx="40" ry="80" stroke="var(--bg-surface)" stroke-width="4" fill="none" opacity="0.5"/>
                    <ellipse cx="200" cy="140" rx="80" ry="40" stroke="var(--bg-surface)" stroke-width="4" fill="none" opacity="0.5"/>
                    
                    <path class="anim-pulse" d="M160 100 Q190 80 220 120 T240 180 Q200 160 160 140 Z" fill="var(--accent-color)"/>
                    <path class="anim-pulse" style="animation-delay: 0.5s;" d="M140 160 Q150 190 180 190 Q160 160 140 160 Z" fill="var(--accent-color)"/>
                </g>
                <circle class="anim-glow" cx="240" cy="100" r="8" fill="white" opacity="0.8"/>
            </g>
          </svg>