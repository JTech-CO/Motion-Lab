<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="200" cy="270" rx="150" ry="15" fill="#e2e8f0" opacity="0.6"/>
            <!-- Terrain -->
            <path d="M50 270 Q150 240 250 280 T380 260" stroke="var(--charcoal)" stroke-width="2" stroke-dasharray="10 10" opacity="0.2" fill="none"/>
            <g class="anim-bounce">
                <!-- Rover Body -->
                <rect x="140" y="160" width="120" height="50" rx="8" fill="var(--primary-color)"/>
                <rect x="150" y="170" width="100" height="10" fill="var(--charcoal)" opacity="0.2"/>
                <!-- Neck/Camera -->
                <rect x="220" y="100" width="10" height="60" fill="var(--charcoal)"/>
                <rect x="235" y="130" width="8" height="30" fill="var(--charcoal)"/>
                <rect x="200" y="80" width="45" height="25" rx="6" fill="var(--primary-color)"/>
                <circle cx="215" cy="92" r="6" fill="var(--accent-color)"/>
                <circle cx="235" cy="92" r="4" fill="var(--secondary-color)"/>
                <!-- Solar panel top -->
                <path d="M120 150 L260 140 L280 160 L140 160 Z" fill="var(--secondary-color)"/>
            </g>
            <!-- Wheels -->
            <circle class="anim-pulse" cx="150" cy="230" r="16" stroke="var(--charcoal)" stroke-width="6" fill="white"/>
            <circle class="anim-pulse" cx="210" cy="235" r="16" stroke="var(--charcoal)" stroke-width="6" fill="white" style="animation-delay:-0.2s"/>
            <circle class="anim-pulse" cx="270" cy="225" r="16" stroke="var(--charcoal)" stroke-width="6" fill="white" style="animation-delay:-0.4s"/>
            <!-- Dust/Track -->
            <path class="anim-draw" d="M100 245 H140 M180 250 H200" stroke="var(--charcoal)" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.3"/>
          </svg>