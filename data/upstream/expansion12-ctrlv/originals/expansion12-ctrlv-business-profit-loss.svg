<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g class="anim-float">
                <!-- Stand -->
                <path d="M200 80 L180 260 H220 Z" fill="var(--charcoal)"/>
                <rect x="150" y="260" width="100" height="10" rx="5" fill="var(--charcoal)"/>
                
                <!-- Balancing Beam -->
                <g class="anim-rotate" >
                    <line x1="100" y1="80" x2="300" y2="80" stroke="var(--charcoal)" stroke-width="8" stroke-linecap="round"/>
                    <circle cx="200" cy="80" r="10" fill="var(--bg-surface)" stroke="var(--charcoal)" stroke-width="4"/>
                    
                    <!-- Left Scale (Profit) -->
                    <line x1="100" y1="80" x2="100" y2="150" stroke="var(--charcoal)" stroke-width="4"/>
                    <path d="M60 150 Q100 190 140 150 Z" fill="var(--charcoal)"/>
                    <!-- Money/Coins -->
                    <circle cx="100" cy="140" r="15" fill="var(--accent-color)"/>
                    <circle cx="90" cy="130" r="15" fill="var(--primary-color)"/>
                    <circle cx="110" cy="130" r="15" fill="var(--secondary-color)"/>
                    <text x="100" y="145" font-family="monospace" font-weight="bold" font-size="14" fill="var(--bg-surface)" text-anchor="middle">$</text>
                    <path class="anim-pulse" d="M100 100 V70 M90 80 L100 70 L110 80" stroke="var(--primary-color)" stroke-width="4" stroke-linecap="round" fill="none"/>
                    
                    <!-- Right Scale (Loss) -->
                    <line x1="300" y1="80" x2="300" y2="150" stroke="var(--charcoal)" stroke-width="4"/>
                    <path d="M260 150 Q300 190 340 150 Z" fill="var(--charcoal)"/>
                    <!-- Bill / Invoice -->
                    <rect x="285" y="110" width="30" height="40" rx="2" fill="var(--bg-surface)" stroke="var(--charcoal)" stroke-width="4"/>
                    <line x1="290" y1="120" x2="310" y2="120" stroke="var(--charcoal)" stroke-width="2"/>
                    <line x1="290" y1="130" x2="310" y2="130" stroke="var(--charcoal)" stroke-width="2"/>
                    <path class="anim-pulse" style="animation-delay: 0.5s;" d="M300 100 V70 M290 80 L300 90 L310 80" stroke="var(--accent-color)" stroke-width="4" stroke-linecap="round" fill="none"/>
                </g>
            </g>
          </svg>