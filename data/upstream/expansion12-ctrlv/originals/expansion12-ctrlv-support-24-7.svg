<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g class="anim-float">
                <!-- Clock Face -->
                <circle cx="200" cy="150" r="90" fill="var(--bg-surface)" stroke="var(--primary-color)" stroke-width="12"/>
                
                <!-- Inner Progress/Circle -->
                <circle class="anim-pulse" cx="200" cy="150" r="70" stroke="var(--secondary-color)" stroke-width="20" stroke-dasharray="20 15" fill="none"/>
                
                <!-- Infinity Loop/Hands -->
                <g class="anim-rotate" >
                    <path d="M200 150 L200 100" stroke="var(--charcoal)" stroke-width="8" stroke-linecap="round"/>
                    <path d="M200 150 L240 180" stroke="var(--accent-color)" stroke-width="8" stroke-linecap="round"/>
                    <circle cx="200" cy="150" r="8" fill="var(--charcoal)"/>
                </g>
                
                <!-- 24 Text -->
                <rect class="anim-glow" x="120" y="70" width="60" height="40" rx="10" fill="var(--accent-color)"/>
                <path d="M140 80 Q150 80 150 90 Q140 100 130 100 H150 M165 80 V100 M165 90 H175 V100 M175 80 V100" stroke="var(--bg-surface)" stroke-width="4" stroke-linecap="round" fill="none"/>
                
                <!-- 7 Text -->
                <rect class="anim-glow" x="220" y="190" width="40" height="40" rx="10" fill="var(--primary-color)"/>
                <path d="M230 200 H250 L235 220" stroke="var(--bg-surface)" stroke-width="4" stroke-linecap="round" fill="none"/>
            </g>
          </svg>