<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g class="anim-float">
                <!-- Document -->
                <rect x="100" y="40" width="160" height="220" rx="10" fill="var(--bg-surface)" stroke="var(--charcoal)" stroke-width="6"/>
                <path d="M100 80 H260" stroke="var(--charcoal)" stroke-width="6"/>
                
                <!-- Balance Scale Stamp/Logo -->
                <circle cx="180" cy="140" r="30" fill="var(--secondary-color)" opacity="0.2"/>
                <path d="M180 120 V160 M160 130 H200 M160 130 L150 150 H170 Z M200 130 L190 150 H210 Z" stroke="var(--primary-color)" stroke-width="4" stroke-linejoin="round" fill="none"/>
                
                <!-- Text Lines -->
                <line x1="130" y1="180" x2="230" y2="180" stroke="var(--charcoal)" stroke-width="4" stroke-linecap="round"/>
                <line x1="130" y1="200" x2="210" y2="200" stroke="var(--charcoal)" stroke-width="4" stroke-linecap="round"/>
                
                <!-- Signature Area -->
                <line x1="130" y1="230" x2="180" y2="230" stroke="var(--charcoal)" stroke-width="2" stroke-linecap="round"/>
                <path class="anim-draw" d="M130 220 C140 210 145 235 155 220 S170 230 180 220" stroke="var(--accent-color)" stroke-width="3" stroke-linecap="round" fill="none"/>
                
                <!-- Wax Seal -->
                <g transform="translate(260, 220)">
                    <g class="anim-pulse">
                    <circle cx="0" cy="0" r="25" fill="var(--accent-color)"/>
                    <circle cx="0" cy="0" r="18" fill="var(--accent-color)" stroke="var(--bg-surface)" stroke-width="2"/>
                    <path d="M-8 -8 L8 8 M-8 8 L8 -8" stroke="var(--bg-surface)" stroke-width="4" stroke-linecap="round"/>
                    <path d="M-15 20 L-20 40 L-5 35 Z" fill="var(--accent-color)"/>
                    <path d="M15 20 L20 40 L5 35 Z" fill="var(--accent-color)"/>
                </g>
                </g>
                
                <!-- Pen -->
                <g transform="translate(300, 100) rotate(-45)">
                    <g class="anim-bounce">
                    <path d="M0 0 L10 40 L20 0 Z" fill="var(--charcoal)"/>
                    <rect x="0" y="-80" width="20" height="80" fill="var(--primary-color)"/>
                    <path d="M0 -80 Q10 -100 20 -80 Z" fill="var(--accent-color)"/>
                    <line x1="10" y1="0" x2="10" y2="30" stroke="var(--bg-surface)" stroke-width="2"/>
                </g>
                </g>
            </g>
          </svg>