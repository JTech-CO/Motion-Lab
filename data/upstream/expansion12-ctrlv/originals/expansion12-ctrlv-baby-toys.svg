<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="200" cy="270" rx="160" ry="12" fill="#e2e8f0" opacity="0.6"/>
            <g class="anim-float">
                <circle cx="160" cy="160" r="60" fill="var(--primary-color)"/>
                <circle cx="110" cy="120" r="20" fill="var(--primary-color)"/>
                <circle cx="210" cy="120" r="20" fill="var(--primary-color)"/>
                <circle cx="140" cy="150" r="6" fill="var(--charcoal)"/>
                <circle cx="180" cy="150" r="6" fill="var(--charcoal)"/>
                <ellipse cx="160" cy="170" rx="10" ry="6" fill="var(--secondary-color)"/>
            </g>
            <g class="anim-bounce">
                <rect x="220" y="190" width="60" height="60" rx="8" fill="var(--secondary-color)"/>
                <text x="238" y="235" fill="white" font-weight="bold" font-size="36" font-family="Arial">A</text>
            </g>
