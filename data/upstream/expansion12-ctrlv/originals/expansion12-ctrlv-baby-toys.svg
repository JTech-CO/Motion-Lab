                <text x="290" y="165" fill="white" font-weight="bold" font-size="28" font-family="Arial" transform="rotate(15 280 130)">B</text>
            </g>
            <path class="anim-draw" d="M80 200 Q120 220 160 200" stroke="var(--charcoal)" stroke-width="4" stroke-dasharray="6 6" fill="none"/>
          </svg>