<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="200" cy="270" rx="150" ry="12" fill="#e2e8f0" opacity="0.6"/>
            <!-- Server Skyscrapers forming a city skyline -->
            <g class="anim-float">
                <!-- Building 1 -->
                <rect x="80" y="120" width="40" height="130" fill="var(--primary-color)"/>
                <rect class="anim-glow" x="90" y="140" width="20" height="4" fill="var(--accent-color)"/>
                <rect class="anim-glow" style="animation-delay: 0.1s" x="90" y="160" width="20" height="4" fill="var(--accent-color)"/>
                <rect class="anim-glow" style="animation-delay: 0.2s" x="90" y="180" width="20" height="4" fill="var(--accent-color)"/>
                
                <!-- Building 2 (Tallest) -->
                <rect x="140" y="60" width="60" height="190" fill="var(--charcoal)"/>
                <path d="M150 80 H190 M150 110 H190 M150 140 H190 M150 170 H190" stroke="var(--secondary-color)" stroke-width="8" opacity="0.8"/>
                <rect class="anim-pulse" x="160" y="200" width="20" height="20" fill="var(--accent-color)"/>
                
                <!-- Building 3 -->
                <rect x="220" y="100" width="50" height="150" fill="var(--primary-color)"/>
                <rect class="anim-glow" style="animation-delay: 0.4s" x="230" y="130" width="30" height="8" fill="var(--bg-surface)"/>
                <rect class="anim-glow" style="animation-delay: 0.5s" x="230" y="160" width="30" height="8" fill="var(--bg-surface)"/>
                
                <!-- Building 4 -->
                <rect x="290" y="160" width="40" height="90" fill="var(--secondary-color)"/>
                <circle class="anim-pulse" cx="310" cy="190" r="10" fill="var(--accent-color)"/>
            </g>
            
            <!-- Glowing data roads connecting them -->
            <path class="anim-data" d="M100 260 H310" stroke="var(--accent-color)" stroke-width="4" stroke-linecap="round"/>
            <path class="anim-draw" d="M170 60 V30 H240 V100" stroke="var(--accent-color)" stroke-width="3" stroke-dasharray="6 6" fill="none"/>
            <path class="anim-draw" style="animation-delay: 1s;" d="M100 120 V90 H140" stroke="var(--secondary-color)" stroke-width="3" stroke-dasharray="6 6" fill="none"/>
          </svg>