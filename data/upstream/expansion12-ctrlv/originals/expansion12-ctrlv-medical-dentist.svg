<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            
            <g class="anim-bounce">
                <!-- Abstract Tooth -->
                <path d="M170 100 C150 100 130 120 130 150 C130 180 140 220 160 230 C170 235 180 210 200 210 C220 210 230 235 240 230 C260 220 270 180 270 150 C270 120 250 100 230 100 C210 100 200 120 200 120 C200 120 190 100 170 100 Z" fill="var(--bg-surface)" stroke="var(--primary-color)" stroke-width="8" stroke-linejoin="round"/>
                
                <!-- Inner healthy gleam -->
                <path class="anim-glow" d="M150 130 C150 110 170 110 180 120" stroke="var(--secondary-color)" stroke-width="6" stroke-linecap="round" fill="none"/>
                
                <!-- Sparkle star -->
                <path class="anim-pulse" d="M130 100 L140 90 M140 100 L130 90 M135 85 V105 M125 95 H145" stroke="var(--accent-color)" stroke-width="3" stroke-linecap="round"/>
            </g>
            
            <g class="anim-float">
                <!-- Dental Mirror -->
                <path d="M280 250 L340 100" stroke="var(--charcoal)" stroke-width="8" stroke-linecap="round"/>
                <circle cx="340" cy="100" r="25" fill="var(--secondary-color)" stroke="var(--bg-surface)" stroke-width="4"/>
                <circle cx="340" cy="100" r="18" fill="white"/>
                <!-- Reflection line -->
                <path d="M330 90 C340 80 350 90 350 90" stroke="var(--secondary-color)" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.5"/>
            </g>
            
            <!-- Floating bubbles (cleanliness) -->
            <circle class="anim-float" style="animation-delay:-1s;" cx="280" cy="180" r="8" fill="var(--bg-surface)" stroke="var(--accent-color)" stroke-width="2"/>
            <circle class="anim-float" style="animation-delay:-2s;" cx="120" cy="180" r="12" fill="var(--bg-surface)" stroke="var(--secondary-color)" stroke-width="2"/>
          </svg>