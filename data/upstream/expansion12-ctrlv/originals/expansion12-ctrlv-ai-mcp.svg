<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g class="anim-float">
                <!-- AI Model Node -->
                <rect x="60" y="110" width="80" height="80" rx="15" fill="var(--primary-color)"/>
                <circle class="anim-pulse" cx="100" cy="150" r="15" fill="var(--bg-surface)"/>
                
                <!-- External Tool Node -->
                <rect x="260" y="110" width="80" height="80" rx="15" fill="var(--secondary-color)"/>
                <rect class="anim-pulse" style="animation-delay: 0.5s;" x="285" y="135" width="30" height="30" rx="5" fill="var(--bg-surface)"/>
                
                <!-- Protocol Bridge -->
                <path d="M140 150 H260" stroke="var(--charcoal)" stroke-width="12" stroke-linecap="round"/>
                <path class="anim-data" d="M140 150 H260" stroke="var(--accent-color)" stroke-width="6" stroke-linecap="round"/>
                
                <!-- Context Packets -->
                <g class="anim-draw">
                    <rect x="170" y="110" width="20" height="15" rx="4" fill="var(--accent-color)"/>
                    <rect x="210" y="175" width="20" height="15" rx="4" fill="var(--accent-color)"/>
                </g>
                <path d="M180 125 V140 M220 175 V160" stroke="var(--charcoal)" stroke-width="3" stroke-dasharray="2 2" opacity="0.5"/>
            </g>
          </svg>