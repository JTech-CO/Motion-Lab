<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g class="anim-bounce" style="animation-delay: 0.2s;">
                <!-- Back Bag (Secondary) -->
                <rect x="200" y="100" width="100" height="140" rx="4" fill="var(--secondary-color)"/>
                <path d="M230 100 C230 60 270 60 270 100" stroke="var(--charcoal)" stroke-width="6" fill="none"/>
                <rect x="230" y="140" width="40" height="40" rx="20" fill="var(--bg-surface)" opacity="0.5"/>
            </g>
            <g class="anim-float">
                <!-- Front Bag (Primary) -->
                <rect x="100" y="120" width="120" height="140" rx="4" fill="var(--primary-color)"/>
                <path d="M110 120 L130 260 M210 120 L190 260" stroke="var(--charcoal)" stroke-width="2" opacity="0.2"/>
                <!-- Handle -->
                <path d="M130 120 C130 70 190 70 190 120" stroke="var(--accent-color)" stroke-width="8" fill="none" stroke-linecap="round"/>
                <!-- Logo -->
                <path class="anim-pulse" d="M140 180 H180 L160 210 Z" fill="var(--accent-color)"/>
            </g>
          </svg>