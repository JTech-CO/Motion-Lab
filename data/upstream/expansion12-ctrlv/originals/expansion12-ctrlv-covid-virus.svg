<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="200" cy="270" rx="120" ry="10" fill="#E2E8F0" opacity="0.6"/>
            <g class="anim-float">
                <!-- Base Sphere -->
                <circle cx="200" cy="150" r="70" fill="var(--primary-color)" opacity="0.9"/>
                <circle cx="200" cy="150" r="60" fill="var(--primary-color)" opacity="0.6"/>
                <circle cx="180" cy="130" r="15" fill="var(--bg-surface)" opacity="0.3"/>
                
                <!-- Spikes -->
                <g class="anim-pulse" stroke="var(--accent-color)" stroke-width="6" stroke-linecap="round">
                    <line x1="200" y1="80" x2="200" y2="50"/>
                    <circle cx="200" cy="45" r="8" fill="var(--accent-color)"/>
                    
                    <line x1="200" y1="220" x2="200" y2="250"/>
                    <circle cx="200" cy="255" r="8" fill="var(--accent-color)"/>
                    
                    <line x1="130" y1="150" x2="100" y2="150"/>
                    <circle cx="95" cy="150" r="8" fill="var(--accent-color)"/>
                    
                    <line x1="270" y1="150" x2="300" y2="150"/>
                    <circle cx="305" cy="150" r="8" fill="var(--accent-color)"/>
                    
                    <line x1="150" y1="100" x2="125" y2="75"/>
                    <circle cx="120" cy="70" r="8" fill="var(--accent-color)"/>
                    
                    <line x1="250" y1="100" x2="275" y2="75"/>
                    <circle cx="280" cy="70" r="8" fill="var(--accent-color)"/>
                    
                    <line x1="150" y1="200" x2="125" y2="225"/>
                    <circle cx="120" cy="230" r="8" fill="var(--accent-color)"/>
                    
                    <line x1="250" y1="200" x2="275" y2="225"/>
                    <circle cx="280" cy="230" r="8" fill="var(--accent-color)"/>
                </g>
                
                <!-- Surface Details -->
                <g fill="var(--secondary-color)" opacity="0.5">
                    <circle cx="180" cy="180" r="10"/>
                    <circle cx="230" cy="130" r="15"/>
                    <circle cx="220" cy="170" r="8"/>
                    <circle cx="160" cy="140" r="12"/>
                </g>
            </g>
          </svg>