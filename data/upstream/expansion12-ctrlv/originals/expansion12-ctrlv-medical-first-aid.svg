<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g class="anim-bounce">
                <!-- Box shadow edge -->
                <rect x="90" y="110" width="220" height="150" rx="15" fill="var(--charcoal)" opacity="0.2"/>
                
                <!-- Main Box -->
                <rect x="100" y="100" width="200" height="140" rx="15" fill="var(--primary-color)"/>
                <rect x="95" y="130" width="210" height="10" fill="var(--secondary-color)"/>
                
                <!-- Handle -->
                <path d="M160 100 V80 C160 70 180 70 200 70 C220 70 240 70 240 80 V100" fill="none" stroke="var(--charcoal)" stroke-width="15" stroke-linecap="round"/>
                
                <!-- Clasps -->
                <rect x="130" y="125" width="20" height="20" rx="3" fill="var(--bg-surface)"/>
                <rect x="250" y="125" width="20" height="20" rx="3" fill="var(--bg-surface)"/>
                
                <!-- White Cross Medallion -->
                <circle cx="200" cy="180" r="40" fill="var(--bg-surface)"/>
                <path class="anim-pulse" d="M185 180 H215 M200 165 V195" stroke="var(--accent-color)" stroke-width="15" stroke-linecap="round"/>
            </g>
          </svg>