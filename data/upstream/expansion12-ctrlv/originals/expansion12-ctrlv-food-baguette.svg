<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g class="anim-float">
                <!-- Baguette Bread -->
                <path d="M80 200 L320 120 C340 115 350 130 340 140 L100 220 C80 225 70 210 80 200 Z" fill="var(--secondary-color)"/>
                
                <!-- Slits/Cuts -->
                <g stroke="var(--primary-color)" stroke-width="8" stroke-linecap="round" opacity="0.6">
                    <line x1="130" y1="185" x2="160" y2="175"/>
                    <line x1="190" y1="165" x2="220" y2="155"/>
                    <line x1="250" y1="145" x2="280" y2="135"/>
                </g>
                
                <!-- Cheese Slices -->
                <g class="anim-bounce">
                    <path d="M180 180 L220 140 L240 160 L200 200 Z" fill="var(--primary-color)"/>
                    <path d="M230 160 L270 120 L290 140 L250 180 Z" fill="var(--primary-color)"/>
                </g>
                
                <!-- Aroma Lines -->
                <path class="anim-draw" d="M300 100 Q320 80 300 60" stroke="var(--primary-color)" stroke-width="4" opacity="0.4"/>
            </g>
          </svg>