<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="200" cy="270" rx="140" ry="10" fill="#E2E8F0" opacity="0.6"/>
            <!-- Axes -->
            <path d="M80 60 V240 H320" stroke="var(--charcoal)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
            <g stroke="var(--charcoal)" stroke-width="4" stroke-linecap="round" opacity="0.3">
                <line x1="75" y1="180" x2="310" y2="180"/>
                <line x1="75" y1="120" x2="310" y2="120"/>
                <line x1="75" y1="60" x2="310" y2="60"/>
            </g>
            
            <g class="anim-data">
                <!-- Bars (Growing up) -->
                <rect x="100" y="160" width="30" height="80" rx="4" fill="var(--primary-color)"/>
                <rect x="150" y="120" width="30" height="120" rx="4" fill="var(--secondary-color)"/>
                <rect x="200" y="190" width="30" height="50" rx="4" fill="var(--primary-color)"/>
                <rect x="250" y="80" width="30" height="160" rx="4" fill="var(--accent-color)"/>
                
                <!-- Data Nodes -->
                <circle cx="115" cy="160" r="6" fill="var(--bg-surface)" stroke="var(--charcoal)" stroke-width="3"/>
                <circle cx="165" cy="120" r="6" fill="var(--bg-surface)" stroke="var(--charcoal)" stroke-width="3"/>
                <circle cx="215" cy="190" r="6" fill="var(--bg-surface)" stroke="var(--charcoal)" stroke-width="3"/>
                <circle cx="265" cy="80" r="6" fill="var(--bg-surface)" stroke="var(--charcoal)" stroke-width="3"/>
            </g>
            
            <!-- Trend Line Overlaid -->
            <path class="anim-draw" d="M115 140 L165 100 L215 160 L265 60" stroke="var(--charcoal)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>