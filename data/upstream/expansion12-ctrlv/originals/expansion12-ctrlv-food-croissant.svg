                <path class="anim-draw" d="M140 180 Q200 170 260 180" stroke="var(--bg-surface)" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
                <path class="anim-draw" d="M130 200 Q200 190 270 200" stroke="var(--bg-surface)" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
                
