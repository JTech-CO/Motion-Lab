<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g class="anim-float">
                <!-- Main Profile Card -->
                <rect x="60" y="50" width="280" height="200" rx="12" fill="var(--bg-surface)" stroke="var(--charcoal)" stroke-width="8"/>
                
                <!-- Avatar -->
                <g class="anim-bounce" >
                    <circle cx="130" cy="120" r="40" fill="var(--primary-color)" opacity="0.2"/>
                    <circle cx="130" cy="110" r="15" fill="var(--primary-color)"/>
                    <path d="M100 150 Q130 120 160 150 Z" fill="var(--primary-color)"/>
                </g>
                
                <!-- Info Bars -->
                <rect x="190" y="90" width="120" height="15" rx="4" fill="var(--charcoal)" opacity="0.2"/>
                <rect x="190" y="115" width="100" height="15" rx="4" fill="var(--charcoal)" opacity="0.2"/>
                
                <!-- Demographic Data Rings -->
                <g transform="translate(130, 200)">
                    <circle class="anim-pulse" cx="-60" cy="0" r="20" fill="none" stroke="var(--secondary-color)" stroke-width="8" stroke-dasharray="80 125"/>
                    <circle class="anim-pulse" style="animation-delay: 0.2s;" cx="0" cy="0" r="20" fill="none" stroke="var(--accent-color)" stroke-width="8" stroke-dasharray="100 125"/>
                    <circle class="anim-pulse" style="animation-delay: 0.4s;" cx="60" cy="0" r="20" fill="none" stroke="var(--primary-color)" stroke-width="8" stroke-dasharray="60 125"/>
                </g>
                
                <text x="130" y="235" font-family="monospace" font-weight="bold" font-size="12" fill="var(--charcoal)" text-anchor="middle">RESEARCH</text>
            </g>
          </svg>