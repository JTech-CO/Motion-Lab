<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Ribbon/Tape coming out playfully -->
            <path class="anim-draw" d="M100 220 C40 220 40 100 100 100 C160 100 160 60 200 60 C240 60 240 100 300 100 C360 100 360 220 300 220" fill="none" stroke="var(--charcoal)" stroke-width="4" stroke-linecap="round"/>
            <path class="anim-draw" style="animation-delay: 0.5s;" d="M100 220 C40 220 40 100 100 100 C160 100 160 60 200 60 C240 60 240 100 300 100 C360 100 360 220 300 220" fill="none" stroke="var(--primary-color)" stroke-width="4" stroke-linecap="round" opacity="0.3"/>

            <g class="anim-float">
                <!-- Main Plastic Shell -->
                <rect x="80" y="100" width="240" height="140" rx="10" fill="var(--bg-surface)" stroke="var(--primary-color)" stroke-width="6"/>
                <!-- Sticker / Label -->
                <rect x="100" y="120" width="200" height="80" rx="5" fill="var(--secondary-color)"/>
                <path d="M100 140 H300 M100 150 H300 M100 180 H300" stroke="white" stroke-width="2" opacity="0.5"/>
                <!-- "Mixtape" abstract text -->
                <path class="anim-draw" d="M120 130 Q140 125 160 130 T200 130 T240 130 T280 130" stroke="var(--charcoal)" stroke-width="4" stroke-linecap="round" fill="none"/>
                
                <!-- Spool Window -->
                <rect x="140" y="145" width="120" height="30" rx="15" fill="var(--charcoal)"/>
                
                <!-- Spools -->
                <circle class="anim-rotate"  cx="165" cy="160" r="10" fill="var(--bg-surface)"/>
                <circle class="anim-rotate"  cx="235" cy="160" r="10" fill="var(--bg-surface)"/>
                <!-- Spool teeth -->
                <path class="anim-rotate"  d="M165 150 V170 M155 160 H175 M158 153 L172 167 M158 167 L172 153" stroke="var(--charcoal)" stroke-width="2"/>
                <path class="anim-rotate"  d="M235 150 V170 M225 160 H245 M228 153 L242 167 M228 167 L242 153" stroke="var(--charcoal)" stroke-width="2"/>
                
                <!-- Magnetic Tape visible in window -->
                <circle class="anim-rotate"  cx="165" cy="160" r="15" fill="none" stroke="var(--accent-color)" stroke-width="4"/>
                <circle class="anim-rotate"  cx="235" cy="160" r="12" fill="none" stroke="var(--accent-color)" stroke-width="4"/>
                
                <!-- Bottom Trapezoid details -->
                <path d="M130 240 L140 220 H260 L270 240 Z" fill="none" stroke="var(--primary-color)" stroke-width="4"/>
                <circle cx="160" cy="230" r="4" fill="var(--charcoal)"/>
                <circle cx="240" cy="230" r="4" fill="var(--charcoal)"/>
            </g>
          </svg>