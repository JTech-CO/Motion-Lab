<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="200" cy="270" rx="140" ry="10" fill="#E2E8F0" opacity="0.6"/>
            <!-- Background: Brick Wall & Clues -->
            <g class="anim-float-slow" opacity="0.15">
                <path d="M60 80 H340 M60 120 H340 M60 160 H340 M60 200 H340 M60 240 H340" stroke="var(--charcoal)" stroke-width="4"/>
                <path d="M100 80 V120 M180 80 V120 M260 80 V120 M140 120 V160 M220 120 V160 M300 120 V160 M100 160 V200 M180 160 V200 M140 200 V240 M220 200 V240" stroke="var(--charcoal)" stroke-width="4"/>
                <!-- String/Clue Board -->
                <path class="anim-draw" d="M120 100 L280 180 L200 140 Z" stroke="var(--accent-color)" stroke-width="3" fill="none"/>
                <circle cx="120" cy="100" r="4" fill="var(--accent-color)"/>
                <circle cx="280" cy="180" r="4" fill="var(--accent-color)"/>
            </g>
            
            <g class="anim-bounce">
                <!-- Character Body (Trenchcoat) -->
                <path d="M120 260 C120 160 240 160 240 260 Z" fill="var(--secondary-color)"/>
                <path d="M180 180 V260" stroke="var(--bg-surface)" stroke-width="4"/>
                <!-- Collar -->
                <path d="M140 180 L180 220 L220 180" stroke="var(--bg-surface)" stroke-width="6" fill="none"/>
                
                <!-- Head -->
                <circle cx="180" cy="130" r="35" fill="var(--primary-color)"/>
                <!-- Fedora Hat -->
                <path d="M140 100 C140 60 220 60 220 100 Z" fill="var(--charcoal)"/>
                <path d="M120 100 H240" stroke="var(--charcoal)" stroke-width="8" stroke-linecap="round"/>
                <path d="M145 90 H215" stroke="var(--accent-color)" stroke-width="6"/>
                
                <!-- Prop: Magnifying Glass -->
                <g class="anim-float" style="transform-origin: 260px 180px;">
                    <path d="M220 220 L260 180" stroke="var(--charcoal)" stroke-width="8" stroke-linecap="round"/>
                    <circle cx="270" cy="170" r="25" fill="var(--primary-color)" opacity="0.5"/>
                    <circle class="anim-pulse" cx="270" cy="170" r="25" stroke="var(--charcoal)" stroke-width="6" fill="none"/>
                    <path class="anim-glow" d="M260 160 A 10 10 0 0 1 280 160" stroke="var(--bg-surface)" stroke-width="3" stroke-linecap="round" fill="none"/>
                </g>
            </g>
          </svg>