<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            
            <!-- Defensive rings / radar -->
            <circle class="anim-pulse" cx="200" cy="140" r="100" fill="none" stroke="var(--primary-color)" stroke-width="2" opacity="0.2"/>
            <circle class="anim-pulse" style="animation-delay: 0.5s;" cx="200" cy="140" r="70" fill="none" stroke="var(--primary-color)" stroke-width="2" opacity="0.4"/>
            
            <g class="anim-float">
                <!-- Main Shield -->
                <path d="M140 80 L200 50 L260 80 V150 C260 200 200 240 200 240 C200 240 140 200 140 150 V80 Z" fill="var(--primary-color)"/>
                <path d="M200 50 L260 80 V150 C260 200 200 240 200 240 V50 Z" fill="var(--bg-surface)" opacity="0.2"/>
                
                <!-- Inner Shield details-->
                <path d="M160 95 L200 75 L240 95 V145 C240 180 200 210 200 210 C200 210 160 180 160 145 V95 Z" stroke="var(--bg-surface)" stroke-width="4" stroke-linejoin="round" fill="none" opacity="0.8"/>
                
                <!-- checkmark -->
                <path class="anim-draw" d="M175 145 L195 165 L225 125" stroke="var(--accent-color)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
            </g>
            
            <!-- Data Particles being deflected -->
            <g fill="var(--secondary-color)">
                <circle class="anim-bounce" style="animation-direction: alternate;" cx="100" cy="100" r="6"/>
                <path class="anim-bounce" style="animation-direction: alternate;" d="M110 100 L130 110" stroke="var(--secondary-color)" stroke-width="2" stroke-linecap="round"/>
                
                <circle class="anim-bounce" style="animation-delay: -0.5s; animation-direction: alternate;" cx="300" cy="160" r="6"/>
                <path class="anim-bounce" style="animation-delay: -0.5s; animation-direction: alternate;" d="M290 160 L270 170" stroke="var(--secondary-color)" stroke-width="2" stroke-linecap="round"/>
            </g>
          </svg>