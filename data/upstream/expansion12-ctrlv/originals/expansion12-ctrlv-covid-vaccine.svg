<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g class="anim-float">
                <!-- Vial -->
                <rect x="100" y="140" width="80" height="110" rx="10" fill="var(--primary-color)" opacity="0.8"/>
                <rect x="120" y="120" width="40" height="20" fill="var(--secondary-color)"/>
                <rect x="110" y="110" width="60" height="10" rx="3" fill="var(--charcoal)" opacity="0.8"/>
                
                <!-- Vial Label -->
                <rect x="110" y="160" width="60" height="70" rx="5" fill="var(--bg-surface)"/>
                <circle cx="140" cy="185" r="12" fill="var(--accent-color)"/>
                <path d="M130 185 H150 M140 175 V195" stroke="var(--bg-surface)" stroke-width="4" stroke-linecap="round"/>
                <rect x="125" y="210" width="30" height="4" fill="var(--charcoal)" opacity="0.4"/>
                <rect x="125" y="218" width="20" height="4" fill="var(--charcoal)" opacity="0.4"/>
                
                <!-- Syringe -->
                <g transform="rotate(30 280 150)">
                    <rect x="250" y="100" width="40" height="120" rx="5" fill="var(--secondary-color)" opacity="0.6"/>
                    <rect x="254" y="140" width="32" height="70" fill="var(--primary-color)"/>
                    <!-- Measurements -->
                    <line x1="250" y1="120" x2="265" y2="120" stroke="var(--charcoal)" stroke-width="3"/>
                    <line x1="250" y1="140" x2="265" y2="140" stroke="var(--charcoal)" stroke-width="3"/>
                    <line x1="250" y1="160" x2="265" y2="160" stroke="var(--charcoal)" stroke-width="3"/>
                    <line x1="250" y1="180" x2="265" y2="180" stroke="var(--charcoal)" stroke-width="3"/>
                    <line x1="250" y1="200" x2="265" y2="200" stroke="var(--charcoal)" stroke-width="3"/>
                    
                    <rect x="240" y="220" width="60" height="10" rx="2" fill="var(--charcoal)" opacity="0.8"/>
                    <rect x="265" y="60" width="10" height="40" fill="var(--charcoal)" opacity="0.4"/>
                    <rect x="250" y="50" width="40" height="10" rx="2" fill="var(--charcoal)" opacity="0.8"/>
                    
                    <!-- Needle -->
                    <line x1="270" y1="230" x2="270" y2="280" stroke="var(--charcoal)" stroke-width="4" stroke-linecap="round"/>
                    <!-- Drop -->
                    <g class="anim-pulse">
                        <circle cx="270" cy="290" r="6" fill="var(--accent-color)"/>
                    </g>
                </g>
            </g>
          </svg>