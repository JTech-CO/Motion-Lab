<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g style="animation-duration: 6s;" class="anim-float">
                <!-- Flat Blueprint Base -->
                <path d="M60 220 L120 60 L320 90 L260 250 Z" fill="var(--primary-color)" opacity="0.9" stroke="var(--charcoal)" stroke-width="8" stroke-linejoin="round"/>
                
                <!-- Grid Lines -->
                <g stroke="var(--bg-surface)" stroke-width="2" opacity="0.4">
                    <line style="animation-duration: 4s;" class="anim-draw" x1="130" y1="90" x2="270" y2="230"/>
                    <line style="animation-duration: 4s;" class="anim-draw" x1="160" y1="80" x2="300" y2="220"/>
                    <line style="animation-duration: 4s;" class="anim-draw" x1="100" y1="180" x2="250" y2="130"/>
                    <line style="animation-duration: 4s;" class="anim-draw" x1="120" y1="210" x2="270" y2="160"/>
                </g>
                
                <!-- Building Sketch -->
                <g stroke="var(--bg-surface)" stroke-width="6" stroke-linecap="round" fill="none">
                    <rect x="160" y="120" width="80" height="60" transform="skewX(15) skewY(-20)"/>
                    <path d="M140 100 L200 80 L260 120" transform="skewX(15) skewY(-20)"/>
                </g>
                
                <!-- Rolled Blueprint -->
                <g transform="translate(100, 160) rotate(-30)">
                    <rect x="0" y="0" width="160" height="40" rx="20" fill="var(--secondary-color)" stroke="var(--charcoal)" stroke-width="6"/>
                    <circle cx="140" cy="20" r="20" fill="var(--primary-color)" stroke="var(--charcoal)" stroke-width="6"/>
                    <path d="M140 20 A 10 10 0 1 0 130 10" stroke="var(--charcoal)" stroke-width="4" stroke-linecap="round" fill="none"/>
                </g>
                
                <!-- Pencil / Ruler Tool -->
                <g transform="translate(240, 60) rotate(45)">
<g class="anim-bounce" style="animation-duration: 6s;" >
                    <rect x="0" y="0" width="20" height="120" fill="var(--accent-color)" stroke="var(--charcoal)" stroke-width="4"/>
                    <path d="M0 120 L10 140 L20 120 Z" fill="var(--bg-surface)" stroke="var(--charcoal)" stroke-width="4"/>
                    <circle cx="10" cy="140" r="2" fill="var(--charcoal)"/>
                </g>
</g>
            </g>
          </svg>