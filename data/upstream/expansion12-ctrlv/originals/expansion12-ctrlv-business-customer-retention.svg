<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g class="anim-float">
                <!-- Platform / Base Hands -->
                <path d="M100 240 Q150 200 200 220 Q250 200 300 240" stroke="var(--charcoal)" stroke-width="20" stroke-linecap="round" fill="none"/>
                <path d="M100 240 Q150 200 200 220 Q250 200 300 240" stroke="var(--secondary-color)" stroke-width="12" stroke-linecap="round" fill="none"/>
                <path d="M180 205 L190 215 M220 205 L210 215" stroke="var(--bg-surface)" stroke-width="4" stroke-linecap="round"/>
                
                <!-- Glowing Aura -->
                <circle class="anim-pulse" cx="200" cy="120" r="60" fill="var(--accent-color)" opacity="0.2"/>
                <circle class="anim-pulse" style="animation-delay: 0.2s;" cx="200" cy="120" r="40" fill="var(--accent-color)" opacity="0.4"/>
                
                <!-- Loyal Customer / Star -->
                <g class="anim-bounce">
                    <!-- Person Avatar -->
                    <circle cx="200" cy="100" r="25" fill="var(--primary-color)"/>
                    <path d="M160 160 Q200 120 240 160 Z" fill="var(--primary-color)"/>
                    
                    <!-- Star Badge -->
                    <path class="anim-rotate" d="M200 130 L205 145 H220 L208 155 L212 170 L200 160 L188 170 L192 155 L180 145 H195 Z" fill="var(--accent-color)"/>
                </g>
            </g>
          </svg>