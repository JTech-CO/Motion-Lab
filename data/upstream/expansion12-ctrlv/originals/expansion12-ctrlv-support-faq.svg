<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Papers list -->
            <path class="anim-float" style="animation-delay: 0.5s;" d="M140 70 H240 V220 H140 Z" fill="var(--charcoal)" opacity="0.2"/>
            <path class="anim-float" d="M120 90 H260 V240 H120 Z" fill="var(--secondary-color)"/>
            
            <g class="anim-float">
                <!-- Question Mark Q -->
                <path d="M170 140 C170 120 210 120 210 140 C210 155 190 160 190 180" stroke="var(--primary-color)" stroke-width="16" stroke-linecap="round" fill="none"/>
                <circle cx="190" cy="205" r="8" fill="var(--accent-color)"/>
                
                <!-- Q & A lines -->
                <path class="anim-draw" d="M140 120 H150 M140 160 H160 M250 160 H260" stroke="var(--bg-surface)" stroke-width="6" stroke-linecap="round"/>
            </g>
            <!-- Badge -->
            <circle class="anim-pulse" cx="260" cy="90" r="25" fill="var(--accent-color)"/>
            <path d="M250 90 L255 95 L270 80 M250 100 H270" stroke="var(--bg-surface)" stroke-width="4" stroke-linecap="round" fill="none"/>
          </svg>