<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g style="animation-duration: 6s;" class="anim-float">
                <!-- Tracks -->
                <rect x="140" y="220" width="120" height="40" rx="20" fill="var(--charcoal)"/>
                <path d="M150 220 H250 M150 260 H250 M140 240 L160 240 M240 240 L260 240" stroke="var(--primary-color)" stroke-width="4" stroke-dasharray="10 10"/>
                <g transform="translate(170, 240)">
                    <circle style="animation-duration: 10s;" class="anim-rotate" cx="0" cy="0" r="12" fill="var(--bg-surface)" stroke="var(--primary-color)" stroke-width="2"/>
                </g>
                <g transform="translate(230, 240)">
                    <circle style="animation-duration: 10s;" class="anim-rotate" cx="0" cy="0" r="12" fill="var(--bg-surface)" stroke="var(--primary-color)" stroke-width="2"/>
                </g>
                
                <!-- Main Body -->
                <path d="M150 220 V140 H190 V170 H250 V220 Z" fill="var(--secondary-color)"/>
                <path d="M160 150 H180 V170 H160 Z" fill="var(--bg-surface)" stroke="var(--charcoal)" stroke-width="4"/>
                
                <!-- Exhaust Pipe -->
                <rect x="220" y="120" width="10" height="50" fill="var(--charcoal)"/>
                <g transform="translate(225, 90)">
<g class="anim-float" style="animation-duration: 4s; animation-delay: 0.5s;" >
                    <circle cx="0" cy="0" r="10" fill="var(--charcoal)" opacity="0.2"/>
                    <circle cx="10" cy="-20" r="15" fill="var(--charcoal)" opacity="0.1"/>
                </g>
</g>
                
                <!-- Arm and Blade -->
                <g transform="translate(260, 230)">
<g class="anim-bounce" style="animation-duration: 6s;" >
                    <path style="animation-duration: 4s;" class="anim-draw" d="M-80 -20 L0 0" stroke="var(--charcoal)" stroke-width="8" stroke-linecap="round"/>
                    <path d="M-10 -30 Q20 -10 0 30 L-20 30 Q10 -10 -20 -30 Z" fill="var(--primary-color)"/>
                </g>
</g>
                
                <!-- Earth/Dirt Pile -->
                <path style="animation-duration: 4s;" class="anim-pulse" d="M250 260 Q280 200 320 260 Z" fill="var(--accent-color)" opacity="0.6"/>
            </g>
          </svg>