<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g class="anim-float">
                <!-- Payment Portal Device/Browser -->
                <rect x="130" y="60" width="140" height="200" rx="10" fill="var(--bg-surface)" stroke="var(--charcoal)" stroke-width="4"/>
                <path d="M130 100 H270" stroke="var(--charcoal)" stroke-width="4"/>
                <!-- Submit button -->
                <rect class="anim-pulse" x="150" y="210" width="100" height="30" rx="15" fill="var(--primary-color)"/>
                <!-- Invoice lines -->
                <path class="anim-draw" d="M150 120 H250 M150 135 H220 M150 150 H240 M150 180 H200" stroke="var(--charcoal)" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
            </g>
            
            <g class="anim-bounce">
                <!-- Floating Credit Card -->
                <rect x="60" y="100" width="120" height="75" rx="8" fill="var(--secondary-color)" transform="rotate(-15 120 137.5)"/>
                <rect x="60" y="115" width="120" height="15" fill="var(--charcoal)" opacity="0.9" transform="rotate(-15 120 137.5)"/>
                <rect x="75" y="145" width="20" height="15" rx="2" fill="var(--accent-color)" transform="rotate(-15 120 137.5)"/>
                <path d="M105 155 H145 M105 163 H135" stroke="white" stroke-width="2" transform="rotate(-15 120 137.5)" opacity="0.8"/>
            </g>
            
            <g class="anim-bounce" style="animation-delay: -0.5s;">
                <!-- Secure Lock Shield -->
                <path d="M280 120 C280 120 310 110 340 120 C340 170 310 200 310 200 C310 200 280 170 280 120 Z" fill="var(--accent-color)"/>
                <path d="M300 140 H320 V160 H300 Z" fill="var(--bg-surface)"/>
                <path d="M305 140 V130 C305 120 315 120 315 130 V140" stroke="var(--bg-surface)" stroke-width="3" fill="none"/>
            </g>
          </svg>