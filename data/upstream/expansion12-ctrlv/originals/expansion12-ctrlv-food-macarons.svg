<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="200" cy="270" rx="120" ry="10" fill="#E2E8F0" opacity="0.6"/>
            <g class="anim-float">
                <!-- Stack of 3 Macarons -->
                <g class="anim-bounce">
                    <!-- Bottom -->
                    <rect x="140" y="200" width="120" height="25" rx="12" fill="var(--primary-color)"/>
                    <rect x="140" y="215" width="120" height="15" fill="var(--bg-surface)" opacity="0.5"/>
                    <rect x="140" y="220" width="120" height="25" rx="12" fill="var(--primary-color)"/>
                    
                    <!-- Middle -->
                    <g style="animation-delay: 0.2s;">
                        <rect x="145" y="150" width="110" height="25" rx="12" fill="var(--secondary-color)"/>
                        <rect x="145" y="165" width="110" height="15" fill="var(--bg-surface)" opacity="0.5"/>
                        <rect x="145" y="170" width="110" height="25" rx="12" fill="var(--secondary-color)"/>
                    </g>
                    
                    <!-- Top -->
                    <g style="animation-delay: 0.4s;">
                        <rect x="150" y="100" width="100" height="25" rx="12" fill="var(--accent-color)"/>
                        <rect x="150" y="115" width="100" height="15" fill="var(--bg-surface)" opacity="0.5"/>
                        <rect x="150" y="120" width="100" height="25" rx="12" fill="var(--accent-color)"/>
                    </g>
                </g>
                
                <!-- Decorative sparkles -->
                <path class="anim-pulse" d="M120 100 L130 90 M130 100 L120 90" stroke="var(--primary-color)" stroke-width="2"/>
                <path class="anim-pulse" style="animation-delay: 0.5s;" d="M280 180 L290 170 M290 180 L280 170" stroke="var(--accent-color)" stroke-width="2"/>
            </g>
          </svg>