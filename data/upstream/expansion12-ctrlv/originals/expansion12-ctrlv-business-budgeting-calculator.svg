<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g class="anim-float">
                <!-- Calculator Body -->
                <rect x="120" y="40" width="160" height="220" rx="15" fill="var(--bg-surface)" stroke="var(--charcoal)" stroke-width="8"/>
                
                <!-- Display Screen -->
                <rect class="anim-pulse" x="140" y="60" width="120" height="40" rx="5" fill="var(--secondary-color)" opacity="0.8"/>
                <text x="250" y="88" font-family="monospace" font-weight="bold" font-size="20" fill="var(--bg-surface)" text-anchor="end">1,500</text>
                
                <!-- Buttons -->
                <!-- Row 1 -->
                <circle cx="155" cy="130" r="12" fill="var(--primary-color)"/>
                <circle cx="200" cy="130" r="12" fill="var(--primary-color)"/>
                <circle cx="245" cy="130" r="12" fill="var(--accent-color)"/>
                <!-- Row 2 -->
                <circle cx="155" cy="170" r="12" fill="var(--primary-color)"/>
                <circle cx="200" cy="170" r="12" fill="var(--primary-color)"/>
                <circle cx="245" cy="170" r="12" fill="var(--accent-color)"/>
                <!-- Row 3 -->
                <circle cx="155" cy="210" r="12" fill="var(--primary-color)"/>
                <circle cx="200" cy="210" r="12" fill="var(--primary-color)"/>
                <circle class="anim-bounce" cx="245" cy="210" r="12" fill="var(--secondary-color)"/>
                
                <path d="M240 210 H250 M240 206 H250 M240 214 H250" stroke="var(--bg-surface)" stroke-width="2"/>
                
                <!-- Floating Coins -->
                <g transform="translate(90, 100)">
                    <g class="anim-bounce" style="animation-delay: 0.2s;">
                    <circle cx="0" cy="0" r="15" fill="var(--accent-color)"/>
                    <circle cx="0" cy="0" r="10" fill="none" stroke="var(--bg-surface)" stroke-width="2"/>
                    <text x="0" y="5" font-family="monospace" font-weight="bold" font-size="14" fill="var(--bg-surface)" text-anchor="middle">$</text>
                </g>
                </g>
                <g transform="translate(310, 160)">
                    <g class="anim-bounce" style="animation-delay: 0.4s;">
                    <circle cx="0" cy="0" r="15" fill="var(--secondary-color)"/>
                    <circle cx="0" cy="0" r="10" fill="none" stroke="var(--bg-surface)" stroke-width="2"/>
                    <text x="0" y="5" font-family="monospace" font-weight="bold" font-size="14" fill="var(--bg-surface)" text-anchor="middle">$</text>
                </g>
                </g>
            </g>
          </svg>