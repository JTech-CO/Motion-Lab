<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g class="anim-bounce">
              <!-- Controller Body -->
              <path d="M80 160 C80 90 320 90 320 160 C320 220 280 250 250 200 L200 180 L150 200 C120 250 80 220 80 160 Z" fill="var(--primary-color)"/>
              <!-- D-Pad -->
              <path d="M120 140 H140 V160 H160 V180 H140 V200 H120 V180 H100 V160 H120 Z" fill="var(--charcoal)" opacity="0.8"/>
              <!-- Action Buttons -->
              <circle cx="280" cy="140" r="10" fill="var(--accent-color)"/>
              <circle cx="260" cy="160" r="10" fill="var(--secondary-color)"/>
              <circle cx="300" cy="160" r="10" fill="var(--secondary-color)"/>
              <circle cx="280" cy="180" r="10" fill="white" opacity="0.8"/>
              <!-- Analog sticks -->
              <circle cx="160" cy="200" r="15" fill="var(--charcoal)" opacity="0.5"/>
              <circle cx="240" cy="200" r="15" fill="var(--charcoal)" opacity="0.5"/>
            </g>
            <!-- Floating UI / Stars -->
            <path class="anim-pulse" d="M200 80 L205 95 L220 100 L205 105 L200 120 L195 105 L180 100 L195 95 Z" fill="var(--accent-color)"/>
            <circle class="anim-float" cx="120" cy="80" r="8" fill="var(--secondary-color)"/>
            <circle class="anim-float" cx="280" cy="90" r="5" fill="white" opacity="0.5" style="animation-delay:-0.5s"/>
          </svg>