<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Rangoli base -->
            <circle class="anim-rotate"  cx="200" cy="250" r="100" fill="none" stroke="var(--secondary-color)" stroke-width="6" stroke-dasharray="10 20" opacity="0.3"/>
            <circle class="anim-rotate"  cx="200" cy="250" r="70" fill="none" stroke="var(--primary-color)" stroke-width="4" stroke-dasharray="15 15" opacity="0.3"/>
            
            <!-- Dandiya Sticks crossing -->
            <g class="anim-bounce">
                <!-- Stick 1 -->
                <rect x="110" y="100" width="20" height="150" rx="10" fill="var(--primary-color)" transform="rotate(-45 120 175)"/>
                <path d="M120 130 L150 160 M140 110 L170 140" stroke="white" stroke-width="6" stroke-linecap="round"/>
                <!-- Stick 2 -->
                <rect x="270" y="100" width="20" height="150" rx="10" fill="var(--accent-color)" transform="rotate(45 280 175)"/>
                <path d="M280 130 L250 160 M260 110 L230 140" stroke="white" stroke-width="6" stroke-linecap="round"/>
            </g>
            
            <!-- Clashing impact lines -->
            <path class="anim-glow" d="M200 130 L200 90 M170 150 L140 120 M230 150 L260 120" stroke="var(--charcoal)" stroke-width="4" stroke-linecap="round" fill="none"/>
            <circle class="anim-pulse" cx="200" cy="150" r="30" fill="var(--secondary-color)" opacity="0.4"/>
          </svg>