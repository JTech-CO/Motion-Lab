<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g class="anim-float">
                <!-- Rear wheel -->
                <circle class="anim-rotate"  cx="130" cy="210" r="60" fill="none" stroke="var(--primary-color)" stroke-width="10"/>
                <circle cx="130" cy="210" r="8" fill="var(--primary-color)"/>
                <!-- Spokes -->
                <g class="anim-rotate"  stroke="var(--primary-color)" stroke-width="3" opacity="0.5">
                    <line x1="130" y1="150" x2="130" y2="270"/>
                    <line x1="70" y1="210" x2="190" y2="210"/>
                    <line x1="88" y1="168" x2="172" y2="252"/>
                    <line x1="172" y1="168" x2="88" y2="252"/>
                </g>

                <!-- Front wheel -->
                <circle class="anim-rotate"  cx="280" cy="210" r="60" fill="none" stroke="var(--primary-color)" stroke-width="10"/>
                <circle cx="280" cy="210" r="8" fill="var(--primary-color)"/>
                <g class="anim-rotate"  stroke="var(--primary-color)" stroke-width="3" opacity="0.5">
                    <line x1="280" y1="150" x2="280" y2="270"/>
                    <line x1="220" y1="210" x2="340" y2="210"/>
                    <line x1="238" y1="168" x2="322" y2="252"/>
                    <line x1="322" y1="168" x2="238" y2="252"/>
                </g>

                <!-- Frame -->
                <line x1="130" y1="210" x2="205" y2="140" stroke="var(--primary-color)" stroke-width="8" stroke-linecap="round"/>
                <line x1="205" y1="140" x2="280" y2="210" stroke="var(--primary-color)" stroke-width="8" stroke-linecap="round"/>
                <line x1="205" y1="140" x2="155" y2="210" stroke="var(--primary-color)" stroke-width="8" stroke-linecap="round"/>
                <line x1="205" y1="140" x2="280" y2="155" stroke="var(--primary-color)" stroke-width="6" stroke-linecap="round"/>

                <!-- Handlebars -->
                <path d="M270 125 Q280 115 300 120" stroke="var(--charcoal)" stroke-width="7" stroke-linecap="round" fill="none"/>
                <!-- Seat -->
                <path d="M185 130 L225 130" stroke="var(--charcoal)" stroke-width="10" stroke-linecap="round"/>
                <line x1="205" y1="130" x2="205" y2="148" stroke="var(--charcoal)" stroke-width="6"/>
                <!-- Pedal crank -->
                <circle cx="175" cy="210" r="10" fill="none" stroke="var(--secondary-color)" stroke-width="5"/>
                <line x1="165" y1="218" x2="185" y2="202" stroke="var(--secondary-color)" stroke-width="5" stroke-linecap="round"/>
            </g>
          </svg>