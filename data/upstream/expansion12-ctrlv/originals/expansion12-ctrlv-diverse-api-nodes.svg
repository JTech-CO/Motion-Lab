<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g class="anim-float">
                <!-- Server/Database -->
                <path class="anim-bounce" d="M150 80 H250 V140 H150 Z M150 80 C150 69 172 60 200 60 C228 60 250 69 250 80 M150 140 C150 151 172 160 200 160 C228 160 250 151 250 140" fill="var(--primary-color)" stroke="var(--charcoal)" stroke-width="6"/>
                <path d="M150 110 C150 121 172 130 200 130 C228 130 250 121 250 110" fill="none" stroke="var(--charcoal)" stroke-width="6"/>
                
                <!-- Connections -->
                <path class="anim-draw" d="M200 160 V220 M200 190 H100 V230 M200 190 H300 V230" stroke="var(--charcoal)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                
                <!-- Endpoints/Nodes -->
                <g transform="translate(100, 240)">
                    <g class="anim-pulse">
                    <rect x="-30" y="-15" width="60" height="30" rx="4" fill="var(--secondary-color)"/>
                    <text x="0" y="4" font-family="monospace" font-weight="bold" font-size="12" fill="var(--bg-surface)" text-anchor="middle">GET</text>
                </g>
                </g>
                <g transform="translate(200, 240)">
                    <g class="anim-pulse" style="animation-delay: 0.2s;">
                    <rect x="-30" y="-15" width="60" height="30" rx="4" fill="var(--accent-color)"/>
                    <text x="0" y="4" font-family="monospace" font-weight="bold" font-size="12" fill="var(--bg-surface)" text-anchor="middle">POST</text>
                </g>
                </g>
                <g transform="translate(300, 240)">
                    <g class="anim-pulse" style="animation-delay: 0.4s;">
                    <rect x="-30" y="-15" width="60" height="30" rx="4" fill="var(--primary-color)"/>
                    <text x="0" y="4" font-family="monospace" font-weight="bold" font-size="12" fill="var(--bg-surface)" text-anchor="middle">PUT</text>
                </g>
                </g>
                
                <!-- Data Packets Flowing -->
                <circle class="anim-draw" cx="200" cy="180" r="6" fill="var(--accent-color)"/>
                <circle class="anim-draw" style="animation-delay: 0.5s;" cx="150" cy="190" r="6" fill="var(--accent-color)"/>
            </g>
          </svg>