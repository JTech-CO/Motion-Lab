<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g class="anim-float">
                <!-- Needle Base -->
                <rect x="185" y="60" width="30" height="20" rx="2" fill="var(--secondary-color)"/>
                <!-- Needle -->
                <line x1="200" y1="60" x2="200" y2="20" stroke="var(--charcoal)" stroke-width="4"/>
                <path d="M198 20 L202 20 L200 15 Z" fill="var(--charcoal)"/>
                
                <!-- Main Barrel -->
                <rect x="170" y="80" width="60" height="120" rx="5" fill="var(--bg-surface)" stroke="var(--primary-color)" stroke-width="4"/>
                <rect x="174" y="100" width="52" height="96" fill="var(--secondary-color)" opacity="0.3"/>
                
                <!-- Measurement Marks -->
                <line x1="170" y1="110" x2="185" y2="110" stroke="var(--primary-color)" stroke-width="3"/>
                <line x1="170" y1="130" x2="195" y2="130" stroke="var(--primary-color)" stroke-width="3"/>
                <line x1="170" y1="150" x2="185" y2="150" stroke="var(--primary-color)" stroke-width="3"/>
                <line x1="170" y1="170" x2="195" y2="170" stroke="var(--primary-color)" stroke-width="3"/>
                
                <!-- Plunger inside barrel -->
                <rect class="anim-pulse" style="animation-duration: 3s; transform-origin: top;" x="174" y="84" width="52" height="20" fill="var(--charcoal)"/>
                
                <!-- Plunger Rod -->
                <rect class="anim-pulse" style="animation-duration: 3s; transform-origin: top;" x="190" y="200" width="20" height="40" fill="var(--primary-color)"/>
                <!-- Plunger Handle -->
                <rect class="anim-pulse" style="animation-duration: 3s; transform-origin: top;" x="160" y="240" width="80" height="15" rx="5" fill="var(--primary-color)"/>
            </g>
            
            <!-- Liquid Drop -->
            <circle class="anim-data" cx="200" cy="10" r="4" fill="var(--accent-color)"/>
          </svg>