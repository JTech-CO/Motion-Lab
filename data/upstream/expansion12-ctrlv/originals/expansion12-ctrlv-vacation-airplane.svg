<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g class="anim-fly">
                <path class="anim-draw" d="M80 200 Q150 250 200 200 T300 100" stroke="var(--primary-color)" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 10" fill="none"/>
                <g transform="translate(260, 100) translate(-200, -150) rotate(-20 200 150)">
                    <ellipse cx="200" cy="150" rx="60" ry="20" fill="var(--secondary-color)"/>
                    <path d="M150 150 Q120 150 140 130 L160 150 Z" fill="var(--charcoal)"/>
                    <path d="M190 150 L220 100 L230 150 Z" fill="var(--primary-color)"/>
                    <path d="M190 150 L210 180 L220 150 Z" fill="var(--primary-color)"/>
                    <circle cx="210" cy="145" r="3" fill="var(--bg-surface)"/>
                    <circle cx="225" cy="145" r="3" fill="var(--bg-surface)"/>
                    <circle cx="240" cy="145" r="3" fill="var(--bg-surface)"/>
                    <circle cx="170" cy="145" r="6" fill="var(--bg-surface)"/>
                </g>
            </g>
            <style>
                .anim-fly {
                    animation: flyPath 4s infinite ease-in-out alternate;
                }
                @keyframes flyPath {
                    0% { transform: translate(-20px, 20px); }
                    100% { transform: translate(20px, -20px); }
                }
            </style>
          </svg>