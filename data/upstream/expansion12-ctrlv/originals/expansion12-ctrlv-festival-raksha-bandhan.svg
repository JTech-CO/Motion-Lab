<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Thread wrapping -->
            <path class="anim-draw" d="M50 150 C100 100 150 200 200 150 C250 100 300 200 350 150" stroke="var(--accent-color)" stroke-width="6" fill="none" stroke-linecap="round"/>
            <path class="anim-draw" d="M60 160 C110 110 160 210 210 160 C260 110 310 210 360 160" stroke="var(--primary-color)" stroke-width="6" fill="none" stroke-linecap="round" style="animation-delay: 0.2s;"/>
            <g class="anim-bounce">
                <!-- Centerpiece (Rakhi Dial) -->
                <circle cx="200" cy="150" r="40" fill="var(--secondary-color)"/>
                <circle cx="200" cy="150" r="25" fill="var(--bg-surface)"/>
                <polygon points="200,120 210,140 230,150 210,160 200,180 190,160 170,150 190,140" fill="var(--primary-color)"/>
                <circle cx="200" cy="150" r="8" fill="var(--accent-color)"/>
            </g>
            <!-- Floating beads -->
            <circle class="anim-float" cx="130" cy="140" r="8" fill="var(--charcoal)"/>
            <circle class="anim-float" cx="100" cy="160" r="5" fill="var(--secondary-color)"/>
            <circle class="anim-float" cx="270" cy="160" r="8" fill="var(--charcoal)" style="animation-delay: -1s"/>
            <circle class="anim-float" cx="300" cy="140" r="5" fill="var(--secondary-color)" style="animation-delay: -2s"/>
          </svg>