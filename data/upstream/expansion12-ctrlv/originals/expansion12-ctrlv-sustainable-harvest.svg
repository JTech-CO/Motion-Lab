<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="200" cy="270" rx="150" ry="12" fill="#E2E8F0"/>
            <!-- Sun and Hills -->
            <circle class="anim-glow" cx="300" cy="100" r="40" fill="var(--accent-color)" opacity="0.2"/>
            <path class="anim-float" d="M50 260 Q120 180 220 260 T380 260 Z" fill="var(--secondary-color)" opacity="0.1"/>
            <!-- Tractor/Harvester Base -->
            <path class="anim-bounce" d="M120 220 H240 L260 250 H100 Z" fill="var(--primary-color)"/>
            <rect class="anim-bounce" x="140" y="160" width="60" height="60" rx="8" fill="var(--primary-color)"/>
            <rect class="anim-bounce" x="150" y="170" width="40" height="30" fill="white" opacity="0.6"/>
            <circle class="anim-float" cx="130" cy="250" r="20" fill="var(--charcoal)"/>
            <circle class="anim-float" cx="230" cy="250" r="25" fill="var(--charcoal)" style="animation-delay: -0.2s"/>
            <circle cx="130" cy="250" r="8" fill="white"/>
            <circle cx="230" cy="250" r="10" fill="white"/>
            <!-- Crops being harvested -->
            <path class="anim-draw" d="M280 260 V220 M300 260 V230 M320 260 V210" stroke="var(--primary-color)" stroke-width="6" stroke-linecap="round"/>
            <path class="anim-draw" d="M340 260 V240 M360 260 V220" stroke="var(--secondary-color)" stroke-width="6" stroke-linecap="round"/>
            <!-- Leaves floating into hopper -->
            <path class="anim-data" d="M260 210 Q240 180 200 180" stroke="var(--accent-color)" stroke-dasharray="6 6" stroke-width="4" fill="none"/>
          </svg>