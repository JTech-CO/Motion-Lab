<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g class="anim-float">
                <!-- Podium -->
                <polygon points="120,250 280,250 250,150 150,150" fill="var(--primary-color)"/>
                <rect x="130" y="140" width="140" height="15" fill="var(--secondary-color)"/>
                
                <!-- Microphone -->
                <path d="M190 140 L180 100" stroke="var(--charcoal)" stroke-width="4" fill="none"/>
                <ellipse cx="180" cy="95" rx="8" ry="12" fill="var(--charcoal)"/>
                
                <!-- Speech/Testimony -->
                <g class="anim-pulse" >
                    <path class="anim-draw" d="M210 80 Q240 50 280 60" stroke="var(--accent-color)" stroke-width="6" stroke-linecap="round" fill="none"/>
                    <path class="anim-draw" style="animation-delay: 0.2s;" d="M220 100 Q260 90 290 110" stroke="var(--accent-color)" stroke-width="6" stroke-linecap="round" fill="none"/>
                    <circle cx="285" cy="65" r="4" fill="var(--accent-color)"/>
                    <circle cx="295" cy="115" r="4" fill="var(--accent-color)"/>
                </g>
            </g>
          </svg>