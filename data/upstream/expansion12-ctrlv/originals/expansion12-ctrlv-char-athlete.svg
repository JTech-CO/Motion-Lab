<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="200" cy="270" rx="140" ry="10" fill="#E2E8F0" opacity="0.6"/>
            <!-- Background: Stadium Track -->
            <g class="anim-float-slow" opacity="0.15">
                <path class="anim-glow" d="M60 220 C140 150 260 150 340 220" stroke="var(--accent-color)" stroke-width="12" fill="none"/>
                <path d="M80 240 C160 180 240 180 320 240" stroke="var(--charcoal)" stroke-width="4" stroke-dasharray="10 10" fill="none"/>
            </g>
            
            <g class="anim-bounce">
                <!-- Character Body -->
                <path d="M130 260 C130 150 230 150 230 260 Z" fill="var(--primary-color)"/>
                <!-- Tank Top/Jersey -->
                <path d="M150 170 C150 200 210 200 210 170" fill="var(--bg-surface)" opacity="0.3"/>
                <!-- Number 1 -->
                <path d="M175 220 L180 200 V240" stroke="var(--bg-surface)" stroke-width="6" stroke-linecap="round"/>
                
                <!-- Head -->
                <circle cx="180" cy="120" r="35" fill="var(--secondary-color)"/>
                <!-- Headband -->
                <path d="M145 110 H215" stroke="var(--accent-color)" stroke-width="8"/>
                
                <!-- Prop: Trophy/Medal -->
                <!-- Medal around neck -->
                <path d="M160 150 L180 190 L200 150" stroke="var(--accent-color)" stroke-width="3" fill="none"/>
                <circle class="anim-pulse" cx="180" cy="190" r="8" fill="var(--accent-color)"/>
                
                <!-- Prop: Trophy -->
                <g class="anim-float" style="transform-origin: 260px 150px;">
                    <path class="anim-glow" d="M240 140 Q260 180 280 140 Z" fill="var(--accent-color)"/>
                    <rect x="250" y="180" width="20" height="20" fill="var(--charcoal)"/>
                    <path d="M240 140 C220 140 220 160 240 160 M280 140 C300 140 300 160 280 160" stroke="var(--accent-color)" stroke-width="4" fill="none"/>
                </g>
            </g>
          </svg>