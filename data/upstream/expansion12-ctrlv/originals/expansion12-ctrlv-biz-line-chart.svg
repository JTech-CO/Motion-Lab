<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="200" cy="270" rx="140" ry="10" fill="#E2E8F0" opacity="0.6"/>
            <!-- Grid Background -->
            <g stroke="var(--charcoal)" stroke-width="2" stroke-linecap="round" opacity="0.2">
                <line x1="70" y1="210" x2="310" y2="210"/>
                <line x1="70" y1="160" x2="310" y2="160"/>
                <line x1="70" y1="110" x2="310" y2="110"/>
                <line x1="70" y1="60" x2="310" y2="60"/>
                
                <line x1="130" y1="240" x2="130" y2="60"/>
                <line x1="190" y1="240" x2="190" y2="60"/>
                <line x1="250" y1="240" x2="250" y2="60"/>
            </g>
            
            <!-- Axes -->
            <path d="M70 60 V240 H330" stroke="var(--charcoal)" stroke-width="6" stroke-linecap="round"/>
            
            <!-- Area Fill Underneath -->
            <path class="anim-float" d="M70 240 L110 180 L170 200 L230 110 L290 140 L330 70 V240 Z" fill="var(--secondary-color)" opacity="0.3"/>
            
            <!-- The Magic Trend Line -->
            <path class="anim-draw" d="M70 200 L110 180 L170 200 L230 110 L290 140 L330 70" stroke="var(--primary-color)" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            
            <g class="anim-glow">
                <!-- Data Points -->
                <circle cx="110" cy="180" r="8" fill="var(--bg-surface)" stroke="var(--primary-color)" stroke-width="4"/>
                <circle cx="170" cy="200" r="8" fill="var(--bg-surface)" stroke="var(--primary-color)" stroke-width="4"/>
                <circle cx="230" cy="110" r="8" fill="var(--bg-surface)" stroke="var(--primary-color)" stroke-width="4"/>
                <circle cx="290" cy="140" r="8" fill="var(--bg-surface)" stroke="var(--primary-color)" stroke-width="4"/>
                <circle class="anim-pulse" cx="330" cy="70" r="12" fill="var(--accent-color)"/>
                <circle cx="330" cy="70" r="4" fill="var(--bg-surface)"/>
            </g>
          </svg>