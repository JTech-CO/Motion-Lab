            <circle class="anim-float" cx="180" cy="120" r="8" fill="var(--charcoal)" opacity="0.2"/>
            <circle class="anim-float" cx="220" cy="150" r="12" fill="var(--charcoal)" opacity="0.2"/>
            <circle class="anim-float" cx="190" cy="160" r="6" fill="var(--charcoal)" opacity="0.2"/>
            <!-- Rings -->
            <g transform="rotate(-15 200 140)">
                <ellipse class="anim-float" style="animation-delay: -1s;" cx="200" cy="140" rx="90" ry="25" fill="none" stroke="var(--secondary-color)" stroke-width="8" />
            </g>
            <g transform="rotate(-15 200 140)">
                <ellipse class="anim-float" style="animation-delay: -1s;" cx="200" cy="140" rx="100" ry="30" fill="none" stroke="var(--charcoal)" stroke-width="2"  opacity="0.5"/>
            </g>
