<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
        <line x1="100" y1="200" x2="300" y2="100" class="anim-bounce" stroke="var(--charcoal)" stroke-width="4"/>
        <g transform="translate(150, 175)" class="anim-bounce">
            <circle r="30" fill="var(--primary-color)" opacity="0.6"/>
            <text text-anchor="middle" dy="5" font-family="Inter" font-weight="900" font-size="12" fill="white">RISK</text>
        </g>
        <g transform="translate(250, 125)" class="anim-bounce" style="animation-delay: -1s">
            <circle r="40" fill="var(--secondary-color)" opacity="0.8"/>
            <text text-anchor="middle" dy="5" font-family="Inter" font-weight="900" font-size="12" fill="white">REWARD</text>
        </g>
    </svg>