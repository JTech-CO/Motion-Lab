<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="200" cy="270" rx="130" ry="10" fill="#E2E8F0"/>
            
            <!--Glowing Aurora / Heat dissipation-->
            <circle class="anim-pulse" cx="200" cy="150" r="90" fill="var(--secondary-color)" opacity="0.1"/>
            <circle class="anim-pulse" cx="200" cy="150" r="60" fill="var(--accent-color)" opacity="0.1" style="animation-delay: -1s"/>

            <!--Perspective Base Board-->
            <path d="M100 220 L150 100 H250 L300 220 Z" fill="var(--primary-color)"/>
            <path d="M120 210 L160 110 H240 L280 210 Z" fill="var(--bg-surface)" opacity="0.1"/>
            
            <g class="anim-float">
                <!-- Floating Quantum Core -->
                <rect x="175" y="125" width="50" height="50" rx="10" fill="var(--charcoal)"/>
                <!-- Inner quantum matrix -->
                <circle cx="200" cy="150" r="15" fill="none" stroke="var(--secondary-color)" stroke-width="3"/>
                <path class="anim-rotate"  d="M200 130 V170 M180 150 H220 M185 135 L215 165 M185 165 L215 135" stroke="var(--accent-color)" stroke-width="2"/>
                <circle class="anim-glow" cx="200" cy="150" r="4" fill="white"/>
                
                <!-- Connection Pins / Lasers down to the board -->
                <path class="anim-draw" d="M185 175 V195 M200 175 V200 M215 175 V195" stroke="var(--accent-color)" stroke-width="3" stroke-linecap="round"/>
                <path class="anim-draw" d="M175 165 L155 180 M175 135 L155 120" stroke="var(--secondary-color)" stroke-width="3" stroke-linecap="round"/>
                <path class="anim-draw" d="M225 165 L245 180 M225 135 L245 120" stroke="var(--secondary-color)" stroke-width="3" stroke-linecap="round"/>
            </g>

            <!--Circuit tracks on main board-->
  <path d="M140 200 L110 215 M150 200 L130 215 M260 200 L290 215 M250 200 L270 215" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.4" />
          </svg>