<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g class="anim-float">
                <!-- Radar Dish -->
                <path d="M160 220 H240 M200 220 V180" stroke="var(--charcoal)" stroke-width="8" stroke-linecap="round"/>
                <path d="M140 140 C140 190 260 190 260 140" stroke="var(--primary-color)" stroke-width="12" fill="none" stroke-linecap="round"/>
                <circle cx="200" cy="150" r="8" fill="var(--accent-color)"/>
                
                <!-- Radar Waves -->
                <g class="anim-pulse">
                    <path d="M160 110 C180 90 220 90 240 110" stroke="var(--secondary-color)" stroke-width="4" stroke-linecap="round" fill="none"/>
                    <path style="animation-delay: 0.3s" d="M140 80 C170 50 230 50 260 80" stroke="var(--secondary-color)" stroke-width="4" stroke-linecap="round" fill="none"/>
                </g>

                <!-- Detected Issue (Asteroid/Dot) before it hits -->
                <g class="anim-bounce">
                    <circle cx="280" cy="60" r="10" fill="var(--accent-color)"/>
                    <path d="M295 45 L285 55" stroke="var(--accent-color)" stroke-width="4" stroke-linecap="round"/>
                </g>
                <!-- Alert Target Reticle on the issue -->
                <circle class="anim-glow" cx="280" cy="60" r="20" stroke="var(--primary-color)" stroke-width="2" fill="none" stroke-dasharray="4 4"/>
            </g>
          </svg>