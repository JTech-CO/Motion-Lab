<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g class="anim-float">
                <!-- Base / Ground -->
                <line x1="80" y1="260" x2="320" y2="260" stroke="var(--charcoal)" stroke-width="8" stroke-linecap="round"/>
                
                <!-- High-rise 1 (Left) -->
                <rect class="anim-bounce" style="animation-delay: 0.2s;" x="110" y="100" width="70" height="160" fill="var(--primary-color)"/>
                <!-- Windows -->
                <rect x="125" y="120" width="15" height="20" fill="var(--bg-surface)"/>
                <rect x="150" y="120" width="15" height="20" fill="var(--bg-surface)"/>
                <rect x="125" y="150" width="15" height="20" fill="var(--bg-surface)"/>
                <rect x="150" y="150" width="15" height="20" fill="var(--bg-surface)"/>
                <rect x="125" y="180" width="15" height="20" fill="var(--bg-surface)"/>
                <rect x="150" y="180" width="15" height="20" fill="var(--bg-surface)"/>
                
                <!-- High-rise 2 (Center/Front) -->
                <rect class="anim-bounce" x="160" y="60" width="80" height="200" rx="5" fill="var(--secondary-color)"/>
                <!-- Vertical Glass / Lines -->
                <line x1="180" y1="80" x2="180" y2="240" stroke="var(--bg-surface)" stroke-width="8"/>
                <line x1="200" y1="80" x2="200" y2="240" stroke="var(--bg-surface)" stroke-width="8"/>
                <line x1="220" y1="80" x2="220" y2="240" stroke="var(--bg-surface)" stroke-width="8"/>
                
                <!-- Networking / Connectivity Halo -->
                <path class="anim-draw" d="M100 140 C100 60 300 60 300 140" stroke="var(--accent-color)" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 10" fill="none"/>
                
                <!-- Nodes -->
                <circle class="anim-pulse" cx="200" cy="72" r="8" fill="var(--accent-color)"/>
                <circle class="anim-pulse" style="animation-delay: 0.3s;" cx="120" cy="110" r="6" fill="var(--accent-color)"/>
                <circle class="anim-pulse" style="animation-delay: 0.6s;" cx="280" cy="110" r="6" fill="var(--accent-color)"/>
                
                <!-- High-rise 3 (Right) -->
                <path class="anim-bounce" style="animation-delay: 0.4s;" d="M230 140 L280 120 V260 H230 Z" fill="var(--primary-color)" opacity="0.8"/>
            </g>
          </svg>