<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g style="animation-duration: 6s;" class="anim-float">
                <!-- Extended Tape -->
                <g style="animation-duration: 4s;" class="anim-draw">
                    <path d="M120 180 L360 120" stroke="var(--accent-color)" stroke-width="24" stroke-linecap="round"/>
                    <!-- Tape Markings -->
                    <g stroke="var(--bg-surface)" stroke-width="4" transform="rotate(-14, 240, 150)">
                        <line x1="160" y1="140" x2="160" y2="150"/>
                        <line x1="200" y1="140" x2="200" y2="160"/>
                        <line x1="240" y1="140" x2="240" y2="150"/>
                        <line x1="280" y1="140" x2="280" y2="160"/>
                        <line x1="320" y1="140" x2="320" y2="150"/>
                    </g>
                    <!-- Hook at end -->
                    <path d="M355 120 V140 H365" stroke="var(--charcoal)" stroke-width="6" fill="none"/>
                </g>
                
                <!-- Tape Measure Body -->
                <g style="animation-duration: 5s;" class="anim-bounce">
                    <rect x="60" y="140" width="100" height="100" rx="20" fill="var(--primary-color)" stroke="var(--charcoal)" stroke-width="8"/>
                    <!-- Belt Clip/Detail -->
                    <circle cx="110" cy="190" r="25" fill="var(--bg-surface)" stroke="var(--charcoal)" stroke-width="6"/>
                    <rect x="100" y="170" width="20" height="40" rx="10" fill="var(--secondary-color)"/>
                    
                    <!-- Retract Button -->
                    <path d="M130 140 H160 V160 H130 Z" fill="var(--accent-color)" stroke="var(--charcoal)" stroke-width="4"/>
                </g>
            </g>
          </svg>