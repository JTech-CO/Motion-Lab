<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
        <g class="anim-float">
            <rect x="150" y="200" width="100" height="40" rx="4" fill="var(--charcoal)"/>
        </g>
        <g class="anim-bounce">
            <circle cx="170" cy="100" r="15" fill="var(--primary-color)"/>
            <circle style="animation-delay: -0.2s" cx="200" cy="80" r="15" fill="var(--primary-color)"/>
            <circle style="animation-delay: -0.4s" cx="230" cy="100" r="15" fill="var(--primary-color)"/>
        </g>
        <g class="anim-data">
            <rect x="195" y="130" width="10" height="40" fill="var(--secondary-color)" opacity="0.6"/>
            <rect x="165" y="150" width="10" height="30" fill="var(--secondary-color)" opacity="0.6"/>
            <rect x="225" y="150" width="10" height="35" fill="var(--secondary-color)" opacity="0.6"/>
        </g>
    </svg>