<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Sound Block -->
            <ellipse class="anim-pulse" cx="120" cy="220" rx="60" ry="15" fill="var(--secondary-color)"/>
            <path d="M60 220 V235 C60 250 180 250 180 235 V220 Z" fill="var(--primary-color)"/>
            
            <!-- Gavel -->
            <g class="anim-rotate" >
                <!-- Handle -->
                <rect transform="rotate(25 280 100)" x="270" y="80" width="20" height="150" rx="10" fill="var(--primary-color)"/>
                <!-- Head -->
                <g transform="rotate(25 280 100) translate(280, 80)">
                    <rect x="-40" y="-20" width="80" height="40" rx="5" fill="var(--secondary-color)"/>
                    <rect x="-45" y="-15" width="10" height="30" rx="3" fill="var(--accent-color)"/>
                    <rect x="35" y="-15" width="10" height="30" rx="3" fill="var(--accent-color)"/>
                    <circle cx="0" cy="0" r="10" fill="var(--bg-surface)"/>
                </g>
            </g>
            <!-- Impact Lines -->
            <g class="anim-draw">
                <path d="M120 180 L120 150 M90 190 L60 170 M150 190 L180 170" stroke="var(--accent-color)" stroke-width="4" stroke-linecap="round" fill="none"/>
            </g>
          </svg>