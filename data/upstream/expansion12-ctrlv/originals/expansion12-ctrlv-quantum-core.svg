<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Containment Field -->
            <circle class="anim-pulse" cx="200" cy="140" r="90" fill="var(--secondary-color)" opacity="0.05"/>
            <path class="anim-float" d="M120 140 A80 80 0 1 0 280 140 A80 80 0 1 0 120 140 Z" stroke="var(--secondary-color)" stroke-width="2" stroke-dasharray="10 10" fill="none" opacity="0.4"/>
            
            <!-- Quantum Rings -->
            <g class="anim-rotate" >
                <ellipse cx="200" cy="140" rx="70" ry="20" fill="none" stroke="var(--primary-color)" stroke-width="8" transform="rotate(30 200 140)"/>
                <ellipse cx="200" cy="140" rx="70" ry="20" fill="none" stroke="var(--primary-color)" stroke-width="8" transform="rotate(-30 200 140)" opacity="0.8"/>
                <ellipse cx="200" cy="140" rx="70" ry="20" fill="none" stroke="var(--primary-color)" stroke-width="8" transform="rotate(90 200 140)" opacity="0.6"/>
            </g>
            
            <!-- Core / Qubit -->
            <circle class="anim-glow" cx="200" cy="140" r="20" fill="var(--primary-color)"/>
            <circle class="anim-glow" cx="200" cy="140" r="10" fill="var(--accent-color)"/>
            
            <!-- Tech Base/Pedestal -->
            <path d="M160 260 L180 220 H220 L240 260 Z" fill="var(--primary-color)"/>
            <rect x="150" y="260" width="100" height="10" rx="2" fill="var(--charcoal)"/>
            <path class="anim-draw" d="M200 220 V180" stroke="var(--accent-color)" stroke-width="4" fill="none" stroke-dasharray="4 4"/>
          </svg>