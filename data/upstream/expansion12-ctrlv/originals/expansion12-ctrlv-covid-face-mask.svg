<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g class="anim-float">
                <!-- Elastic loops -->
                <path class="anim-pulse" d="M120 120 C80 100 60 150 60 170 C60 190 80 220 120 200" stroke="var(--charcoal)" stroke-width="4" fill="none" opacity="0.5"/>
                <path class="anim-pulse" style="animation-delay: -0.5s;" d="M280 120 C320 100 340 150 340 170 C340 190 320 220 280 200" stroke="var(--charcoal)" stroke-width="4" fill="none" opacity="0.5"/>
                
                <!-- Mask Body -->
                <rect x="110" y="100" width="180" height="120" rx="15" fill="var(--primary-color)" opacity="0.9"/>
                
                <!-- Mask Folds -->
                <path d="M110 130 Q200 140 290 130 M110 160 Q200 170 290 160 M110 190 Q200 200 290 190" stroke="var(--bg-surface)" stroke-width="4" opacity="0.6" stroke-linecap="round"/>
                
                <!-- Nose Wire -->
                <path d="M170 110 H230" stroke="var(--bg-surface)" stroke-width="6" stroke-linecap="round"/>
                
                <!-- Edges -->
                <rect x="105" y="100" width="10" height="120" rx="5" fill="var(--secondary-color)"/>
                <rect x="285" y="100" width="10" height="120" rx="5" fill="var(--secondary-color)"/>
            </g>
          </svg>