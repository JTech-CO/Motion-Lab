<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g class="anim-float">
                <path class="anim-draw" d="M200 90 L120 180 M200 90 L280 180 M120 180 H280" stroke="var(--charcoal)" stroke-width="4" stroke-dasharray="8 8" fill="none"/>
                
                <ellipse cx="200" cy="90" rx="40" ry="20" fill="var(--primary-color)"/>
                <ellipse cx="120" cy="180" rx="40" ry="20" fill="var(--secondary-color)"/>
                <ellipse cx="280" cy="180" rx="40" ry="20" fill="var(--accent-color)"/>
                
                <circle class="anim-pulse" cx="200" cy="90" r="5" fill="white"/>
                <circle class="anim-pulse" style="animation-delay: 0.2s;" cx="120" cy="180" r="5" fill="white"/>
                <circle class="anim-pulse" style="animation-delay: 0.4s;" cx="280" cy="180" r="5" fill="white"/>
            </g>
