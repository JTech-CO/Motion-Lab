<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="200" cy="270" rx="140" ry="10" fill="#E2E8F0" opacity="0.6"/>
            <!-- Axes & Grid -->
            <path d="M80 60 V240 H320" stroke="var(--charcoal)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
            <g stroke="var(--charcoal)" stroke-width="2" opacity="0.2">
                <line x1="80" y1="180" x2="320" y2="180"/>
                <line x1="80" y1="120" x2="320" y2="120"/>
                <line x1="160" y1="240" x2="160" y2="60"/>
                <line x1="240" y1="240" x2="240" y2="60"/>
            </g>
            
            <g class="anim-float">
                <!-- Group 1: Primary Dots (Correlation) -->
                <circle cx="120" cy="200" r="10" fill="var(--primary-color)"/>
                <circle cx="150" cy="180" r="12" fill="var(--primary-color)"/>
                <circle cx="180" cy="210" r="8" fill="var(--primary-color)"/>
                <circle cx="210" cy="150" r="15" fill="var(--primary-color)"/>
                <circle cx="240" cy="120" r="10" fill="var(--primary-color)"/>
                <circle cx="280" cy="80" r="16" fill="var(--primary-color)"/>
                <circle cx="300" cy="100" r="10" fill="var(--primary-color)"/>
                
                <!-- Group 2: Accent Dots (Outliers/Different Segment) -->
                <g class="anim-pulse" fill="var(--accent-color)">
                    <circle cx="110" cy="120" r="8"/>
                    <circle cx="140" cy="90" r="12"/>
                    <circle cx="270" cy="200" r="14"/>
                    <circle cx="290" cy="180" r="10"/>
                </g>
                
                <!-- Selection Box / Zoom Tool -->
                <rect x="200" y="110" width="90" height="50" fill="var(--secondary-color)" opacity="0.2" stroke="var(--secondary-color)" stroke-width="2" stroke-dasharray="5 5"/>
                <circle cx="245" cy="135" r="5" fill="var(--bg-surface)" stroke="var(--secondary-color)" stroke-width="2"/>
            </g>
            
            <!-- Overall Trend Arrow Line transparent -->
            <path class="anim-draw" d="M90 220 L310 70" stroke="var(--charcoal)" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 10" fill="none" opacity="0.5"/>
          </svg>