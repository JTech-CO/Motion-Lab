<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M80 240 H320" stroke="var(--charcoal)" stroke-width="2"/>
        <g class="anim-bounce">
            <rect x="100" y="180" width="30" height="60" fill="var(--primary-color)"/>
            <rect x="150" y="140" width="30" height="100" fill="var(--primary-color)" opacity="0.8"/>
            <rect x="200" y="190" width="30" height="50" fill="var(--primary-color)" opacity="0.6"/>
            <rect x="250" y="100" width="30" height="140" fill="var(--accent-color)"/>
        </g>
        <g class="anim-draw">
            <path d="M100 160 L150 120 L200 130 L250 80 L300 60" stroke="var(--secondary-color)" stroke-width="4" stroke-linecap="round" fill="none"/>
        </g>
        <circle class="anim-pulse" cx="300" cy="60" r="10" fill="var(--secondary-color)" opacity="0.3"/>
    </svg>