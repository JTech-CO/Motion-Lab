<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Smartwatch Frame -->
        <rect x="140" y="60" width="120" height="180" rx="30" fill="var(--charcoal)"/>
        <rect x="150" y="80" width="100" height="140" rx="15" fill="var(--bg-surface)"/>
        
        <!-- Activity Rings -->
        <g class="anim-draw">
            <circle cx="200" cy="130" r="35" stroke="var(--primary-color)" stroke-width="8" stroke-dasharray="160 220" stroke-linecap="round"/>
            <circle cx="200" cy="130" r="25" stroke="var(--secondary-color)" stroke-width="8" stroke-dasharray="100 150" stroke-linecap="round"/>
            <circle cx="200" cy="130" r="15" stroke="var(--accent-color)" stroke-width="8" stroke-dasharray="60 90" stroke-linecap="round"/>
        </g>
        
        <!-- Stats Text -->
        <g class="anim-pulse">
            <text x="175" y="200" font-family="Inter, sans-serif" font-weight="800" font-size="20" fill="var(--charcoal)">8,420</text>
            <text x="188" y="215" font-family="Inter, sans-serif" font-weight="500" font-size="10" fill="var(--text-muted)">STEPS</text>
        </g>
        
        <!-- Side Button -->
        <rect x="258" y="120" width="6" height="30" rx="3" fill="var(--charcoal)"/>
    </svg>