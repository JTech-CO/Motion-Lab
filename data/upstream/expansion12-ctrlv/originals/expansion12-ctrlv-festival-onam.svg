<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Pookalam (Flower Rangoli) abstract -->
            <g class="anim-rotate" >
                <path d="M200 100 C250 150 250 250 200 300 C150 250 150 150 200 100 Z" fill="var(--secondary-color)" opacity="0.2"/>
                <path d="M100 200 C150 150 250 150 300 200 C250 250 150 250 100 200 Z" fill="var(--primary-color)" opacity="0.2"/>
                <circle cx="200" cy="200" r="40" fill="var(--accent-color)" opacity="0.3"/>
            </g>
            <g class="anim-float">
                <!-- Snake Boat (Vallam Kali) Motif -->
                <path d="M50 200 Q200 260 350 180 Q320 220 200 230 Q100 220 50 200 Z" fill="var(--primary-color)"/>
                <path d="M50 200 Q60 170 80 160 Q70 180 60 200 Z" fill="var(--charcoal)"/>
                <path d="M350 180 Q330 160 300 150 Q320 170 340 190 Z" fill="var(--charcoal)"/>
