<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g class="anim-float">
                <!-- Monitor Frame -->
                <rect x="60" y="40" width="280" height="200" rx="10" fill="var(--bg-surface)" stroke="var(--charcoal)" stroke-width="8"/>
                <line x1="60" y1="70" x2="340" y2="70" stroke="var(--charcoal)" stroke-width="4"/>
                <circle cx="80" cy="55" r="4" fill="var(--accent-color)"/>
                <circle cx="100" cy="55" r="4" fill="var(--secondary-color)"/>
                <circle cx="120" cy="55" r="4" fill="var(--primary-color)"/>
                
                <!-- Metric Cards -->
                <rect class="anim-pulse" x="80" y="90" width="60" height="40" rx="4" fill="var(--primary-color)"/>
                <rect class="anim-pulse" style="animation-delay: 0.2s;" x="150" y="90" width="60" height="40" rx="4" fill="var(--secondary-color)"/>
                <rect class="anim-pulse" style="animation-delay: 0.4s;" x="220" y="90" width="100" height="40" rx="4" fill="var(--accent-color)"/>
                
                <!-- Main Chart Area -->
                <rect x="80" y="150" width="160" height="70" rx="4" fill="var(--charcoal)" opacity="0.1"/>
                <path class="anim-draw" d="M80 220 L120 180 L160 200 L200 160 L240 170" stroke="var(--primary-color)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                
                <!-- Pie Chart Area -->
                <g transform="translate(280, 185)">
                    <g class="anim-bounce">
                    <circle cx="0" cy="0" r="30" fill="var(--secondary-color)"/>
                    <path d="M0 0 L30 0 A 30 30 0 0 1 0 30 Z" fill="var(--primary-color)"/>
                    <path d="M0 0 L0 -30 A 30 30 0 0 1 30 0 Z" fill="var(--accent-color)"/>
                </g>
                </g>
                
                <!-- Stand -->
                <path d="M160 240 L150 280 H250 L240 240 Z" fill="var(--charcoal)"/>
            </g>
          </svg>