<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            
            <!--Medical / Tech display background-->
            <rect class="anim-float" x="120" y="60" width="160" height="100" rx="10" fill="var(--secondary-color)" opacity="0.1"/>
            <path class="anim-data" d="M140 120 L160 100 L180 130 L200 90 L220 110 L240 80 L260 120" stroke="var(--secondary-color)" stroke-width="3" stroke-linecap="round" fill="none"/>
            <circle class="anim-pulse" cx="240" cy="80" r="5" fill="var(--accent-color)"/>

            <g class="anim-bounce">
                <!-- Arm Base / Shoulder (Human side fading in) -->
                <path d="M70 240 Q100 200 140 220 L160 260 Z" fill="var(--primary-color)" opacity="0.5"/>
                
                <!-- Bionic Upper Arm -->
                <path d="M140 220 L200 180 L220 210 L160 260 Z" fill="var(--charcoal)"/>
                <!-- Upper Arm Plates -->
                <path d="M145 225 L195 190 M155 240 L205 205" stroke="var(--primary-color)" stroke-width="6" stroke-linecap="round"/>
                
                <!-- Mechanical Elbow Joint -->
                <circle cx="210" cy="195" r="15" fill="var(--bg-surface)" stroke="var(--primary-color)" stroke-width="4"/>
                <circle class="anim-rotate"  cx="210" cy="195" r="6" fill="var(--accent-color)"/>
                
                <!-- Bionic Forearm -->
                <path d="M210 195 L280 160 L295 185 L220 215 Z" fill="var(--charcoal)"/>
                <path d="M225 190 L275 165 M235 205 L285 180" stroke="white" stroke-width="4" stroke-linecap="round"/>
                
                <!-- Robotic Hand/Fingers -->
                <path d="M280 160 L310 145 L325 165 L295 185 Z" fill="var(--primary-color)"/>
                <!-- Fingers reaching out -->
                <path d="M310 145 L340 130 M315 155 L350 140 M320 165 L345 155" stroke="var(--charcoal)" stroke-width="6" stroke-linecap="round"/>
            </g>
            
            <!--Glowing Interface from Hand-->
            <path class="anim-draw" d="M350 140 Q370 120 360 90" stroke="var(--accent-color)" stroke-width="3" stroke-dasharray="4 4" fill="none"/>
            <circle class="anim-glow" cx="360" cy="90" r="8" fill="var(--accent-color)"/>
          </svg>