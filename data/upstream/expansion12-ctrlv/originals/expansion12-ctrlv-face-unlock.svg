<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Corner Brackets -->
        <g class="anim-draw">
            <path d="M100 80 L100 60 L120 60 M280 60 L300 60 L300 80 M100 220 L100 240 L120 240 M280 240 L300 240 L300 220" stroke="var(--primary-color)" stroke-width="3" stroke-linecap="round"/>
        </g>
        
        <!-- Face Silhouette -->
        <g class="anim-float">
            <path d="M150 120 C150 80 250 80 250 120 C250 160 230 220 200 220 C170 220 150 160 150 120 Z" fill="var(--bg-surface)" stroke="var(--primary-color)" stroke-width="2" opacity="0.3"/>
            
            <!-- Biometric Points -->
            <g class="anim-pulse">
                <circle cx="180" cy="120" r="2" fill="var(--secondary-color)"/>
                <circle cx="220" cy="120" r="2" fill="var(--secondary-color)"/>
                <circle cx="200" cy="150" r="2" fill="var(--secondary-color)"/>
                <circle cx="180" cy="180" r="2" fill="var(--secondary-color)"/>
                <circle cx="220" cy="180" r="2" fill="var(--secondary-color)"/>
            </g>
        </g>

        <!-- Scanning Beam -->
        <g class="anim-scan">
            <rect x="90" y="150" width="220" height="2" fill="var(--secondary-color)" opacity="0.8"/>
            <rect x="90" y="146" width="220" height="10" fill="url(#scanGradient)" opacity="0.4"/>
        </g>
        
        <defs>
            <linearGradient id="scanGradient" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="var(--secondary-color)" stop-opacity="0" />
                <stop offset="50%" stop-color="var(--secondary-color)" stop-opacity="1" />
                <stop offset="100%" stop-color="var(--secondary-color)" stop-opacity="0" />
            </linearGradient>
        </defs>
    </svg>