<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g class="anim-float">
                <!-- Headband -->
                <path d="M120 160 C120 80 280 80 280 160" stroke="var(--primary-color)" stroke-width="15" stroke-linecap="round" fill="none"/>
                
                <!-- Earcups -->
                <rect class="anim-pulse" x="100" y="140" width="30" height="70" rx="15" fill="var(--secondary-color)"/>
                <rect class="anim-pulse" style="animation-delay: 0.3s;" x="270" y="140" width="30" height="70" rx="15" fill="var(--secondary-color)"/>
                <rect x="110" y="150" width="30" height="50" rx="10" fill="var(--charcoal)"/>
                <rect x="260" y="150" width="30" height="50" rx="10" fill="var(--charcoal)"/>
                
                <!-- Microphone Boom -->
                <path class="anim-bounce"  d="M115 175 Q115 220 160 210" stroke="var(--primary-color)" stroke-width="8" stroke-linecap="round" fill="none"/>
                
                <!-- Mic element -->
                <circle class="anim-glow" cx="165" cy="208" r="8" fill="var(--accent-color)"/>
                
                <!-- Sound waves -->
                <g class="anim-draw">
                    <path d="M185 208 A 15 15 0 0 1 185 188" stroke="var(--accent-color)" stroke-width="4" stroke-linecap="round" fill="none"/>
                    <path d="M195 215 A 25 25 0 0 1 195 181" stroke="var(--accent-color)" stroke-width="4" stroke-linecap="round" fill="none"/>
                </g>
            </g>
          </svg>