<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g class="anim-float">
                <!-- Large Plate -->
                <circle cx="200" cy="180" r="110" fill="var(--bg-surface)" stroke="var(--primary-color)" stroke-width="4"/>
                
                <!-- Hummus Swirl -->
                <path class="anim-draw" d="M150 180 C150 150 250 150 250 180 C250 210 150 210 150 180" stroke="var(--secondary-color)" stroke-width="20" opacity="0.4" fill="none"/>
                <circle cx="200" cy="180" r="10" fill="var(--accent-color)" opacity="0.6"/>
                
                <!-- Falafel Balls -->
                <g class="anim-bounce">
                    <circle cx="140" cy="160" r="18" fill="var(--charcoal)" opacity="0.9"/>
                    <circle cx="260" cy="160" r="18" fill="var(--charcoal)" opacity="0.9"/>
                    <circle cx="200" cy="220" r="18" fill="var(--charcoal)" opacity="0.9"/>
                </g>
                
                <!-- Pita Bread -->
                <path d="M100 200 Q130 140 160 200 Z" fill="var(--secondary-color)" opacity="0.8"/>
                <path d="M240 200 Q270 140 300 200 Z" fill="var(--secondary-color)" opacity="0.8"/>
            </g>
          </svg>