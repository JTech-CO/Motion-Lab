<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g style="animation-duration: 6s;" class="anim-float">
                <!-- Timber Block -->
                <g class="anim-bounce" style="animation-duration: 8s;">
                    <!-- Right half (falling slightly) -->
                    <g transform="translate(190, 180) rotate(5)">
                        <rect x="0" y="0" width="100" height="80" fill="var(--bg-surface)" stroke="var(--charcoal)" stroke-width="8"/>
                        <!-- Rings -->
                        <path d="M100 0 C60 0 60 80 100 80" stroke="var(--charcoal)" stroke-width="4" fill="none" opacity="0.4"/>
                        <path d="M100 20 C80 20 80 60 100 60" stroke="var(--charcoal)" stroke-width="4" fill="none" opacity="0.4"/>
                    </g>
                </g>
                <!-- Left half (Static) -->
                <g transform="translate(70, 180)">
                    <rect x="0" y="0" width="120" height="80" fill="var(--bg-surface)" stroke="var(--charcoal)" stroke-width="8"/>
                    <!-- Rings -->
                    <path d="M0 0 C40 0 40 80 0 80" stroke="var(--charcoal)" stroke-width="4" fill="none" opacity="0.4"/>
                    <path d="M0 20 C20 20 20 60 0 60" stroke="var(--charcoal)" stroke-width="4" fill="none" opacity="0.4"/>
                </g>
                
                <!-- Sawdust -->
                <circle style="animation-duration: 4s;" class="anim-pulse" cx="190" cy="270" r="4" fill="var(--accent-color)"/>
                <circle class="anim-pulse" style="animation-duration: 4s; animation-delay: 0.2s;" cx="205" cy="265" r="3" fill="var(--accent-color)"/>
                <circle class="anim-pulse" style="animation-duration: 4s; animation-delay: 0.4s;" cx="175" cy="268" r="5" fill="var(--accent-color)"/>
                
                <!-- Saw -->
                <g transform="translate(0, 0)">
                    <g class="anim-rotate" style="transform-origin: 300px 100px; animation-duration: 2s; animation-iteration-count: infinite; animation-direction: alternate;">
                        <!-- Saw Blade -->
                        <path d="M140 260 L140 240 L300 80 L320 100 Z" fill="var(--primary-color)" stroke="var(--charcoal)" stroke-width="4"/>
                        <!-- Teeth -->
                        <path d="M140 260 L145 250 L150 250 L150 240 L160 240 L160 230 L170 230" stroke="var(--charcoal)" stroke-width="2" fill="none" opacity="0.5"/>
                        <!-- Handle -->
                        <path d="M280 80 L260 40 C260 20 300 10 320 20 L350 60 C370 80 340 120 320 100 Z" fill="var(--secondary-color)" stroke="var(--charcoal)" stroke-width="6"/>
                        <!-- Handle Grip Hole -->
                        <ellipse cx="300" cy="65" rx="10" ry="20" fill="var(--bg-surface)" stroke="var(--charcoal)" stroke-width="4" transform="rotate(-45, 300, 65)"/>
                        <!-- Screws -->
                        <circle cx="280" cy="50" r="3" fill="var(--bg-surface)"/>
                        <circle cx="330" cy="80" r="3" fill="var(--bg-surface)"/>
                    </g>
                </g>
            </g>
          </svg>