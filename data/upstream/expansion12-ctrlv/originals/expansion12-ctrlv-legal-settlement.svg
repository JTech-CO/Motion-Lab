<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g class="anim-bounce">
                <!-- Desk/Document -->
                <rect x="150" y="180" width="100" height="60" fill="var(--bg-surface)" stroke="var(--charcoal)" stroke-width="4"/>
                <path d="M160 200 H240 M160 220 H200" stroke="var(--charcoal)" stroke-width="4" stroke-linecap="round"/>
                
                <!-- Handshake Shake effect -->
                <g class="anim-rotate" >
                    <!-- Left Sleeve & Hand -->
                    <path class="anim-draw" d="M60 120 L160 140" stroke="var(--primary-color)" stroke-width="30" stroke-linecap="round"/>
                    <path d="M140 140 C140 120 190 120 200 140 C190 160 140 160 140 140 Z" fill="var(--secondary-color)"/>
                    
                    <!-- Right Sleeve & Hand -->
                    <path class="anim-draw" d="M340 120 L240 140" stroke="var(--charcoal)" stroke-width="30" stroke-linecap="round"/>
                    <path d="M260 140 C260 120 210 120 200 140 C210 160 260 160 260 140 Z" fill="var(--accent-color)" opacity="0.8"/>
                </g>
                <circle class="anim-pulse" cx="200" cy="140" r="20" fill="var(--accent-color)" opacity="0.3"/>
            </g>
          </svg>