<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g class="anim-float">
                <!-- Paper -->
                <rect x="120" y="60" width="160" height="200" rx="5" fill="var(--bg-surface)" stroke="var(--charcoal)" stroke-width="4"/>
                <path d="M120 80 H280 M120 100 H280" stroke="var(--primary-color)" stroke-width="20" opacity="0.1"/>
                
                <!-- Lines -->
                <path d="M140 100 H260 M140 130 H260 M140 160 H230" stroke="var(--charcoal)" stroke-width="6" stroke-linecap="round"/>
                
                <!-- Signature Line -->
                <path d="M180 220 H260" stroke="var(--accent-color)" stroke-width="4" stroke-linecap="round" stroke-dasharray="4 4"/>
                
                <!-- Signature Animation -->
                <path class="anim-draw" d="M190 210 Q200 190 210 210 T230 200 T250 210" stroke="var(--primary-color)" stroke-width="4" stroke-linecap="round" fill="none"/>
                
                <!-- Stylized Pen -->
                <g class="anim-bounce" >
                    <path d="M300 120 L270 180 L250 210 L260 190 L320 130 Z" fill="var(--secondary-color)"/>
                    <path d="M250 210 L270 180 L260 190 Z" fill="var(--accent-color)"/>
                    <circle cx="250" cy="210" r="2" fill="var(--primary-color)"/>
                </g>
            </g>
          </svg>