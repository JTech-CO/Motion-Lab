<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path class="anim-float" d="M120 150 Q180 50 250 150 T330 250 Q200 280 120 150 Z" fill="var(--primary-color)" opacity="0.08"/>
            <g class="anim-float">
                <!-- Watch Band -->
                <rect x="160" y="40" width="80" height="220" rx="10" fill="var(--primary-color)" opacity="0.9"/>
                <!-- Watch Body -->
                <rect x="140" y="90" width="120" height="120" rx="30" fill="var(--charcoal)"/>
                <rect x="150" y="100" width="100" height="100" rx="20" fill="white"/>
                <!-- Activity Rings -->
                <circle cx="200" cy="150" r="35" stroke="#E2E8F0" stroke-width="8" fill="none"/>
                <path class="anim-draw" d="M200 115 A35 35 0 1 1 165 150" stroke="var(--primary-color)" stroke-width="8" stroke-linecap="round" fill="none"/>
                
                <circle cx="200" cy="150" r="22" stroke="#E2E8F0" stroke-width="8" fill="none"/>
                <path class="anim-draw" d="M200 128 A22 22 0 1 1 222 150" stroke="var(--secondary-color)" stroke-width="8" stroke-linecap="round" fill="none" style="animation-delay: -0.5s"/>
                
                <circle cx="200" cy="150" r="9" fill="var(--accent-color)" opacity="0.8"/>
                
                <!-- Side Button -->
                <rect x="255" y="130" width="8" height="24" rx="4" fill="var(--secondary-color)"/>
            </g>
            <circle class="anim-glow" cx="280" cy="100" r="10" fill="var(--accent-color)" opacity="0.6"/>
          </svg>