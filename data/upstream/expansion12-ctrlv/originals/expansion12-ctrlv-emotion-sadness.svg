              <path d="M165 120 Q175 130 185 120" stroke="var(--bg-surface)" stroke-width="6" stroke-linecap="round" fill="none"/>
              <path d="M215 120 Q225 130 235 120" stroke="var(--bg-surface)" stroke-width="6" stroke-linecap="round" fill="none"/>
              <!-- Frown -->
              <path d="M160 175 Q200 155 240 175" stroke="var(--bg-surface)" stroke-width="8" stroke-linecap="round" fill="none"/>
              <!-- Furrowed brow -->
              <path d="M158 105 Q170 98 183 105 M217 105 Q230 98 242 105" stroke="var(--bg-surface)" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.6"/>
            </g>
            <!-- Tears falling -->
            <g class="anim-data" fill="var(--accent-color)">
              <ellipse cx="178" cy="175" rx="5" ry="8"/>
              <ellipse cx="222" cy="175" rx="5" ry="8"/>
            </g>
            <!-- Rain clouds -->
            <g class="anim-float" style="animation-delay:-1s;" fill="var(--charcoal)" opacity="0.15">
              <circle cx="90" cy="70" r="25"/>
              <circle cx="115" cy="60" r="30"/>
              <circle cx="140" cy="70" r="22"/>
