<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g class="anim-float">
                <rect class="anim-pulse" x="120" y="180" width="30" height="60" rx="2" fill="var(--secondary-color)"/>
                <rect class="anim-pulse" style="animation-delay: 0.2s;" x="160" y="140" width="30" height="100" rx="2" fill="var(--primary-color)"/>
                <rect class="anim-pulse" style="animation-delay: 0.4s;" x="200" y="100" width="30" height="140" rx="2" fill="var(--primary-color)"/>
                <rect class="anim-pulse" style="animation-delay: 0.6s;" x="240" y="160" width="30" height="80" rx="2" fill="var(--secondary-color)"/>
                
                <g class="anim-bounce">
                    <circle cx="215" cy="115" r="40" stroke="var(--charcoal)" stroke-width="10" fill="none" opacity="0.8"/>
                    <circle cx="215" cy="115" r="30" fill="rgba(255,255,255,0.4)"/>
                    <line x1="245" y1="145" x2="280" y2="180" stroke="var(--charcoal)" stroke-width="12" stroke-linecap="round"/>
                    <circle cx="215" cy="115" r="15" fill="var(--accent-color)"/>
                </g>
                <path d="M100 240 H280" stroke="var(--charcoal)" stroke-width="6" stroke-linecap="round"/>
            </g>
          </svg>