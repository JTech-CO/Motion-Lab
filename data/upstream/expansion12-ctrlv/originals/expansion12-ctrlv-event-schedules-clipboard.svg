<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g class="anim-float">
                <!-- Clipboard -->
                <rect x="100" y="50" width="200" height="230" rx="4" fill="var(--bg-surface)" stroke="var(--charcoal)" stroke-width="8"/>
                <rect x="150" y="35" width="100" height="30" rx="10" fill="var(--charcoal)"/>
                
                <!-- Time Slots -->
                <g class="anim-draw">
                    <text x="120" y="100" font-family="monospace" font-weight="bold" font-size="14" fill="var(--primary-color)">09:00</text>
                    <line x1="180" y1="95" x2="280" y2="95" stroke="var(--charcoal)" stroke-width="4" opacity="0.3"/>
                    
                    <text x="120" y="140" font-family="monospace" font-weight="bold" font-size="14" fill="var(--primary-color)">11:00</text>
                    <line x1="180" y1="135" x2="280" y2="135" stroke="var(--charcoal)" stroke-width="4" opacity="0.3"/>
                    <rect x="180" y="145" width="90" height="15" rx="4" fill="var(--secondary-color)" opacity="0.4"/>
                    
                    <text x="120" y="190" font-family="monospace" font-weight="bold" font-size="14" fill="var(--primary-color)">14:00</text>
                    <line x1="180" y1="185" x2="280" y2="185" stroke="var(--charcoal)" stroke-width="4" opacity="0.3"/>
                    
                    <text x="120" y="240" font-family="monospace" font-weight="bold" font-size="14" fill="var(--primary-color)">16:00</text>
                    <path class="anim-pulse" d="M180 235 H280" stroke="var(--accent-color)" stroke-width="8" stroke-linecap="round"/>
                </g>
            </g>
          </svg>