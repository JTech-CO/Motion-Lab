<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g class="anim-float">
                <!-- Laptop -->
                <rect x="80" y="80" width="240" height="150" rx="10" fill="var(--bg-surface)" stroke="var(--charcoal)" stroke-width="8"/>
                <path d="M50 230 L350 230 L340 250 H60 Z" fill="var(--charcoal)"/>
                
                <!-- Screen Content -->
                <rect x="100" y="100" width="200" height="20" rx="2" fill="var(--primary-color)" opacity="0.3"/>
                
                <!-- Flowing Text Blocks -->
                <g class="anim-draw">
                    <rect x="100" y="130" width="120" height="10" rx="2" fill="var(--charcoal)" opacity="0.2"/>
                    <rect x="100" y="150" width="180" height="10" rx="2" fill="var(--charcoal)" opacity="0.2"/>
                    <rect x="100" y="170" width="150" height="10" rx="2" fill="var(--charcoal)" opacity="0.2"/>
                    <rect x="100" y="190" width="190" height="10" rx="2" fill="var(--secondary-color)" opacity="0.4"/>
                </g>
                
                <!-- Pen/Quill Inspiration -->
                <g transform="translate(320, 150) rotate(-45)">
                    <g class="anim-bounce">
                    <path d="M0 0 L10 60 L-10 60 Z" fill="var(--accent-color)"/>
                    <path d="M0 -60 Q20 -30 0 0 Q-20 -30 0 -60" fill="var(--primary-color)"/>
                    <path d="M0 -60 V-10" stroke="var(--bg-surface)" stroke-width="2"/>
                </g>
                </g>
            </g>
          </svg>