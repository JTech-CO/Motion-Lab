<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Water lines -->
            <path class="anim-draw" d="M80 220 Q140 250 200 220 T320 220" stroke="var(--primary-color)" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.3"/>
            <g class="anim-wave">
                <circle cx="200" cy="160" r="80" stroke="var(--secondary-color)" stroke-width="40" fill="none"/>
                <path d="M200 60 A 100 100 0 0 1 300 160 A 20 20 0 0 1 260 160 A 60 60 0 0 0 200 100 A 20 20 0 0 1 200 60 Z" fill="var(--accent-color)"/>
                <path d="M200 260 A 100 100 0 0 1 100 160 A 20 20 0 0 1 140 160 A 60 60 0 0 0 200 220 A 20 20 0 0 1 200 260 Z" fill="var(--accent-color)"/>
                <circle class="anim-glow" cx="140" cy="100" r="10" fill="white" opacity="0.6"/>
            </g>
            <style>
                .anim-wave {
                    animation: floatRing 3s infinite ease-in-out alternate;
                    transform-origin: 200px 160px;
                }
                @keyframes floatRing {
                    0% { transform: translateY(0) rotate(-5deg); }
                    100% { transform: translateY(-20px) rotate(5deg); }
                }
            </style>
          </svg>