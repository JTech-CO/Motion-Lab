<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="200" cy="270" rx="100" ry="10" fill="#E2E8F0" opacity="0.6"/>
            <!-- Central Support Structure -->
            <path d="M200 260 V60" stroke="var(--charcoal)" stroke-width="4" stroke-opacity="0.2" stroke-dasharray="10 10"/>
            <!-- Vines -->
            <path class="anim-draw" d="M160 260 Q120 200 200 160 T200 60" stroke="var(--primary-color)" stroke-width="14" stroke-linecap="round" fill="none"/>
            <path class="anim-draw" d="M240 260 Q280 200 200 160 T200 60" stroke="var(--primary-color)" stroke-width="14" stroke-linecap="round" fill="none" style="animation-delay: -0.5s"/>
            <!-- Heart Bloom -->
            <g class="anim-bounce">
                <path d="M200 80 C200 80 180 50 200 30 C220 50 200 80 200 80 Z" fill="var(--secondary-color)"/>
                <circle cx="193" cy="45" r="12" fill="var(--secondary-color)"/>
                <circle cx="207" cy="45" r="12" fill="var(--secondary-color)"/>
            </g>
            <circle class="anim-glow" cx="160" cy="180" r="8" fill="var(--accent-color)"/>
            <circle class="anim-glow" cx="240" cy="140" r="6" fill="var(--accent-color)" style="animation-delay: -1s"/>
          </svg>