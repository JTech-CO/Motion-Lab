<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g class="anim-float">
                <!-- Clap Lines -->
                <path class="anim-pulse" d="M140 60 L120 30 M200 50 V20 M260 60 L280 30" stroke="var(--accent-color)" stroke-width="8" stroke-linecap="round"/>
                
                <!-- Left Hand -->
                <g class="anim-rotate" >
                    <path d="M120 220 L160 120 A 20 20 0 0 1 200 120 L180 200 Z" fill="var(--primary-color)"/>
                    <path d="M125 150 L140 100 A 15 15 0 0 1 170 100 L150 160 Z" fill="var(--primary-color)"/>
                    <path d="M110 180 L120 110 A 15 15 0 0 1 150 110 L140 180 Z" fill="var(--primary-color)"/>
                </g>
                
                <!-- Right Hand -->
                <g class="anim-rotate" >
                    <path d="M280 220 L240 120 A 20 20 0 0 0 200 120 L220 200 Z" fill="var(--secondary-color)"/>
                    <path d="M275 150 L260 100 A 15 15 0 0 0 230 100 L250 160 Z" fill="var(--secondary-color)"/>
                    <path d="M290 180 L280 110 A 15 15 0 0 0 250 110 L260 180 Z" fill="var(--secondary-color)"/>
                </g>
            </g>
          </svg>