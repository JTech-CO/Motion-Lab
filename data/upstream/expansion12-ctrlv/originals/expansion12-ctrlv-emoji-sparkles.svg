<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g class="anim-float">
                <!-- Big Sparkle -->
                <g transform="translate(180, 140) scale(1.5)">
                    <path class="anim-pulse" d="M0 -40 Q0 0 40 0 Q0 0 0 40 Q0 0 -40 0 Q0 0 0 -40 Z" fill="var(--accent-color)"/>
                    <circle cx="0" cy="0" r="5" fill="var(--bg-surface)"/>
                </g>
                <!-- Medium Sparkle -->
                <g transform="translate(100, 80)">
                    <g class="anim-pulse" style="animation-delay: 0.2s;">
                    <path d="M0 -30 Q0 0 30 0 Q0 0 0 30 Q0 0 -30 0 Q0 0 0 -30 Z" fill="var(--secondary-color)"/>
                </g>
                </g>
                <!-- Small Sparkle -->
                <g transform="translate(280, 200)">
                    <g class="anim-pulse" style="animation-delay: 0.4s;">
                    <path d="M0 -20 Q0 0 20 0 Q0 0 0 20 Q0 0 -20 0 Q0 0 0 -20 Z" fill="var(--primary-color)"/>
                </g>
                </g>
                <!-- Tiny Stars -->
                <circle cx="260" cy="80" r="4" fill="var(--accent-color)"/>
                <circle cx="120" cy="220" r="3" fill="var(--secondary-color)"/>
            </g>
          </svg>